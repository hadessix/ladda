<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>น้องลัดดา</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="น้องลัดดา">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;
  --border:#2a3348;--border2:#3a4560;
  --text:#f0f4fc;--text2:#b8c2d4;--text3:#8a95ab;
  --green:#22c55e;--gdim:#0f3d20;--gbr:#1a6635;
  --blue:#3b82f6;--bdim:#0d2456;--bbr:#1e3a8a;
  --amber:#f59e0b;--adim:#3d2700;--abr:#92400e;
  --red:#ef4444;--rdim:#3d0d0d;--rbr:#7f1d1d;
  --purple:#a855f7;--pdim:#2d1b4e;--pbr:#6b21a8;
  --font:'Sarabun',sans-serif;--mono:'IBM Plex Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;min-height:100vh;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
#app{display:flex;flex-direction:column;min-height:100vh;}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.logo{font-size:18px;font-weight:700;color:var(--green);}
.total-badge{background:var(--gdim);border:1px solid var(--gbr);color:var(--green);padding:6px 14px;border-radius:8px;font-family:var(--mono);}
.total-badge span{font-size:13px;color:var(--text2);display:block;line-height:1;}
.tabs-bar{display:flex;gap:4px;padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;}
.tab-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:var(--font);font-size:14px;white-space:nowrap;}
.tab-btn.active{background:var(--bdim);border-color:var(--bbr);color:var(--blue);}
main{display:flex;flex:1;overflow:hidden;}
.sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);padding:12px 0;flex-shrink:0;overflow-y:auto;}
.si{display:flex;align-items:center;gap:8px;padding:13px 16px;cursor:pointer;border-left:3px solid transparent;}
.si:hover{background:var(--bg3);}
.si.active{background:var(--bg3);border-left-color:var(--green);}
.si.active .sn{color:var(--green);}
.sn{font-size:15px;font-weight:500;flex:1;}
.sa{font-size:14px;font-family:var(--mono);color:var(--text2);}
.ssec{padding:10px 16px 5px;font-size:13px;color:var(--text3);letter-spacing:1px;}
.sadd{margin:8px 12px;padding:8px;border:1px dashed var(--border2);border-radius:6px;background:transparent;color:var(--text2);font-family:var(--font);font-size:13px;cursor:pointer;width:calc(100% - 24px);}
.sadd:hover{border-color:var(--gbr);color:var(--green);}
.content{flex:1;overflow-y:auto;padding:20px;}
/* summary */
.mhdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.mtitle{font-size:18px;font-weight:600;}
.mperiod{font-size:13px;color:var(--text3);margin-top:2px;}
.abtns{display:flex;gap:6px;flex-wrap:wrap;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;}
.sc .lb{font-size:13px;color:var(--text2);margin-bottom:4px;}
.sc .vl{font-size:17px;font-family:var(--mono);font-weight:500;}
/* buttons */
.btn{padding:10px 18px;border-radius:7px;border:1px solid;cursor:pointer;font-family:var(--font);font-size:15px;font-weight:500;}
.btn:hover{filter:brightness(1.15);}
.btn:active{transform:scale(.97);}
.btn-g{background:var(--gdim);border-color:var(--gbr);color:var(--green);}
.btn-b{background:var(--bdim);border-color:var(--bbr);color:var(--blue);}
.btn-a{background:var(--adim);border-color:var(--abr);color:var(--amber);}
.btn-p{background:var(--pdim);border-color:var(--pbr);color:var(--purple);}
.btn-x{background:var(--bg3);border-color:var(--border2);color:var(--text2);}
.btn-sm{padding:5px 10px;font-size:13px;}
/* cumulative bills */
.cumul{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:16px;}
.cumul .clb{font-size:13px;color:var(--text2);margin-bottom:6px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
/* pills */
.pill{display:inline-block;padding:2px 7px;border-radius:4px;font-size:13px;font-family:var(--mono);}
.p1000{background:#1a2a1a;color:#6ee7b7;}
.p500{background:#1a1a2a;color:#93c5fd;}
.p100{background:#2a1a0a;color:#fcd34d;}
.p50{background:#2a0a1a;color:#f9a8d4;}
.p20{background:#0a1a2a;color:#67e8f9;}
.pcoin{background:#2a1a00;color:#fb923c;}
/* open session */
.sess{border:1px solid var(--gbr);border-radius:10px;margin-bottom:14px;overflow:hidden;}
.sess-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--gdim);gap:8px;flex-wrap:wrap;}
.sess-title{font-size:14px;color:var(--green);font-weight:600;}
.sess-sub{font-size:13px;color:var(--text2);margin-top:2px;}
.sess-btns{display:flex;gap:6px;}
.sub-row{padding:10px 14px;border-top:1px solid var(--border);}
.sub-rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.sub-rl{font-size:14px;color:var(--text2);font-weight:500;}
.sub-ra{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--green);}
/* entry cards */
.ecard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.ehd{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--bg3);cursor:pointer;user-select:none;}
.badge{font-size:12px;padding:3px 8px;border-radius:5px;font-weight:500;flex-shrink:0;border:1px solid;}
.bcount{background:var(--gdim);border-color:var(--gbr);color:var(--green);}
.binc{background:var(--bdim);border-color:var(--bbr);color:var(--blue);}
.bexp{background:var(--adim);border-color:var(--abr);color:var(--amber);}
.bexin{background:var(--pdim);border-color:var(--pbr);color:var(--purple);}
.bexout{background:var(--pdim);border-color:var(--pbr);color:var(--purple);}
.edt{font-size:13px;color:var(--text3);flex-shrink:0;}
.ett{flex:1;font-size:15px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.eam{font-family:var(--mono);font-size:15px;font-weight:500;flex-shrink:0;}
.pos{color:var(--green);}
.neg{color:var(--red);}
.neu{color:var(--text2);}
.ebody{padding:14px;display:none;}
.ebody.open{display:block;}
.delbtn{background:var(--rdim);border:1px solid var(--rbr);color:var(--red);border-radius:5px;padding:4px 10px;font-size:13px;cursor:pointer;flex-shrink:0;}
/* bill table */
.btbl{width:100%;border-collapse:collapse;font-size:14px;}
.btbl th{text-align:left;color:var(--text2);padding:6px 8px;border-bottom:1px solid var(--border);font-weight:500;}
.btbl td{padding:6px 8px;border-bottom:1px solid var(--border);}
.btbl .nr{text-align:right;font-family:var(--mono);}
.btbl tfoot td{font-weight:600;color:var(--green);border-top:2px solid var(--border2);}
.sumbox{background:var(--bg);border:1px solid var(--gbr);border-radius:8px;padding:12px 14px;margin-top:10px;}
.sumbox-t{font-size:13px;color:var(--green);font-weight:600;margin-bottom:8px;}
.notetxt{font-size:13px;color:var(--text2);margin-top:8px;padding:7px 10px;background:var(--bg);border-radius:6px;border-left:2px solid var(--border2);}
.slbl{font-size:13px;color:var(--text3);letter-spacing:1px;margin:14px 0 8px;}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:stretch;justify-content:stretch;padding:0;}
.modal{background:var(--bg2);width:100%;max-width:100%;height:100%;max-height:100%;display:flex;flex-direction:column;border-radius:0;overflow:hidden;}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.mhd h2{font-size:20px;font-weight:600;}
.mclose{background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:28px;padding:4px 10px;line-height:1;}
.mclose:hover{color:var(--text);}
.mbody{padding:24px;overflow-y:auto;flex:1;}
.mfoot{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--border);flex-shrink:0;}
.fg{margin-bottom:18px;}
.flbl{display:block;font-size:15px;color:var(--text2);margin-bottom:6px;}
.finp{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:16px;}
.finp:focus{outline:none;border-color:var(--bbr);}
.fsel{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:16px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.dc-wrap{margin-bottom:12px;}
.dc-mlbl{font-size:12px;color:var(--text3);margin-bottom:6px;font-weight:500;}
.dc-row{display:flex;flex-wrap:wrap;gap:4px;}
.dc-cell{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:14px;font-family:var(--mono);font-weight:500;transition:background .1s;}
.dc-used{background:var(--bg2);color:var(--text3);border:1px solid var(--border);cursor:not-allowed;text-decoration:line-through;}
.dc-avail{background:var(--bg3);color:var(--text);border:1px solid var(--border2);cursor:pointer;}
.dc-avail:hover{border-color:var(--gbr);color:var(--green);}
.dc-start,.dc-end{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important;}
.dc-range{background:var(--gdim)!important;border-color:var(--gbr)!important;color:var(--green)!important;}
.dc-sel-info{font-size:13px;color:var(--text2);margin-top:10px;min-height:20px;padding:6px 10px;background:var(--bg2);border-radius:6px;}
.bcell{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.bcell label{display:block;margin-bottom:4px;}
.bcell input{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:18px;font-weight:500;}
.bcell input:focus{outline:none;}
.bsub{font-size:15px;color:var(--text);margin-top:3px;font-family:var(--mono);}
.tbar{background:var(--bg);border:1px solid var(--gbr);border-radius:8px;padding:10px 14px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;}
.tbar .tl{font-size:13px;color:var(--text2);}
.tbar .tv{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--green);}
/* exchange two-column layout */
.exch-cols{display:grid;grid-template-columns:1fr 40px 1fr;gap:0;align-items:start;}
.exch-col{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.exch-col-hd{padding:10px 12px;font-size:13px;font-weight:600;}
.exch-col-body{padding:12px;}
.exch-mid{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--purple);padding-top:40px;}
.exch-sel-bar{display:flex;gap:8px;margin-bottom:10px;}
.exch-sel-bar select{flex:1;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:13px;}
.tbar-sm{background:var(--bg);border:1px solid var(--gbr);border-radius:7px;padding:8px 12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;}
.tbar-sm .tl{font-size:12px;color:var(--text2);}
.tbar-sm .tv{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--green);}
.bgrid2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
/* exchange single-column grid — rows align across left/right columns */
.bgrid-ex{display:grid;grid-template-columns:1fr;gap:0;}
.bgrid-ex .bcell{border-radius:0;border-left:none;border-right:none;border-top:none;border-bottom:1px solid var(--border);background:transparent;padding:10px 12px;}
.bgrid-ex .bcell:first-child{border-top:1px solid var(--border);}
.bgrid-ex .bcell label{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.bgrid-ex .bcell input{font-size:20px;width:100%;}
.bgrid-ex .bsub{font-size:15px;color:var(--text);margin-top:2px;}
.exch-col-body{padding:0;}
/* make both columns same height rows by using CSS grid on the outer cols */
.exch-cols{display:grid;grid-template-columns:1fr 36px 1fr;gap:0;align-items:start;}
.exch-rows{display:grid;grid-template-columns:1fr 36px 1fr;gap:0;}
.exch-row-mid{display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--border);}
.empty{text-align:center;padding:48px 20px;color:var(--text3);}
.empty .ei{font-size:36px;margin-bottom:8px;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:10px 16px;font-size:13px;z-index:9999;animation:si .2s ease;color:var(--text);max-width:280px;}
@keyframes si{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
/* OVERVIEW SCREEN */
#overview-screen{position:fixed;inset:0;z-index:1500;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;}
.ov-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
.ov-logo{font-size:16px;font-weight:700;color:var(--green);}
.ov-mnav{display:flex;align-items:center;gap:8px;}
.ov-mnav button{background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.ov-mnav span{font-size:13px;font-weight:600;min-width:130px;text-align:center;}
.ov-acts{display:flex;align-items:center;gap:8px;}
.ov-xbtn{font-size:12px;padding:4px 10px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:6px;cursor:pointer;}
.ov-body{padding:16px;max-width:960px;margin:0 auto;width:100%;box-sizing:border-box;}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px;}
.ov-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.ov-card-hd{padding:10px 14px;background:var(--bg3);}
.ov-shop-nm{font-size:14px;font-weight:700;}
.ov-stats{padding:12px 14px;display:flex;flex-direction:column;gap:7px;}
.ov-stat{display:flex;justify-content:space-between;align-items:center;}
.ov-sl{font-size:12px;color:var(--text2);}
.ov-sv{font-size:13px;font-family:var(--mono);font-weight:600;}
.ov-divider{border-top:1px solid var(--border);padding-top:7px;margin-top:3px;}
.ov-total{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;}
.ov-total-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.ov-total-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ov-total-row>div{display:flex;flex-direction:column;gap:2px;}
.ov-total-row span{font-size:11px;color:var(--text3);}
.ov-total-row strong{font-size:15px;font-family:var(--mono);font-weight:700;}
.role-viewer{background:#0d3320;border-color:#1a5535;color:#4ade80;}
.ov-vis-btn{font-size:11px;padding:2px 7px;border-radius:4px;cursor:pointer;border:1px solid;transition:.1s;flex-shrink:0;}
.ov-vis-on{background:var(--gdim);border-color:var(--gbr);color:var(--green);}
.ov-vis-off{background:var(--bg);border-color:var(--border);color:var(--text3);}
@media(max-width:600px){.ov-total-row{grid-template-columns:repeat(2,1fr);}.ov-hdr{padding:10px 12px;}}
/* LOGIN */
#login-screen{position:fixed;inset:0;background:url('login-bg.jpg') center 20%/cover no-repeat;z-index:2000;display:flex;align-items:flex-end;justify-content:center;padding:0 16px 36px;}
.login-box{width:100%;max-width:390px;background:rgba(90,45,5,0.52);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,205,60,0.45);border-radius:22px;padding:22px 22px 26px;box-shadow:0 8px 40px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,230,100,0.25);}
.pin-wrap{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.42);border:1px solid rgba(255,200,60,0.35);border-radius:50px;padding:2px 18px;margin-bottom:14px;}
.pin-wrap-icon{font-size:18px;line-height:1;flex-shrink:0;}
.pin-inp{flex:1;background:transparent;border:none;color:#fff;font-size:20px;font-family:var(--mono);letter-spacing:4px;padding:12px 0;outline:none;}
.pin-inp::placeholder{color:rgba(255,255,255,0.35);letter-spacing:2px;font-size:16px;}
.pin-submit{width:100%;padding:14px;border-radius:50px;border:none;background:linear-gradient(135deg,#ffe55a 0%,#f5a520 55%,#c97800 100%);color:#3d1a00;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:2px;box-shadow:0 4px 20px rgba(200,120,0,0.5),inset 0 1px 0 rgba(255,255,180,0.4);transition:opacity .15s,transform .1s;}
.pin-submit:hover{opacity:.9;transform:translateY(-1px);}
.pin-submit:active{transform:translateY(0);}
.pin-submit:disabled{opacity:.6;cursor:default;transform:none;}
.login-err{text-align:center;font-size:13px;color:#ffcc44;min-height:18px;margin-top:12px;}
.login-role-label{text-align:center;font-size:13px;color:rgba(255,220,130,0.85);margin-bottom:14px;}
/* role badge in header */
.role-badge{font-size:11px;padding:3px 8px;border-radius:5px;border:1px solid;cursor:pointer;}
.role-admin{background:var(--adim);border-color:var(--abr);color:var(--amber);}
.role-user{background:var(--bdim);border-color:var(--bbr);color:var(--blue);}
/* shop manage buttons */
.shop-actions{display:flex;gap:4px;margin-left:auto;}
/* group in sidebar */
.grp-box{margin:6px 8px;border:1px solid var(--border2);border-radius:8px;overflow:hidden;}
.grp-hd{display:flex;align-items:center;gap:6px;padding:11px 12px;cursor:pointer;background:var(--bg3);border-left:3px solid transparent;}
.grp-hd:hover{filter:brightness(1.1);}
.grp-hd.active{border-left-color:var(--green);}
.grp-hd.active .grp-name{color:var(--green);}
.grp-name{font-size:15px;font-weight:600;flex:1;}
.grp-amt{font-size:13px;font-family:var(--mono);color:var(--text2);}
.grp-members{background:var(--bg2);}
.grp-member{display:flex;align-items:center;gap:6px;padding:9px 10px 9px 20px;cursor:pointer;border-left:3px solid transparent;font-size:14px;}
.grp-member:hover{background:var(--bg3);}
.grp-member.active{background:var(--bg3);border-left-color:var(--green);color:var(--green);}
.grp-member .sn{flex:1;font-size:14px;}
.grp-member .sa{font-size:12px;font-family:var(--mono);color:var(--text2);}
/* ungrouped section */
.ssec-ungrouped{padding:10px 16px 5px;font-size:13px;color:var(--text3);letter-spacing:1px;margin-top:4px;}
/* group summary content */
.grp-summary-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.grp-route-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.grp-route-card-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg3);cursor:pointer;}
.grp-route-card-body{padding:14px;display:none;}

<script>
// ─── AUTH ───
// No PIN hashes or Supabase keys here — all secrets live in the Cloudflare Worker
const WORKER_URL='https://ladda-api.hades-six.workers.dev';
async function sha256(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
let AUTH={role:null}; // role: 'user' | 'admin'

function authInit(){
  const saved=localStorage.getItem('ladda_role');
  const token=localStorage.getItem('ladda_token');
  if((saved==='user'||saved==='admin'||saved==='viewer')&&token){
    AUTH.role=saved;
    showApp();
  }
  // else login screen stays visible
}

async function pinCheck(){
  const v=(document.getElementById('pin-inp')?.value||'').trim();
  if(!v){document.getElementById('login-err').textContent='กรุณากรอก PIN';return;}
  const btn=document.querySelector('.pin-submit');
  if(btn){btn.disabled=true;btn.textContent='กำลังตรวจสอบ…';}
  try{
    const h=await sha256(v);
    const r=await fetch(`${WORKER_URL}/auth`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hash:h})});
    if(r.ok){
      const{token,role}=await r.json();
      AUTH.role=role;
      localStorage.setItem('ladda_role',role);
      localStorage.setItem('ladda_token',token);
      showApp();
    } else {
      document.getElementById('login-err').textContent='PIN ไม่ถูกต้อง ลองใหม่อีกครั้ง';
      const inp=document.getElementById('pin-inp');if(inp){inp.value='';inp.focus();}
    }
  }catch(err){
    document.getElementById('login-err').textContent='เชื่อมต่อไม่ได้ ลองใหม่';
  }finally{
    if(btn){btn.disabled=false;btn.textContent='🐉 LOG IN';}
  }
}
function showApp(){
  document.getElementById('login-screen').style.display='none';
  if(AUTH.role==='viewer'){
    document.getElementById('app').style.display='none';
    const badge=document.getElementById('ov-badge');
    if(badge){badge.textContent='👁️ ผู้เข้าชม';badge.className='role-badge role-viewer';}
    document.getElementById('overview-screen').style.display='flex';
    loadAll().then(()=>renderOverview());
    return;
  }
  if(AUTH.role==='hr'){
    document.getElementById('app').style.display='none';
    document.getElementById('payroll-screen').style.display='flex';
    const fab=document.getElementById('pr-fab-group');if(fab){fab.style.display='none';}
    // ซ่อน tab งวดจ่าย + ปุ่มนับเงิน, เปลี่ยน badge เป็น HR
    const tabsBar=document.getElementById('pr-tabs-bar');if(tabsBar)tabsBar.style.display='none';
    const hdrRight=document.getElementById('pr-header-right');
    if(hdrRight)hdrRight.innerHTML=`<span class="role-badge role-user" style="cursor:default;">👤 HR</span><button onclick="logout()" class="role-badge" style="background:var(--rdim);border-color:var(--rbr);color:var(--red);cursor:pointer;">ออกจากระบบ</button>`;
    PR.tab='employees';
    if(!PR._loaded){loadPayroll().then(()=>renderPayroll());}
    else renderPayroll();
    return;
  }
  document.getElementById('app').style.display='flex'; // admin/user เท่านั้น
  const btn=document.getElementById('role-btn');
  if(AUTH.role==='admin'){
    btn.textContent='👑 ผู้ดูแล';btn.className='role-badge role-admin';
    const ovbtn=document.getElementById('ov-nav-btn');if(ovbtn)ovbtn.style.display='inline-block';
    const prbtn=document.getElementById('pr-nav-btn');if(prbtn)prbtn.style.display='inline-block';
  } else {
    btn.textContent='👤 ผู้ใช้งาน';btn.className='role-badge role-user';
  }
  btn.title='คลิกเพื่อออกจากระบบ';
  loadAll();
}
function logout(){
  if(!confirm('ออกจากระบบ?'))return;
  localStorage.removeItem('ladda_role');
  localStorage.removeItem('ladda_token');
  AUTH.role=null;
  document.getElementById('login-err').textContent='';
  document.getElementById('overview-screen').style.display='none';
  document.getElementById('payroll-screen').style.display='none';
  document.getElementById('app').style.display='none'; // reset — login screen จะ cover อยู่แล้ว
  const ovbtn=document.getElementById('ov-nav-btn');if(ovbtn)ovbtn.style.display='none';
  const prbtn=document.getElementById('pr-nav-btn');if(prbtn)prbtn.style.display='none';
  PR._loaded=false;
  document.getElementById('login-screen').style.display='flex';
  const inp=document.getElementById('pin-inp');if(inp){inp.value='';inp.focus();}
}
function isAdmin(){return AUTH.role==='admin';}
function isHR(){return AUTH.role==='hr';}

// ─── constants ───
const BT=[1000,500,100,50,20,'coin'];
const BL={1000:'1,000',500:'500',100:'100',50:'50',20:'20',coin:'เหรียญ'};
const BC={1000:'p1000',500:'p500',100:'p100',50:'p50',20:'p20',coin:'pcoin'};
const eb=()=>({1000:0,500:0,100:0,50:0,20:0,coin:0});
const bv=b=>BT.reduce((s,t)=>s+(t==='coin'?1:t)*(b[t]||0),0);
const mkKey=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
const monthLbl=k=>{const[y,m]=k.split('-').map(Number);return['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][m-1]+' '+(y+543);};
const periodLbl=k=>{const[y,m]=k.split('-').map(Number);const nm=m===12?1:m+1,ny=m===12?y+1:y;return`11 ${monthLbl(k)} – 10 ${monthLbl(mkKey(ny,nm))}`;};
function cpk(){const n=new Date(),d=n.getDate(),m=n.getMonth()+1,y=n.getFullYear();return d>=11?mkKey(y,m):(m===1?mkKey(y-1,12):mkKey(y,m-1));}
const fmtMk=k=>{if(k===cpk())return'เดือนนี้';const[,m]=k.split('-').map(Number);return`[${m}] ${['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][m-1]}`;}
const fmt=n=>'฿'+(Math.round(n)).toLocaleString('th-TH');
const fN=n=>(Math.round(n)).toLocaleString('th-TH');
const uid=()=>crypto.randomUUID().replace(/-/g,'');
const today=()=>new Date().toISOString().split('T')[0];

// ─── Worker API helpers (no Supabase keys in source) ───
function _wToken(){return localStorage.getItem('ladda_token')||'';}
async function _wFetch(path,opts={}){
  const headers={'Content-Type':'application/json','Authorization':'Bearer '+_wToken(),...(opts.headers||{})};
  const r=await fetch(`${WORKER_URL}/api/${path}`,{...opts,headers});
  if(r.status===401){logout();throw new Error('session หมดอายุ กรุณา login ใหม่');}
  return r;
}
async function sbGet(table,params=''){
  const r=await _wFetch(`${table}?${params}`);
  if(!r.ok)throw new Error(`sbGet ${table}: ${r.status}`);
  return r.json();
}
async function sbUpsert(table,data,opts=''){
  const r=await _wFetch(`${table}?${opts}`,{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(data)});
  if(!r.ok){const t=await r.text();throw new Error(`sbUpsert ${table}: ${r.status} ${t}`);}
}
async function sbDelete(table,params){
  const r=await _wFetch(`${table}?${params}`,{method:'DELETE'});
  if(!r.ok)throw new Error(`sbDelete ${table}: ${r.status}`);
}

// ─── field mappers ───
function entryToRow(e,route_id,month_key){
  return{id:e.id,route_id,month_key,type:e.type,title:e.title||null,note:e.note||null,
    date_from:e.df||null,date_to:e.dt||null,amount:e.amount??null,total:e.total??null,
    bills:e.bills??null,subs:e.subs??null,other_route_id:e.oid??null};
}
function rowToEntry(r){
  return{id:r.id,type:r.type,title:r.title,note:r.note,df:r.date_from,dt:r.date_to,
    amount:r.amount,total:r.total,bills:r.bills,subs:r.subs,oid:r.other_route_id,ca:r.created_at};
}

// ─── state ───
let S={
  shops:[],
  groups:[],       // [{id,name,sort_order,tab_flags}]
  groupMembers:{}, // {groupId:[routeId,...]}
  entries:{},   // entries[sid][monthKey] = [{...}]
  sessions:{},  // sessions[sid][monthKey] = {subs:[...]} | null
  shop:null,
  view:{type:'shop',id:null}, // type: 'shop'|'group'
  month:cpk(), year:String(new Date().getFullYear())
};

// ─── load all from Supabase ───
async function loadAll(){
  document.getElementById('content').innerHTML='<div class="empty"><div class="ei">⏳</div><p>กำลังโหลดข้อมูล...</p></div>';
  try{
    const [routes,entries,sessions,groups,gMembers]=await Promise.all([
      sbGet('routes','order=sort_order.asc,created_at.asc'),
      sbGet('entries','order=created_at.asc'),
      sbGet('sessions','order=created_at.asc'),
      sbGet('groups','order=sort_order.asc,id.asc'),
      sbGet('group_members','order=sort_order.asc'),
    ]);
    S.shops=routes.map(r=>({id:r.id,name:r.name,color:r.color,tab_flags:r.tab_flags||{count:true,income:true,expense:true,exchange:true,payowner:false},sort_order:r.sort_order||0}));
    S.groups=groups.map(g=>({id:g.id,name:g.name,sort_order:g.sort_order||0,is_owner:g.is_owner||false,tab_flags:g.tab_flags||{count:true,income:true,expense:true,exchange:true,payowner:false}}));
    S.groupMembers={};
    gMembers.forEach(m=>{if(!S.groupMembers[m.group_id])S.groupMembers[m.group_id]=[];S.groupMembers[m.group_id].push(m.route_id);});
    S.entries={};
    entries.forEach(r=>{
      if(!S.entries[r.route_id])S.entries[r.route_id]={};
      if(!S.entries[r.route_id][r.month_key])S.entries[r.route_id][r.month_key]=[];
      S.entries[r.route_id][r.month_key].push(rowToEntry(r));
    });
    S.sessions={};
    sessions.forEach(r=>{
      if(!S.sessions[r.route_id])S.sessions[r.route_id]={};
      S.sessions[r.route_id][r.month_key]={subs:r.subs||[]};
    });
    // set initial view
    if(!S.view.id){
      if(S.groups.length>0){S.view={type:'group',id:S.groups[0].id};}
      else if(S.shops.length>0){S.view={type:'shop',id:S.shops[0].id};S.shop=S.shops[0].id;}
    }
    if(S.view.type==='shop')S.shop=S.view.id;
    render();
  }catch(err){
    document.getElementById('content').innerHTML=`<div class="empty"><div class="ei">❌</div><p>โหลดข้อมูลไม่สำเร็จ<br><small style="color:var(--text3)">${err.message}</small></p></div>`;
    console.error(err);
  }
}


function ge(sid,mk){if(!S.entries[sid])S.entries[sid]={};if(!S.entries[sid][mk])S.entries[sid][mk]=[];return S.entries[sid][mk];}
function gs(sid,mk){return(S.sessions[sid]||{})[mk]||null;}
function ss(sid,mk,v){if(!S.sessions[sid])S.sessions[sid]={};S.sessions[sid][mk]=v;}
function cs(sid,mk){if(S.sessions[sid])delete S.sessions[sid][mk];}

function shopTot(sid,mk){
  const m=mk||S.month;
  let t=0;
  (S.entries[sid]?.[m]||[]).forEach(e=>{
    if(e.type==='count')t+=e.total||0;
    else if(e.type==='income'||e.type==='exin')t+=e.amount||0;
    else if(e.type==='expense'||e.type==='exout')t-=e.amount||0;
  });
  // open sessions
  const sess=S.sessions[sid]?.[m];
  if(sess)sess.subs.forEach(sub=>t+=bv(sub.bills||eb()));
  return t;
}
function grandTot(){return S.shops.reduce((s,sh)=>s+shopTot(sh.id),0);}

function render(){if(window._returnToGroup){S.view={type:'group',id:window._returnToGroup};window._returnToGroup=null;}renderTabs();renderSidebar();renderContent();document.getElementById('gtotal').textContent=fmt(grandTot());}

// helper: รายชื่อ routeId ที่อยู่ในกลุ่มใดกลุ่มหนึ่ง
function groupedRouteIds(){const s=new Set();Object.values(S.groupMembers).forEach(ids=>ids.forEach(id=>s.add(id)));return s;}
// helper: ยอดรวมกลุ่ม
function groupTot(gid,mk){return(S.groupMembers[gid]||[]).reduce((s,id)=>s+shopTot(id,mk),0);}
// helper: tab_flags ของ view ปัจจุบัน
function curTabFlags(){
  if(S.view.type==='group'){const g=S.groups.find(x=>x.id===S.view.id);return g?.tab_flags||{count:true,income:true,expense:true,exchange:true,payowner:false};}
  const sh=S.shops.find(x=>x.id===S.view.id);return sh?.tab_flags||{count:true,income:true,expense:true,exchange:true,payowner:false};
}

let _sbGear=null;
function _sbGearToggle(id,e){e.stopPropagation();_sbGear=(_sbGear===id)?null:id;renderSidebar();}
const _sbBtn=(onclick,icon,bg,br,col)=>`<button onclick="${onclick}" style="background:${bg};border:1px solid ${br};color:${col};border-radius:4px;padding:1px 6px;font-size:11px;cursor:pointer;">${icon}</button>`;

// ── sidebar drag-to-reorder ──
let _sbDragId=null,_sbDragGrpId=null,_sbDragGhost=null,_sbDragOver=null,_sbDragMoved=false,_sbDragStartX=0,_sbDragStartY=0,_sbDragSrc=null,_sbDragOffX=0,_sbDragOffY=0;
function _sbDragStart(e,routeId,groupId){
  e.stopPropagation(); e.preventDefault();
  const t=e.touches?e.touches[0]:e;
  _sbDragId=routeId; _sbDragGrpId=groupId; _sbDragMoved=false; _sbDragGhost=null;
  _sbDragSrc=document.querySelector(`[data-member-id="${routeId}"][data-member-grp="${groupId}"]`);
  _sbDragStartX=t.clientX; _sbDragStartY=t.clientY;
  if(_sbDragSrc){const r=_sbDragSrc.getBoundingClientRect();_sbDragOffX=t.clientX-r.left;_sbDragOffY=t.clientY-r.top;}
}
function _sbDragMove(e){
  if(!_sbDragId)return;
  const t=e.touches?e.touches[0]:e;
  const dx=t.clientX-_sbDragStartX,dy=t.clientY-_sbDragStartY;
  if(!_sbDragMoved&&Math.sqrt(dx*dx+dy*dy)<6)return;
  if(!_sbDragMoved&&_sbDragSrc){
    _sbDragMoved=true;
    const r=_sbDragSrc.getBoundingClientRect();
    _sbDragGhost=_sbDragSrc.cloneNode(true);
    Object.assign(_sbDragGhost.style,{position:'fixed',zIndex:'9999',pointerEvents:'none',width:r.width+'px',height:r.height+'px',opacity:'0.85',left:(t.clientX-_sbDragOffX)+'px',top:(t.clientY-_sbDragOffY)+'px',boxShadow:'0 4px 16px #0009',border:'1px solid var(--amber)',borderRadius:'6px',background:'var(--bg3)'});
    document.body.appendChild(_sbDragGhost);
  }
  if(_sbDragGhost){_sbDragGhost.style.left=(t.clientX-_sbDragOffX)+'px';_sbDragGhost.style.top=(t.clientY-_sbDragOffY)+'px';}
  if(_sbDragGhost)_sbDragGhost.style.display='none';
  const el=document.elementFromPoint(t.clientX,t.clientY);
  if(_sbDragGhost)_sbDragGhost.style.display='';
  const over=el?.closest('[data-member-id]');
  if(_sbDragOver&&_sbDragOver!==over)_sbDragOver.style.outline='';
  _sbDragOver=over&&over.dataset.memberGrp===_sbDragGrpId&&over.dataset.memberId!==_sbDragId?over:null;
  if(_sbDragOver)_sbDragOver.style.outline='2px solid var(--amber)';
  if(e.cancelable)e.preventDefault();
}
async function _sbDragEnd(){
  if(!_sbDragId)return;
  const rid=_sbDragId,gid=_sbDragGrpId,moved=_sbDragMoved,over=_sbDragOver;
  if(_sbDragGhost){_sbDragGhost.remove();_sbDragGhost=null;}
  if(_sbDragOver){_sbDragOver.style.outline='';_sbDragOver=null;}
  _sbDragId=null;_sbDragGrpId=null;_sbDragMoved=false;_sbDragSrc=null;
  if(moved&&over){
    const toId=over.dataset.memberId;
    const members=[...(S.groupMembers[gid]||[])];
    const fi=members.indexOf(rid),ti=members.indexOf(toId);
    if(fi!==-1&&ti!==-1&&fi!==ti){
      members.splice(fi,1);members.splice(ti,0,rid);
      await sbUpsert('group_members',members.map((r,i)=>({group_id:gid,route_id:r,sort_order:i})));
      S.groupMembers[gid]=members;
      _sbGear=null;
      renderSidebar();
      toast('เรียงลำดับสำเร็จ ✓');
    }
  }
}
document.addEventListener('mousemove',e=>{if(_sbDragId)_sbDragMove(e);});
document.addEventListener('mouseup',async()=>{if(_sbDragId)await _sbDragEnd();});
document.addEventListener('touchmove',e=>{if(_sbDragId)_sbDragMove(e);},{passive:false});
document.addEventListener('touchend',async()=>{if(_sbDragId)await _sbDragEnd();});

function renderTabs(){
  const bar=document.getElementById('tabs-bar');
  const cp=cpk();
  const cyear=Number(cp.split('-')[0]);

  // รวบรวม month keys ที่มีข้อมูล + เดือนปัจจุบัน
  const mkSet=new Set([cp]);
  Object.values(S.entries).forEach(byMonth=>{
    Object.keys(byMonth).forEach(mk=>{
      if((byMonth[mk]||[]).length>0)mkSet.add(mk);
    });
  });
  Object.values(S.sessions).forEach(byMonth=>{
    Object.keys(byMonth).forEach(mk=>{if(byMonth[mk])mkSet.add(mk);});
  });

  // จัดกลุ่มตามปี
  const byYear={};
  mkSet.forEach(mk=>{
    const y=mk.split('-')[0];
    if(!byYear[y])byYear[y]=[];
    byYear[y].push(mk);
  });
  const years=Object.keys(byYear).sort();

  // ถ้า S.year ไม่ถูก set หรือปีที่เลือกไม่มีข้อมูล ใช้ปีของเดือนปัจจุบัน
  if(!S.year||!byYear[S.year])S.year=String(cyear);

  const monthsInYear=(byYear[S.year]||[]).slice().sort();
  // ถ้าเดือนที่เลือกอยู่ไม่ตรงปี ให้ reset เป็นเดือนล่าสุดในปีนั้น
  if(S.month.split('-')[0]!==S.year){
    S.month=monthsInYear[monthsInYear.length-1]||cp;
  }

  let html='';
  // ชั้น 1: tab ปี
  html+=`<div style="display:flex;gap:4px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border);">`;
  years.forEach(y=>{
    html+=`<button class="tab-btn${y===S.year?' active':''}" onclick="setYear('${y}')">${Number(y)+543}</button>`;
  });
  html+=`</div>`;
  // ชั้น 2: tab เดือนในปีนั้น
  html+=`<div style="display:flex;gap:4px;flex-wrap:wrap;">`;
  monthsInYear.forEach(mk=>{
    const[,m]=mk.split('-');
    html+=`<button class="tab-btn${mk===S.month?' active':''}" onclick="setMonth('${mk}')">${fmtMk(mk)}</button>`;
  });
  html+=`</div>`;

  bar.innerHTML=html;
}

function renderShopContent(){
  const sid=S.view.id;
  const shop=S.shops.find(s=>s.id===sid);
  if(!shop){document.getElementById('content').innerHTML='<div class="empty"><p>เลือกร้านค้า</p></div>';return;}
  S.shop=sid;
  const tf=curTabFlags();
  const entries=ge(sid,S.month);
  const sess=gs(sid,S.month);
  let tCount=0,tIncome=0,tExpense=0,tExIn=0,tExOut=0;
  entries.forEach(e=>{
    if(e.type==='count')tCount+=e.total||0;
    else if(e.type==='income')tIncome+=e.amount||0;
    else if(e.type==='expense')tExpense+=e.amount||0;
    else if(e.type==='exin')tExIn+=e.amount||0;
    else if(e.type==='exout')tExOut+=e.amount||0;
  });
  if(sess)sess.subs.forEach(s=>tCount+=bv(s.bills||eb()));
  const net=tCount+tIncome-tExpense+tExIn-tExOut;
  const cb=eb();
  entries.forEach(e=>{
    if(e.type==='count')(e.subs||[]).forEach(s=>BT.forEach(t=>cb[t]+=(s.bills[t]||0)));
    else if(e.type==='income'||e.type==='exin'){if(e.bills)BT.forEach(t=>cb[t]+=(e.bills[t]||0));}
    else if(e.type==='expense'||e.type==='exout'){if(e.bills)BT.forEach(t=>cb[t]-=(e.bills[t]||0));}
  });
  if(sess)sess.subs.forEach(s=>BT.forEach(t=>cb[t]+=(s.bills[t]||0)));
  const hasBills=BT.some(t=>cb[t]!==0);
  let h=`<div class="mhdr">
    <div><div class="mtitle">${shop.name} — ${fmtMk(S.month)}</div><div class="mperiod">${periodLbl(S.month)}</div></div>
    <div class="abtns">
      ${tf.count?`<button class="btn btn-g" onclick="openCount()">+ นับเงิน</button>`:''}
      ${tf.income?`<button class="btn btn-b" onclick="openIncome()">+ รายรับ</button>`:''}
      ${tf.expense?`<button class="btn btn-a" onclick="openExpense()">+ รายจ่าย</button>`:''}
      ${tf.exchange?`<button class="btn btn-p" onclick="openExchange(true,'${sid}')">⇄ แลกระหว่างสาย</button>`:''}
      ${tf.payowner?`<button class="btn btn-a" onclick="openPayOwner('${sid}')">💸 จ่ายเฮียรวย</button>`:''}
    </div>
  </div>
  <div class="grid4">
    <div class="sc"><div class="lb">ยอดนับได้</div><div class="vl pos">${fmt(tCount)}</div></div>
    <div class="sc"><div class="lb">รายรับ</div><div class="vl" style="color:var(--blue)">${fmt(tIncome)}</div></div>
    <div class="sc"><div class="lb">รายจ่าย</div><div class="vl" style="color:var(--amber)">${fmt(tExpense)}</div></div>
    <div class="sc"><div class="lb">ยอดสุทธิ</div><div class="vl ${net>=0?'pos':'neg'}">${fmt(net)}</div></div>
  </div>`;
  if(hasBills){
    h+=`<div class="cumul"><div class="clb">แบงค์คงเหลือในกล่อง (สะสมทั้งเดือน)</div><div class="chips">`+

    `</div></div>`;

  if(sess){

    const n=sess.subs.length;
    h+=`<div class="sess"><div class="sess-hd"><div>
      <div class="sess-title">📋 มีรอบนับเงินค้างอยู่</div>
      <div class="sess-sub">${n} ครั้ง · สะสม ${fmt(sessTotal)}</div>
    </div><div class="sess-btns">
      <button class="btn btn-b btn-sm" onclick="summarize()">✓ สรุปรอบค้าง</button>
      <button class="btn btn-x btn-sm" onclick="cancelSess()">ยกเลิก</button>

    sess.subs.forEach((s,i)=>{

    <div class="sc"><div class="lb">รายรับ (รวม)</div><div class="vl" style="color:var(--blue)">${fmt(gtIncome)}</div></div>
    <div class="sc"><div class="lb">รายจ่าย (รวม)</div><div class="vl" style="color:var(--amber)">${fmt(gtExpense)}</div></div>
    <div class="sc"><div class="lb">ยอดสุทธิ (รวม)</div><div class="vl ${gnet>=0?'pos':'neg'}">${fmt(gnet)}</div></div>
  </div>`;

  if(hasGBills){
    h+=`<div class="cumul"><div class="clb">แบงค์คงเหลือรวมทุกสายในกลุ่ม</div><div class="chips">`+
      BT.filter(t=>gcb[t]!==0).map(t=>{const neg=gcb[t]<0;return`<span class="pill ${BC[t]}" style="${neg?'outline:1px solid var(--red);opacity:.8;':''}">฿${BL[t]} × ${neg?'<span style="color:var(--red)">':''}${fN(gcb[t])}${neg?'</span>':''}</span>`;}).join('')+
    `</div></div>`;
  }

  // รวม entries จากทุกสาย
  const allExpenses=[],allExIn=[];
  members.forEach(sh=>{
    ge(sh.id,S.month).forEach(e=>{
      if(e.type==='expense')allExpenses.push(Object.assign({},e,{_sid:sh.id}));
      else if(e.type==='exin')allExIn.push(e);
    });
  });
  allExpenses.sort((a,b)=>(b.df||'')>(a.df||'')?1:-1);
  allExIn.sort((a,b)=>(b.df||'')>(a.df||'')?1:-1);

  if(grp.is_owner){
    h+=`<div class="slbl">รายรับจากจ่ายเฮียรวย</div>`;
    h+=allExIn.length>0?renderEntriesList(allExIn):`<div class="empty" style="padding:12px 0;"><p>ยังไม่มีรายรับ</p></div>`;
  }
  h+=`<div class="slbl">รายจ่าย</div>`;
  h+=allExpenses.length>0?renderEntriesList(allExpenses):`<div class="empty" style="padding:12px 0;"><p>ยังไม่มีรายจ่าย</p></div>`;
  if(members.length===0)h+=`<div class="empty"><div class="ei">📭</div><p>ยังไม่มีสายในกลุ่มนี้</p></div>`;
  document.getElementById('content').innerHTML=h;
}
function toggleGrpCard(id){const b=document.getElementById('grc-'+id);if(b)b.classList.toggle('open');}

function renderEntriesList(entries){
  const used=new Set();
  const rows=[];
  entries.forEach((e,i)=>{
    if(used.has(i))return;
    if(e.type==='exout'||e.type==='exin'){
      const matchType=e.type==='exout'?'exin':'exout';
      const j=entries.findIndex((e2,i2)=>!used.has(i2)&&i2!==i&&e2.type===matchType&&e2.oid===e.oid&&e2.df===e.df);
      if(j>=0){
        used.add(i);used.add(j);
        const exout=e.type==='exout'?e:entries[j];
        const exin=e.type==='exin'?e:entries[j];
        rows.push(renderExchangePair(exout,exin));
        return;
      }
    }
    // group expense batch (same oid = same batch)
    if(e.type==='expense'&&e.oid){
      const bIdx=[];
      entries.forEach((e2,i2)=>{if(!used.has(i2)&&e2.type==='expense'&&e2.oid===e.oid&&e2.df===e.df)bIdx.push(i2);});
      if(bIdx.length>1){bIdx.forEach(i2=>used.add(i2));rows.push(renderGroupExpenseBatch(bIdx.map(i2=>entries[i2])));return;}
    }
    rows.push(renderEntry(e));
  });
  return rows.join('');
}

function renderGroupExpenseBatch(bEntries){
  const total=bEntries.reduce((s,e)=>s+(e.amount||0),0);
  const title=bEntries[0].title||'รายจ่าย';

  const delIds=bEntries.map(e=>`'${e.id}'`).join(',');

  bEntries.forEach(e=>{
    const sh=S.shops.find(s=>s.id===e._sid);
    detail+=`<div style="display:flex;align-items:center;gap:8px;margin:4px 0;">
      ${sh?`<span style="width:8px;height:8px;border-radius:50%;background:${sh.color};display:inline-block;flex-shrink:0;"></span>`:''}
      <span style="font-size:13px;color:var(--text2);flex:1;">${sh?.name||e._sid||'?'}</span>
      <span style="font-family:var(--mono);font-size:13px;color:var(--amber);">-${fmt(e.amount)}</span>
    </div>
    ${e.bills&&BT.some(t=>e.bills[t]>0)?`<div style="margin-left:16px;margin-bottom:6px;">${billTbl(e.bills,e.amount)}</div>`:''}`;
  });
  return`<div class="ecard">
    <div class="ehd" onclick="toggleE('${batchKey}')">
      <span class="badge bexp">รายจ่าย</span>
      <span class="edt">${ds}</span>
      <span class="ett">${title}</span>
      <span class="eam neg">-${fmt(total)}</span>
      ${isAdmin()?`<button class="delbtn" onclick="delGroupExpenseBatch(event,[${delIds}])">ลบ</button>`:''}
    </div>
    <div class="ebody" id="eb-${batchKey}">
      <p style="font-size:13px;color:var(--text2);margin-bottom:10px;">รวม: <strong style="color:var(--amber);font-family:var(--mono);">${fmt(total)}</strong></p>
      <div style="font-size:12px;color:var(--text3);margin-bottom:6px;">หยิบจากสายย่อย:</div>
      ${detail}

}
async function delGroupExpenseBatch(ev,ids){
  ev.stopPropagation();
  if(!confirm(`ลบรายจ่ายนี้? (${ids.length} รายการ)`))return;
  try{
    await Promise.all(ids.map(id=>sbDelete('entries',`id=eq.${id}`)));
    ids.forEach(id=>{for(const sid of Object.keys(S.entries)){const l=ge(sid,S.month);const i=l.findIndex(e=>e.id===id);if(i>-1)l.splice(i,1);}});

  }catch(err){toast('ลบไม่สำเร็จ: '+err.message);}
}

function renderEntry(e){
  const labels={count:'นับเงิน',income:'รายรับ',expense:'รายจ่าย',exin:'รับแลกเงิน',exout:'แลกเงินออก'};
  const bclass={count:'bcount',income:'binc',expense:'bexp',exin:'bexin',exout:'bexout'};
  const aclass={count:'pos',income:'pos',expense:'neg',exin:'pos',exout:'neg'};
  const sign={count:'+',income:'+',expense:'-',exin:'+',exout:'-'};
  const amt=e.total??e.amount??0;
  const ds=e.df===e.dt?e.df:`${e.df} – ${e.dt}`;
  let body='';
  if(e.type==='count'){
    (e.subs||[]).forEach((s,i)=>{
      const sa=bv(s.bills||eb());
      body+=`<div style="margin-bottom:10px;"><div style="font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px;">ครั้งที่ ${i+1} · ${s.df}${s.dt&&s.dt!==s.df?' – '+s.dt:''} — ${fmt(sa)}</div>${billTbl(s.bills||eb(),sa)}</div>`;
    });
    if((e.subs||[]).length>1){
      const tb=eb();(e.subs||[]).forEach(s=>BT.forEach(t=>tb[t]+=(s.bills[t]||0)));
      body+=`<div class="sumbox"><div class="sumbox-t">รวมสะสม ${e.subs.length} ครั้ง</div>${billTbl(tb,e.total)}</div>`;
    }
  } else if(e.type==='income'){
    body=`<p style="font-size:13px;color:var(--text2);">รายรับ: <strong class="pos" style="font-family:var(--mono);">${fmt(amt)}</strong></p>`;
    if(e.bills)body+=`<div style="margin-top:8px;">${billTbl(e.bills,amt)}</div>`;
  } else if(e.type==='expense'){
    body=`<p style="font-size:13px;color:var(--text2);">จำนวน: <strong style="color:var(--amber);font-family:var(--mono);">${fmt(amt)}</strong></p>`;
    if(e.bills&&BT.some(t=>e.bills[t]>0))body+=`<div style="margin-top:8px;">${billTbl(e.bills,amt)}</div>`;
  } else if(e.type==='exin'||e.type==='exout'){
    const os=S.shops.find(s=>s.id===e.oid);
    body=`<p style="font-size:13px;color:var(--text2);">${e.type==='exout'?'ให้ไปยัง':'รับจาก'}: <strong style="color:var(--purple);">${os?.name||'?'}</strong> — ${fmt(amt)}</p>`;
    if(e.bills&&BT.some(t=>e.bills[t]>0))body+=`<div style="margin-top:8px;">${billTbl(e.bills,amt)}</div>`;
  }
  if(e.note)body+=`<div class="notetxt">📝 ${e.note}</div>`;
  return `<div class="ecard">
    <div class="ehd" onclick="toggleE('${e.id}')">
      <span class="badge ${bclass[e.type]}">${labels[e.type]}</span>
      <span class="edt">${ds}</span>
      <span class="ett">${e.title||''}${e.type==='count'&&e.ca?` <span style="font-size:11px;color:var(--text3);font-weight:400;">(${(d=>d.getDate()+' · '+String(d.getHours()).padStart(2,'0')+'.'+String(d.getMinutes()).padStart(2,'0'))(new Date(new Date(e.ca).toLocaleString('en-US',{timeZone:'Asia/Bangkok'})))})</span>`:''}</span>
      <span class="eam ${aclass[e.type]}">${sign[e.type]}${fmt(Math.abs(amt))}</span>
      ${e.type==='count'?`<button class="delbtn" style="background:var(--blue);border-color:var(--bbr);color:#fff;margin-right:4px;" onclick="event.stopPropagation();openEditCount('${e.id}')">แก้ไข</button>`:''}
      <button class="delbtn" onclick="delE(event,'${e.id}')" style="${isAdmin()?'':'display:none'}">ลบ</button>
    </div>
    <div class="ebody" id="eb-${e.id}">${body}</div>
  </div>`;
}

function billTbl(bills,total){
  const rows=BT.filter(t=>bills[t]>0).map(t=>{const v=(t==='coin'?1:t)*(bills[t]||0);return`<tr><td><span class="pill ${BC[t]}">฿${BL[t]}</span></td><td class="nr">${fN(bills[t])}</td><td class="nr">${fmt(v)}</td></tr>`;}).join('');

}

function billInpWithLimit(p,cb){

function updBLimit(p){
  const cb=_cbMap[p]||{};
  let tot=0,over=false;
  BT.forEach(t=>{
    const inp=document.getElementById(`${p}_${t}`);
    if(!inp)return;
    let v=parseInt(inp.value)||0;
    const max=cb[t]??0;
    if(v>max){v=max;inp.value=max;inp.style.color='var(--red)';over=true;}
    else inp.style.color='var(--text)';
    const denom=t==='coin'?1:parseInt(t);
    const val=denom*v;
    tot+=val;
    const s=document.getElementById(`${p}s_${t}`);
    if(s)s.textContent=`= ฿${fN(val)}`;
  });
  const tb=document.getElementById(`${p}_tot`);if(tb)tb.textContent=fmt(tot);
  if(over)toast('ไม่สามารถใส่แบงค์เกินจำนวนที่มีในกล่องได้');
}
function billInp(p,cols,init){

function updB(p){

// ─── DATE GRID (count period picker) ───
let _dcSel={start:null,end:null};
let _dcUsed=new Set();

function periodDays(mk){
  const[y,m]=mk.split('-').map(Number);
  const nm=m===12?1:m+1,ny=m===12?y+1:y;
  const days=[];
  const daysInM=new Date(y,m,0).getDate();
  for(let d=11;d<=daysInM;d++)days.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  for(let d=1;d<=10;d++)days.push(`${ny}-${String(nm).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  return days;
}

function usedCountDays(routeId,mk,excludeId){
  const used=new Set();
  (ge(routeId,mk)||[]).filter(e=>e.type==='count'&&e.id!==excludeId).forEach(e=>{
    (e.subs||[]).forEach(s=>{
      let d=new Date(s.df),end=new Date(s.dt||s.df);
      while(d<=end){used.add(d.toISOString().split('T')[0]);d.setDate(d.getDate()+1);}
    });
  });
  return used;
}

function renderDateGrid(mk,routeId,excludeId){
  const[y,m]=mk.split('-').map(Number);
  const nm=m===12?1:m+1,ny=m===12?y+1:y;
  const thM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  _dcUsed=usedCountDays(routeId,mk,excludeId);
  const days=periodDays(mk);
  const daysInM=new Date(y,m,0).getDate();
  const split=daysInM-11+1;
  const makeCell=d=>{
    const dn=parseInt(d.split('-')[2]);
    if(_dcUsed.has(d))return`<div class="dc-cell dc-used" title="ใช้แล้ว">${dn}</div>`;
    return`<div class="dc-cell dc-avail" id="dc-${d}" onclick="dcClick('${d}')">${dn}</div>`;
  };
  const row1=days.slice(0,split).map(makeCell).join('');
  const row2=days.slice(split).map(makeCell).join('');
  return`<div class="dc-wrap">
    <div class="dc-mlbl">${thM[m-1]}</div><div class="dc-row">${row1}</div>
    <div class="dc-mlbl" style="margin-top:8px;">${thM[nm-1]}</div><div class="dc-row">${row2}</div>
    <div class="dc-sel-info" id="dc-info">เลือกวันเริ่มต้น</div>
  </div>`;
}

function dcClick(d){
  if(!_dcSel.start||(_dcSel.start&&_dcSel.end)){
    _dcSel={start:d,end:null};
  } else {
    let s=_dcSel.start,e=d;
    if(e<s){const tmp=s;s=e;e=tmp;}
    // check no used day in range
    const days=periodDays(S.month);
    const inRange=days.filter(x=>x>=s&&x<=e);
    if(inRange.some(x=>_dcUsed.has(x))){toast('มีวันที่ถูกใช้ในรอบอื่นอยู่ในช่วงนี้');_dcSel={start:d,end:null};dcRender();return;}
    _dcSel={start:s,end:e};
  }
  dcRender();
}

function dcRender(){
  document.querySelectorAll('.dc-avail').forEach(el=>{
    el.classList.remove('dc-start','dc-end','dc-range');
  });
  if(!_dcSel.start){document.getElementById('dc-info').textContent='เลือกวันเริ่มต้น';return;}
  const se=document.getElementById('dc-'+_dcSel.start);
  if(se)se.classList.add(_dcSel.end?'dc-start':'dc-start');
  if(_dcSel.end){
    document.querySelectorAll('.dc-avail').forEach(el=>{
      const x=el.id.replace('dc-','');
      if(x>_dcSel.start&&x<_dcSel.end)el.classList.add('dc-range');
    });
    const ee=document.getElementById('dc-'+_dcSel.end);
    if(ee)ee.classList.add('dc-end');
    const fmt2=x=>x.split('-').slice(1).map(Number).join('/');
    document.getElementById('dc-info').textContent=`${fmt2(_dcSel.start)} – ${fmt2(_dcSel.end)}`;
  } else {
    const fmt2=x=>x.split('-').slice(1).map(Number).join('/');
    document.getElementById('dc-info').textContent=`เริ่ม ${fmt2(_dcSel.start)} — เลือกวันสิ้นสุด`;
  }
}

async function saveCountDirect(){

  const df=_dcSel.start,dt=_dcSel.end||_dcSel.start;

  const total=bv(bills);
  if(total===0){toast('กรุณาใส่จำนวนแบงค์ที่นับได้');return;}
  const prevRounds=ge(S.shop,S.month).filter(e=>e.type==='count').length;
  const entry={id:uid(),type:'count',df,dt,total,subs:[{df,dt,bills}],title:`รอบ ${prevRounds+1}`};
  try{
    await sbUpsert('entries',entryToRow(entry,S.shop,S.month));

  const entry={id:uid(),type:'count',df,dt,total,subs:[...sess.subs],title:`รอบ ${prevRounds+1} (${n} ครั้ง)`};
  try{

      await sbUpsert('entries',[entryToRow(eOut,sid,mk2),entryToRow(eIn,_collector,mk2)]);

function _ovCalc(ids){
  // คำนวณยอดของ shop หลายสาย รวมกัน
  let tc=0,ti=0,te=0,tei=0,teo=0;
  ids.forEach(sid=>{
    const ents=ge(sid,S.month);const sess=gs(sid,S.month);
    ents.forEach(e=>{
      if(e.type==='count')tc+=e.total||0;
      else if(e.type==='income')ti+=e.amount||0;
      else if(e.type==='expense')te+=e.amount||0;
      else if(e.type==='exin')tei+=e.amount||0;
      else if(e.type==='exout')teo+=e.amount||0;
    });
    if(sess)sess.subs.forEach(s=>tc+=bv(s.bills||eb()));
  });
  return{tc,ti,te,tei,teo,net:tc+ti-te+tei-teo};
}

// ─── คำนวณแบงค์คงเหลือของสาย (sid) ในเดือน (mk) ───
function calcCB(sid,mk){
  const cb=eb();
  const entries=ge(sid,mk);
  entries.forEach(e=>{
    if(e.type==='count'){
      (e.subs||[]).forEach(s=>BT.forEach(t=>cb[t]+=(s.bills[t]||0)));
    } else if(e.type==='income'||e.type==='exin'){
      if(e.bills)BT.forEach(t=>cb[t]+=(e.bills[t]||0));
    } else if(e.type==='expense'||e.type==='exout'){
      if(e.bills)BT.forEach(t=>cb[t]-=(e.bills[t]||0));
    }
  });
  const sess=gs(sid,mk);
  if(sess)sess.subs.forEach(s=>BT.forEach(t=>cb[t]+=(s.bills[t]||0)));
  return cb;
}

// ─── render แถบแบงค์คงเหลือ ───
function cbBar(cb){
  const hasBills=BT.some(t=>cb[t]>0);
  if(!hasBills)return`<div style="padding:8px 12px;background:var(--bg3);border-radius:7px;font-size:13px;color:var(--text3);">ไม่มีแบงค์คงเหลือในกล่อง</div>`;
  const chips=BT.filter(t=>cb[t]>0).map(t=>`<span class="pill ${BC[t]}">฿${BL[t]} × ${fN(cb[t])}</span>`).join(' ');
  const total=BT.reduce((s,t)=>s+(t==='coin'?1:t)*(cb[t]>0?cb[t]:0),0);
  return`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:10px 12px;">
    <div style="font-size:11px;color:var(--text3);margin-bottom:6px;">แบงค์ในกล่องตอนนี้ — รวม <strong style="color:var(--green);font-family:var(--mono);">${fmt(total)}</strong></div>
    <div class="chips">${chips}</div>
  </div>`;
}

      <div class="fg"><label class="flbl">วันที่</label><input type="date" class="finp" id="ep_d" value="${today()}"></div>
      <div class="fg"><label class="flbl">รายละเอียด</label><input type="text" class="finp" id="ep_t" placeholder="เช่น เงินเดือน, ค่าน้ำมัน"></div>
    </div>
    ${billInpWithLimit('ep',cb)}
    <div class="tbar"><span class="tl">ยอดที่จ่ายออก</span><span class="tv" id="ep_tot">฿0</span></div>`;
  OM('เพิ่มรายจ่าย',body,`<button class="btn btn-x" onclick="CMask()">ยกเลิก</button><button class="btn btn-a" onclick="saveExpense()">บันทึก</button>`);

async function saveExpense(){
  const d=document.getElementById('ep_d').value;
  const t=document.getElementById('ep_t').value||'รายจ่าย';
  const bills=gb('ep');
  const amount=bv(bills);
  if(!d){toast('กรุณาเลือกวันที่');return;}
  if(amount===0){toast('กรุณาเลือกแบงค์ที่จ่ายออกอย่างน้อย 1 ใบ');return;}
  // validate แบงค์ไม่เกินที่มี
  const cb=calcCB(S.shop,S.month);
  const over=BT.find(tt=>bills[tt]>(cb[tt]||0));
  if(over){toast(`แบงค์ ฿${BL[over]} เกินจำนวนที่มีในกล่อง (มี ${fN(cb[over]||0)} ใบ)`);return;}
  const entry={id:uid(),type:'expense',df:d,dt:d,amount,title:t,note:null,bills};
  try{
    await sbUpsert('entries',entryToRow(entry,S.shop,S.month));
    ge(S.shop,S.month).push(entry);
    CM();render();toast(`บันทึกรายจ่าย ${fmt(amount)} แล้ว ✓`);
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);console.error(err);}
}

// ─── EXCHANGE between shops — two-column UI ───
// fromShop=true → ฝั่งซ้าย lock เป็น lockedId, ฝั่งขวาเลือกได้ (standalone routes + groups, ยกเว้นกลุ่มของตัวเอง)
// fromShop=false → ทั้ง 2 ฝั่งเลือกได้ (group view เดิม)
function openExchange(fromShop,lockedId){
  // หา group ที่ lockedId อยู่
  const myGroupId=fromShop?Object.keys(S.groupMembers).find(gid=>S.groupMembers[gid].includes(lockedId)):null;
  // สร้าง options ฝั่งขวา: standalone routes + groups (ยกเว้น route ที่อยู่ใน group ใดก็ตาม และยกเว้น group ของตัวเอง)
  const groupedIds=groupedRouteIds();
  if(fromShop&&bv(calcCB(lockedId,S.month))===0){toast('ไม่มีเงินในกล่อง ไม่สามารถแลกได้');return;}
  const rightRoutes=S.shops.filter(s=>!groupedIds.has(s.id)&&s.id!==lockedId&&bv(calcCB(s.id,S.month))>0);
  const rightGroups=fromShop
    ?S.groups.filter(g=>g.id!==myGroupId&&bv(calcCBGroup(g.id,S.month))>0)
    :S.groups.filter(g=>bv(calcCBGroup(g.id,S.month))>0);
  if(rightRoutes.length===0&&rightGroups.length===0){toast('ไม่มีกลุ่มหรือสายที่มีเงินสำหรับแลก');return;}

  // left options (ถ้า fromShop ล็อค)
  const leftShop=fromShop?S.shops.find(s=>s.id===lockedId):null;
  const leftName=leftShop?.name||'';

  // right options: standalone routes ก่อน แล้ว groups
  const rightOpts=[
    ...rightRoutes.map(s=>`<option value="r:${s.id}">${s.name}</option>`),
    ...rightGroups.map(g=>`<option value="g:${g.id}">📁 ${g.name}</option>`)
  ].join('');

  // left options (กรณี fromShop=false เลือกได้ — standalone routes + groups ที่มีเงิน)
  const cashShops=S.shops.filter(s=>!groupedIds.has(s.id)&&bv(calcCB(s.id,S.month))>0);
  const cashGroupsLeft=S.groups.filter(g=>bv(calcCBGroup(g.id,S.month))>0);
  const leftAllOpts=[
    ...cashShops.map(s=>`<option value="r:${s.id}">${s.name}</option>`),
    ...cashGroupsLeft.map(g=>`<option value="g:${g.id}">📁 ${g.name}</option>`)
  ].join('');

  const leftDefaultVal=fromShop?`r:${lockedId}`:(cashShops[0]?`r:${cashShops[0].id}`:(cashGroupsLeft[0]?`g:${cashGroupsLeft[0].id}`:''));
  const leftDefault=fromShop?lockedId:(leftDefaultVal.startsWith('g:')?leftDefaultVal.slice(2):leftDefaultVal.replace(/^r:/,''));
  const rightDefault=fromShop?(rightRoutes[0]?`r:${rightRoutes[0].id}`:(rightGroups[0]?`g:${rightGroups[0].id}`:'')):
    (rightRoutes[0]?`r:${rightRoutes[0].id}`:(rightGroups[0]?`g:${rightGroups[0].id}`:''));

  const isLGroup=leftDefaultVal.startsWith('g:');
  const cbL=isLGroup?calcCBGroup(leftDefault,S.month):calcCB(leftDefault,S.month);
  const cbR=rightDefault?.startsWith('g:')
    ?calcCBGroup(rightDefault.slice(2),S.month)
    :calcCB(rightDefault?.replace(/^r:/,'')||'',S.month);

  const hdrRow=`<div style="display:contents;">
    <div style="padding:10px 12px;background:var(--adim);border-bottom:1px solid var(--border);">
      <div style="font-size:13px;font-weight:600;color:var(--amber);margin-bottom:6px;">ฝั่งซ้าย — ให้ออก</div>
      ${fromShop
        ?`<div style="font-size:14px;font-weight:600;color:var(--text);padding:6px 0;">${leftName}</div><input type="hidden" id="xc_L" value="r:${leftDefault}">`
        :`<select class="fsel" id="xc_L" style="font-size:14px;width:100%;" onchange="refreshExchangeCB(false)">${leftAllOpts}</select>`}
    </div>
    <div style="background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--purple);">⇄</div>
    <div style="padding:10px 12px;background:var(--gdim);border-bottom:1px solid var(--border);">
      <div style="font-size:13px;font-weight:600;color:var(--green);margin-bottom:6px;">ฝั่งขวา — รับ</div>
      <select class="fsel" id="xc_R" style="font-size:14px;width:100%;" onchange="refreshExchangeCB(${fromShop})">${rightOpts}</select>
    </div>
  </div>`;

  const denomRows=BT.map(t=>{
    const maxL=cbL[t]||0, maxR=cbR[t]||0;
    return`<div style="display:contents;">
      <div style="padding:10px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);">
        <label style="display:flex;align-items:center;gap:6px;margin-bottom:6px;"><span class="pill ${BC[t]}">฿${BL[t]}</span><span id="xlbl_L_${t}" style="font-size:11px;color:var(--text3);">มี ${fN(maxL)} ใบ</span></label>
        <input type="number" min="0" max="${maxL}" value="0" id="xL_${t}" oninput="updBLimit('xL')" inputmode="numeric" style="font-size:20px;width:100%;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-weight:500;">
        <div style="font-size:15px;color:var(--text);margin-top:2px;font-family:var(--mono);" id="xLs_${t}">= ฿0</div>
      </div>
      <div style="background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--border2);font-size:12px;">—</div>
      <div style="padding:10px 12px;border-bottom:1px solid var(--border);border-left:1px solid var(--border);">
        <label style="display:flex;align-items:center;gap:6px;margin-bottom:6px;"><span class="pill ${BC[t]}">฿${BL[t]}</span><span id="xlbl_R_${t}" style="font-size:11px;color:var(--text3);">มี ${fN(maxR)} ใบ</span></label>
        <input type="number" min="0" max="${maxR}" value="0" id="xR_${t}" oninput="updBLimit('xR')" inputmode="numeric" style="font-size:20px;width:100%;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-weight:500;">
        <div style="font-size:15px;color:var(--text);margin-top:2px;font-family:var(--mono);" id="xRs_${t}">= ฿0</div>
      </div>
    </div>`;
  }).join('');

  const totRow=`<div style="display:contents;">
    <div style="padding:10px 12px;"><span style="font-size:13px;color:var(--text2);">ยอดให้</span> <span class="tv" id="xL_tot" style="font-family:var(--mono);font-size:18px;font-weight:600;color:var(--amber);">฿0</span></div>
    <div style="background:var(--bg2);"></div>
    <div style="padding:10px 12px;"><span style="font-size:13px;color:var(--text2);">ยอดให้</span> <span class="tv" id="xR_tot" style="font-family:var(--mono);font-size:18px;font-weight:600;color:var(--green);">฿0</span></div>
  </div>`;

  const body=`
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px;">แต่ละฝั่งระบุแบงค์ที่ให้ออก — แบงค์จะสลับไปอีกฝั่งอัตโนมัติ</p>
    <div style="display:grid;grid-template-columns:1fr 36px 1fr;border:1px solid var(--border);border-radius:10px;overflow:hidden;">
      ${hdrRow}${denomRows}${totRow}
    </div>`;
  OM('แลกเงินระหว่างสาย',body,`<button class="btn btn-x" onclick="CMask()">ยกเลิก</button><button class="btn btn-p" onclick="saveExchange(${fromShop})">บันทึกการแลก</button>`);
  if(!fromShop)document.getElementById('xc_L').value=leftDefaultVal;
  document.getElementById('xc_R').value=rightDefault||'';
  _cbMap['xL']=cbL;
  _cbMap['xR']=cbR;
}

// คำนวณ CB รวมของ group (รวมทุก route ในกลุ่ม)
function calcCBGroup(gid,mk){
  const ids=S.groupMembers[gid]||[];
  const total=eb();
  ids.forEach(id=>{const cb=calcCB(id,mk);BT.forEach(t=>total[t]+=(cb[t]||0));});
  return total;
}
// หา route แรกในกลุ่มที่มีเงิน (ใช้ใน exchange exout ฝั่งซ้ายที่เป็น group)
function firstRouteWithMoney(gid,mk){
  const ids=S.groupMembers[gid]||[];
  return ids.find(id=>bv(calcCB(id,mk))>0)||ids[0];
}

function refreshExchangeCB(fromShop){
  const Lval=document.getElementById('xc_L').value;
  const Rval=document.getElementById('xc_R').value;
  const isLGroup=Lval?.startsWith('g:');
  const Lid=(isLGroup||Lval?.startsWith('r:'))?Lval.slice(2):Lval;
  const cbL=isLGroup?calcCBGroup(Lid,S.month):calcCB(Lid,S.month);
  const isRGroup=Rval?.startsWith('g:');
  const Rid=(isRGroup||Rval?.startsWith('r:'))?Rval.slice(2):Rval;
  const cbR=isRGroup?calcCBGroup(Rid,S.month):calcCB(Rid,S.month);
  _cbMap['xL']=cbL;
  _cbMap['xR']=cbR;
  BT.forEach(t=>{
    const inpL=document.getElementById(`xL_${t}`);
    const inpR=document.getElementById(`xR_${t}`);
    if(inpL){inpL.max=cbL[t]||0;inpL.value=0;}
    if(inpR){inpR.max=cbR[t]||0;inpR.value=0;}
    const lblL=document.getElementById(`xlbl_L_${t}`);
    const lblR=document.getElementById(`xlbl_R_${t}`);
    if(lblL)lblL.textContent=`มี ${fN(cbL[t]||0)} ใบ`;
    if(lblR)lblR.textContent=`มี ${fN(cbR[t]||0)} ใบ`;
    const sL=document.getElementById(`xLs_${t}`);if(sL)sL.textContent='= ฿0';
    const sR=document.getElementById(`xRs_${t}`);if(sR)sR.textContent='= ฿0';
  });
  const tL=document.getElementById('xL_tot');if(tL)tL.textContent='฿0';
  const tR=document.getElementById('xR_tot');if(tR)tR.textContent='฿0';
}

async function saveExchange(fromShop){
  const d=today();
  const Lval=document.getElementById('xc_L').value;
  const Rval=document.getElementById('xc_R').value;
  const isLGroup=Lval?.startsWith('g:');
  const isRGroup=Rval?.startsWith('g:');
  const Lid=(isLGroup||Lval?.startsWith('r:'))?Lval.slice(2):Lval;
  const Rid=(isRGroup||Rval?.startsWith('r:'))?Rval.slice(2):Rval;
  if(!isLGroup&&!isRGroup&&Lid===Rid){toast('กรุณาเลือกสายที่ต่างกัน');return;}
  if(isRGroup&&(S.groupMembers[Rid]||[]).includes(Lid)){toast('ไม่สามารถแลกเงินกับกลุ่มของตัวเองได้');return;}
  if(isLGroup&&(S.groupMembers[Lid]||[]).includes(Rid)){toast('ไม่สามารถแลกเงินกับกลุ่มของตัวเองได้');return;}

  const Lblls=gb('xL');
  const Rblls=gb('xR');
  const La=bv(Lblls), Ra=bv(Rblls);
  if(La===0&&Ra===0){toast('กรุณาใส่แบงค์อย่างน้อยฝั่งเดียว');return;}
  const LrouteId=isLGroup?firstRouteWithMoney(Lid,S.month):Lid;
  const cbL=isLGroup?calcCBGroup(Lid,S.month):calcCB(Lid,S.month);
  const overL=BT.find(t=>Lblls[t]>(cbL[t]||0));
  if(overL){toast(`ฝั่งซ้าย: แบงค์ ฿${BL[overL]} เกินจำนวนที่มี (มี ${fN(cbL[overL]||0)} ใบ)`);return;}
  if(!isRGroup){
    const cbR=calcCB(Rid,S.month);
    const overR=BT.find(t=>Rblls[t]>(cbR[t]||0));
    if(overR){toast(`ฝั่งขวา: แบงค์ ฿${BL[overR]} เกินจำนวนที่มี (มี ${fN(cbR[overR]||0)} ใบ)`);return;}
  }
  const Lgrp=isLGroup?S.groups.find(g=>g.id===Lid):null;
  const Lname=isLGroup?(Lgrp?.name||'?'):(S.shops.find(s=>s.id===Lid)?.name||'?');
  const mk2=S.month;
  const entriesToSave=[];
  const localEntries=[];

  if(isRGroup){
    const Rgrp=S.groups.find(g=>g.id===Rid);
    const RfirstId=(S.groupMembers[Rid]||[])[0];
    const Rname=Rgrp?.name||'?';
    if(La>0){
      const e={id:uid(),type:'exout',df:d,dt:d,amount:La,title:`แลกออก → ${Rname}`,note:'',bills:Lblls,oid:RfirstId||Rid};
      entriesToSave.push(entryToRow(e,LrouteId,mk2));localEntries.push({sid:LrouteId,e});
    }
    if(Ra>0){
      const cbRgrp=calcCBGroup(Rid,S.month);
      const overR=BT.find(t=>Rblls[t]>(cbRgrp[t]||0));
      if(overR){toast(`ฝั่งขวา: แบงค์ ฿${BL[overR]} เกินจำนวนที่มี`);return;}
      const RexId=firstRouteWithMoney(Rid,S.month);
      const e={id:uid(),type:'exout',df:d,dt:d,amount:Ra,title:`แลกออก → ${Lname}`,note:'',bills:Rblls,oid:LrouteId};
      entriesToSave.push(entryToRow(e,RexId,mk2));localEntries.push({sid:RexId,e});
    }
    if(La>0&&RfirstId){
      const e={id:uid(),type:'exin',df:d,dt:d,amount:La,title:`รับแลก ← ${Lname}`,note:'',bills:Lblls,oid:LrouteId};
      entriesToSave.push(entryToRow(e,RfirstId,mk2));localEntries.push({sid:RfirstId,e});
    }
    if(Ra>0){
      const e={id:uid(),type:'exin',df:d,dt:d,amount:Ra,title:`รับแลก ← ${Rname}`,note:'',bills:Rblls,oid:RfirstId||Rid};
      entriesToSave.push(entryToRow(e,LrouteId,mk2));localEntries.push({sid:LrouteId,e});
    }
  } else {
    const Rshop=S.shops.find(s=>s.id===Rid);
    const Rname=Rshop?.name||'?';
    if(La>0){const e={id:uid(),type:'exout',df:d,dt:d,amount:La,title:`แลกออก → ${Rname}`,note:'',bills:Lblls,oid:Rid};entriesToSave.push(entryToRow(e,LrouteId,mk2));localEntries.push({sid:LrouteId,e});}
    if(Ra>0){const e={id:uid(),type:'exin',df:d,dt:d,amount:Ra,title:`รับแลก ← ${Rname}`,note:'',bills:Rblls,oid:Rid};entriesToSave.push(entryToRow(e,LrouteId,mk2));localEntries.push({sid:LrouteId,e});}
    if(Ra>0){const e={id:uid(),type:'exout',df:d,dt:d,amount:Ra,title:`แลกออก → ${Lname}`,note:'',bills:Rblls,oid:LrouteId};entriesToSave.push(entryToRow(e,Rid,mk2));localEntries.push({sid:Rid,e});}
    if(La>0){const e={id:uid(),type:'exin',df:d,dt:d,amount:La,title:`รับแลก ← ${Lname}`,note:'',bills:Lblls,oid:LrouteId};entriesToSave.push(entryToRow(e,Rid,mk2));localEntries.push({sid:Rid,e});}
  }
  try{
    await sbUpsert('entries',entriesToSave);
    localEntries.forEach(({sid,e})=>ge(sid,mk2).push(e));
    CM();render();
    const diff=Math.abs(La-Ra);
    toast(diff>0?`บันทึกแล้ว (ยอดต่างกัน ${fmt(diff)} — ตรวจสอบด้วย)`:'แลกเงินบันทึกแล้ว ✓');
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);console.error(err);}
}

// ─── จ่ายเฮียรวย (shop view) ───
function openPayOwner(fromSid){
  const ownerGrp=S.groups.find(g=>g.is_owner);
  if(!ownerGrp){toast('ยังไม่ได้ตั้งกลุ่มเฮียรวย — admin ตั้งได้ที่แก้ไขกลุ่ม');return;}
  const ownerFirstId=(S.groupMembers[ownerGrp.id]||[])[0];
  if(!ownerFirstId){toast('กลุ่มเฮียรวยยังไม่มีสาย');return;}
  const cb=calcCB(fromSid,S.month);
  const body=`
    ${cbBar(cb)}
    <div style="height:10px;"></div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:10px;">ระบุแบงค์ที่จ่ายออก → <strong style="color:var(--amber);">${ownerGrp.name}</strong></p>
    ${billInpWithLimit('po',cb)}
    <div class="tbar"><span class="tl">ยอดที่จ่าย</span><span class="tv" id="po_tot">฿0</span></div>`;
  OM(`💸 จ่ายเฮียรวย`,body,`<button class="btn btn-x" onclick="CMask()">ยกเลิก</button><button class="btn btn-a" onclick="savePayOwner('${fromSid}','${ownerGrp.id}','${ownerFirstId}')">บันทึก</button>`);
}

// ─── จ่ายเฮียรวย (group view — pickShop ก่อน) ───
function openPayOwnerGroup(gid){
  const members=(S.groupMembers[gid]||[]).map(id=>S.shops.find(s=>s.id===id)).filter(Boolean);
  if(members.length===0){toast('ไม่มีสายในกลุ่ม');return;}
  if(members.length===1){openPayOwner(members[0].id);return;}
  const ownerGrp=S.groups.find(g=>g.is_owner);
  if(!ownerGrp){toast('ยังไม่ได้ตั้งกลุ่มเฮียรวย');return;}
  OM(`เลือกสายสำหรับจ่ายเฮียรวย`,
    `<p style="font-size:13px;color:var(--text2);margin-bottom:12px;">เลือกสายที่ต้องการจ่ายให้ <strong style="color:var(--amber);">${ownerGrp.name}</strong>:</p>`+
    members.map(sh=>`<button onclick="CM();setTimeout(()=>openPayOwner('${sh.id}'),50)" style="display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;margin-bottom:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-family:var(--font);font-size:14px;">
      <span style="width:10px;height:10px;border-radius:50%;background:${sh.color};display:inline-block;"></span>
      ${sh.name} <span style="margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--text2);">${fmt(shopTot(sh.id))}</span>
    </button>`).join(''),
    `<button class="btn btn-x" onclick="CMask()">ยกเลิก</button>`);
}

async function savePayOwner(fromSid,ownerGid,ownerFirstId){
  const bills=gb('po');
  const amount=bv(bills);
  if(amount===0){toast('กรุณาใส่แบงค์ที่จ่ายออก');return;}
  const cb=calcCB(fromSid,S.month);
  const over=BT.find(t=>bills[t]>(cb[t]||0));
  if(over){toast(`แบงค์ ฿${BL[over]} เกินจำนวนที่มีในกล่อง`);return;}
  const ownerGrp=S.groups.find(g=>g.id===ownerGid);
  const fromShop=S.shops.find(s=>s.id===fromSid);
  const d=today();const mk2=S.month;
  const eOut={id:uid(),type:'exout',df:d,dt:d,amount,title:`จ่ายเฮียรวย → ${ownerGrp?.name}`,note:'',bills,oid:ownerFirstId};
  const eIn={id:uid(),type:'exin',df:d,dt:d,amount,title:`รับจาก ${fromShop?.name}`,note:'',bills,oid:fromSid};
  try{
    await sbUpsert('entries',[entryToRow(eOut,fromSid,mk2),entryToRow(eIn,ownerFirstId,mk2)]);
    ge(fromSid,mk2).push(eOut);
    ge(ownerFirstId,mk2).push(eIn);
    CM();render();toast(`จ่ายเฮียรวย ${fmt(amount)} แล้ว ✓`);

async function saveExpenseGroup(gid){
  const d=document.getElementById('ep_d').value;
  const t=document.getElementById('ep_t').value||'รายจ่าย';
  const bills=gb('ep');
  const amount=bv(bills);
  if(!d){toast('กรุณาเลือกวันที่');return;}
  if(amount===0){toast('กรุณาเลือกแบงค์ที่จ่ายออกอย่างน้อย 1 ใบ');return;}
  // distribute bills to routes that actually have those denominations (avoid negative bills)
  const memberIds=S.groupMembers[gid]||[];
  const rem=Object.assign(eb(),bills);
  const dist={};
  for(const sid of memberIds){
    const cb=calcCB(sid,S.month);
    BT.forEach(tk=>{
      if(rem[tk]>0&&(cb[tk]||0)>0){
        const take=Math.min(rem[tk],cb[tk]);
        if(!dist[sid])dist[sid]=eb();
        dist[sid][tk]=(dist[sid][tk]||0)+take;
        rem[tk]-=take;
      }
    });
  }
  const deficit=BT.find(tk=>rem[tk]>0);
  if(deficit){toast(`แบงค์ ฿${BL[deficit]} ไม่พอในกลุ่ม`);return;}
  try{
    const batchId=uid();
    const entries=Object.entries(dist).map(([sid,rb])=>({id:uid(),sid,rb}));
    const rows=entries.map(({id,sid,rb})=>entryToRow({id,type:'expense',df:d,dt:d,amount:bv(rb),title:t,note:null,bills:rb,oid:batchId},sid,S.month));
    await sbUpsert('entries',rows);
    entries.forEach(({id,sid,rb})=>ge(sid,S.month).push({id,type:'expense',df:d,dt:d,amount:bv(rb),title:t,note:null,bills:rb,oid:batchId}));
    CM();render();toast(`บันทึกรายจ่าย ${fmt(amount)} แล้ว ✓`);
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);console.error(err);}
}

  if(typeof Chart==='undefined')return;
  const year=S.ovYear||cpk().split('-')[0];
  const cp=cpk();
  const MN=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const gids=groupedRouteIds();
  const visGroups=isAdmin()?S.groups:S.groups.filter(g=>g.tab_flags?.viewer_visible);
  const standalones=S.shops.filter(s=>!gids.has(s.id)&&(isAdmin()||s.tab_flags?.viewer_visible));
  // รายการที่เลือกได้: กลุ่ม + สายไม่มีกลุ่ม
  const items=[
    ...visGroups.map((g,i)=>{const icon=g.is_owner?'⭐':g.tab_flags?.auto_collect?'⚡':'📁';return{id:'g:'+g.id,name:icon+' '+g.name,color:_GPC[i%_GPC.length],gid:g.id};}),
    ...standalones.map(s=>({id:'s:'+s.id,name:s.name,color:s.color,sid:s.id}))
  ];
  if(!_ovShopVis)_ovShopVis=new Set(items.map(it=>it.id));
  // ปุ่ม toggle
  document.getElementById('ov-chart-btns').innerHTML=items.map(it=>{
    const on=_ovShopVis.has(it.id);
    return`<button onclick="toggleOvShop('${it.id}')" style="border:2px solid ${it.color};background:${on?it.color:'transparent'};color:${on?'#111':it.color};padding:3px 12px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:var(--font);transition:all .15s;">${it.name}</button>`;
  }).join('');
  // helper คำนวณ net ต่อเดือน
  const netLine=ids=>Array.from({length:12},(_,i)=>{
    const mk=`${year}-${String(i+1).padStart(2,'0')}`;
    if(mk>cp)return null;
    let tc=0,ti=0,te=0,tei=0,teo=0;
    ids.forEach(sid=>{
      (S.entries[sid]||{})[mk]?.forEach(e=>{
        if(e.type==='count')tc+=e.total||0;
        else if(e.type==='income')ti+=e.amount||0;
        else if(e.type==='expense')te+=e.amount||0;
        else if(e.type==='exin')tei+=e.amount||0;
        else if(e.type==='exout')teo+=e.amount||0;
      });
      const sess=(S.sessions[sid]||{})[mk];
      if(sess)sess.subs.forEach(s=>tc+=bv(s.bills||eb()));
    });
    return tc+ti-te+tei-teo;
  });
  const mkDs=(label,color,data)=>({label,data,borderColor:color,backgroundColor:color+'22',tension:0.35,pointRadius:4,pointHoverRadius:6,spanGaps:false,borderWidth:2});
  // ตรวจว่าเลือกกลุ่มเดียว → แยกรายสายในกลุ่ม
  const sel=items.filter(it=>_ovShopVis.has(it.id));
  let datasets;
  if(sel.length===1&&sel[0].gid){
    const memberIds=S.groupMembers[sel[0].gid]||[];
    datasets=memberIds.map((rid,i)=>{
      const shop=S.shops.find(s=>s.id===rid);
      return shop?mkDs(shop.name,shop.color||_GPC[i%_GPC.length],netLine([rid])):null;
    }).filter(Boolean);
  }else{
    datasets=sel.map(it=>mkDs(it.name,it.color,netLine(it.gid?(S.groupMembers[it.gid]||[]):[it.sid])));
  }
  const canvas=document.getElementById('ov-chart-canvas');
  if(!canvas)return;
  if(_ovChart){_ovChart.data.datasets=datasets;_ovChart.update();}
  else{
    Chart.defaults.color='#888';
    _ovChart=new Chart(canvas.getContext('2d'),{
      type:'line',data:{labels:MN,datasets},
      options:{
        responsive:true,maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        layout:{padding:{right:90,top:6}},
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`}}},
        scales:{
          x:{grid:{color:'#2a2a2a'},ticks:{color:'#888',font:{family:'Sarabun'}}},
          y:{grid:{color:'#2a2a2a'},ticks:{color:'#888',callback:v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'k':String(v)}}
        }
      },plugins:[_endLabelPlugin]
    });
  }
}

    if(isHR()){
      // hr โหลด employees + routes + groups + group_members (เพื่อเรียงลำดับให้เหมือน admin)
      const[emps,routes,groups,gMembers]=await Promise.all([

      ]);

      PR.employees=emps;PR.loans=loans;PR.periods=periods;PR.entries=entries;PR.deductions=deds;PR._loaded=true;
