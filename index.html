async function _pushOn(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('ไม่ได้รับอนุญาตให้แจ้งเตือน');return;}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:_b64ToU8(VAPID_PUB)});
    const res=await fetch(WORKER_URL+'/push/subscribe',{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+_wToken()},
      body:JSON.stringify({endpoint:sub.endpoint,label:navigator.userAgent.slice(0,60)})});

let _attDate=null, _attEvents=null, _attAlerts=null, _attLoading=false;

// วันทำงานปัจจุบัน (ตัดวันที่ 04:00 เหมือนฝั่ง Worker)
function attToday(){
  const d=new Date(Date.now()+3*3600*1000);
  return d.toISOString().slice(0,10);
}
function _hhmm(ts){const t=new Date(ts);return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');}
function _mins(hhmm){if(!hhmm)return null;const[h,m]=String(hhmm).slice(0,5).split(':').map(Number);return h*60+m;}
function _minsOfTs(ts){const t=new Date(ts);return t.getHours()*60+t.getMinutes();}

async function attLoadDay(d){
  _attDate=d||_attDate||attToday();
  _attLoading=true;renderPayroll();
  try{
    _attEvents=await sbGet('att_events',`work_date=eq.${_attDate}&order=ts.asc`);
    _attAlerts=await sbGet('att_alerts',`work_date=eq.${_attDate}&order=ts.desc`).catch(()=>[]);
  }catch(e){_attEvents=[];toast('โหลดไม่สำเร็จ: '+e.message);}
  _attLoading=false;renderPayroll();
}
function attShiftDay(n){
  const d=new Date(_attDate||attToday());
  d.setDate(d.getDate()+n);
  const nd=d.toISOString().slice(0,10);
  if(nd>attToday())return;
  attLoadDay(nd);
}

function renderPrAtt(){
  if(!_attDate){setTimeout(()=>attLoadDay(attToday()),0);
    return`<div class="empty"><div class="ei">⏳</div><p>กำลังโหลด…</p></div>`;}

  const isToday=_attDate===attToday();
  const evs=_attEvents||[];
  const byEmp={};evs.forEach(e=>{(byEmp[e.employee_id]=byEmp[e.employee_id]||[]).push(e);});

  // พนักงานที่ต้องตอกเวลา จัดกลุ่มตามสาย
  let nIn=0,nLate=0,nMiss=0,nFlag=0;
  const groups=_shiftOrderedGroups();
  let body='';

  groups.forEach(g=>{
    let gHtml='';
    g.routes.forEach(rt=>{
      const sh=_shiftOf(rt.id);
      if(sh.point_mode==='off')return;
      const emps=PR.employees.filter(e=>e.status==='active'&&e.route_id===rt.id)
        .sort((a,b)=>{
          const ta=(byEmp[a.id]||[])[0], tb=(byEmp[b.id]||[])[0];
          if(ta&&tb)return new Date(ta.ts)-new Date(tb.ts);
          if(ta)return -1;if(tb)return 1;
          return (a.name||'').localeCompare(b.name||'','th');
        });
      if(!emps.length)return;

      const startMin=_mins(_shTrips(sh)[0]?.start);
      const grace=Number(sh.grace_min??10);
      const expect=_expTaps(sh);

      const rows=emps.map((e,idx)=>{
        const list=byEmp[e.id]||[];
        const first=list[0];
        let lateTxt='',lateCol='var(--text3)';
        if(!first){nMiss++;lateTxt='ยังไม่มา';lateCol='var(--red)';}
        else{
          nIn++;
          if(startMin!=null){
            const diff=_minsOfTs(first.ts)-startMin;
            if(diff>grace){nLate++;lateTxt=`สาย ${diff} นาที`;lateCol='var(--red)';}
            else if(diff>0){lateTxt=`+${diff} นาที`;lateCol='var(--amber)';}
            else{lateTxt=`ก่อนเวลา ${-diff} นาที`;lateCol='var(--green)';}
          } else lateTxt='—';
        }
        const flags=list.reduce((a,v)=>{const f=v.flags||{};Object.keys(f).forEach(k=>{if(f[k])a[k]=f[k];});return a;},{});

        if(flags.clockskew)fchips.push('<span title="เวลาในเครื่องเพี้ยน" style="font-size:10px;color:var(--red);">⏱✕</span>');
        if(fchips.length)nFlag++;

        const times=list.map(v=>{
          const bad=(v.flags&&(v.flags.far||v.flags.noloc));
          return`<span onclick="attEvDetail('${v.id}')" title="แตะครั้งที่ ${v.seq}" style="cursor:pointer;font-family:var(--mono);font-size:12px;padding:1px 5px;border-radius:5px;background:${bad?'var(--rdim)':'var(--bg3)'};border:1px solid ${bad?'var(--rbr)':'var(--border)'};">${_hhmm(v.ts)}</span>`;

          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <span style="font-size:13px;font-weight:500;">${e.name}</span>
              ${e.position?`<span style="font-size:10px;color:var(--text3);">${e.position}</span>`:''}

            </div>
            <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;">${times||'<span style="font-size:11px;color:var(--text3);">ไม่มีการแตะ</span>'}</div>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div style="font-size:11px;font-weight:600;color:${lateCol};">${lateTxt}</div>
            <div style="font-size:10px;color:${short?'var(--amber)':'var(--text3)'};">${list.length}/${expect} ครั้ง</div>
          </div>
        </div>`;
      }).join('');

      const tripLbl=_shTrips(sh).map((t,i)=>t.start?`${t.start}${t.end?'-'+t.end:''}`:'').filter(Boolean).join(' · ')||'ยังไม่ตั้งเวลา';
      gHtml+=`<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:9px;">
        <div style="display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--bg3);border-bottom:1px solid var(--border);">
          <span style="width:9px;height:9px;border-radius:50%;background:${rt.color};flex-shrink:0;"></span>

        </div>
        <div style="background:var(--bg2);">${rows}</div>
      </div>`;

      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:7px;">${g.icon} ${g.name}</div>${gHtml}</div>`;
  });

  const card=(lbl,val,col)=>`<div style="flex:1;min-width:70px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;text-align:center;">

  return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn btn-b" style="padding:6px 11px;" onclick="attShiftDay(-1)">‹</button>

// ⏱ เวลาเข้างาน — ตั้งค่าต่อสาย (admin only)
// ═══════════════════════════════════════════════════════════
// route_shifts: 1 แถว = 1 สาย
//   { route_id, enabled, start_time, trips, trips_json, expected_taps,
//     grace_min, work_days, point_mode, place_point_id, note }
// trips_json = [{start:"05:30", end:"09:00"}, ...] — เวลาออก/กลับของแต่ละเที่ยว
// point_mode: 'vehicle' = แตะสติ๊กเกอร์บนรถ | 'place' = แตะที่สถานที่ | 'off' = ไม่ต้องตอก
const _DOW=['จ','อ','พ','พฤ','ศ','ส','อา'];
const _WD_ALL='1234567';

function _shTrips(sh){
  let t=sh.trips_json;
  if(typeof t==='string'){try{t=JSON.parse(t);}catch(e){t=null;}}
  if(!Array.isArray(t)||!t.length)t=[{start:sh.start_time?String(sh.start_time).slice(0,5):'',end:''}];
  return t;
}
function _shiftOf(rid){
  return PR.shifts.find(s=>s.route_id===rid)||{route_id:rid,enabled:true,start_time:null,trips:1,trips_json:null,
    grace_min:10,work_days:_WD_ALL,point_mode:'vehicle',place_point_id:null,note:null};
}
// แตะกี่ครั้ง/วัน = เข้างาน 1 + (ออก+กลับ) เที่ยวละ 2
function _expTaps(sh){return sh.point_mode==='off'?0:1+_shTrips(sh).length*2;}

function _shiftOrderedGroups(){
  const out=[];
  const groupedIds=groupedRouteIds();
  const sorted=[...S.shops].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  S.groups.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).forEach(g=>{
    const members=(S.groupMembers[g.id]||[]).map(id=>S.shops.find(s=>s.id===id)).filter(Boolean);
    if(members.length)out.push({key:g.id,name:g.name,icon:'📁',routes:members});
  });
  const solo=sorted.filter(r=>!groupedIds.has(r.id));
  if(solo.length)out.push({key:'__solo__',name:'สายเดี่ยว',icon:'🚚',routes:solo});
  return out;
}

// ─── บันทึก (upsert แถวเต็มเสมอ) ───
function _shRow(rid,patch){
  const cur=_shiftOf(rid);
  const trips=_shTrips(cur);
  const row={route_id:rid,enabled:true,
    start_time:trips[0]?.start||null,
    trips:trips.length,
    trips_json:trips,
    grace_min:cur.grace_min??10,
    work_days:cur.work_days||_WD_ALL,
    point_mode:cur.point_mode||'vehicle',
    place_point_id:cur.place_point_id||null,
    note:cur.note||null,
    ...patch};
  if(patch.trips_json){row.trips=patch.trips_json.length;row.start_time=patch.trips_json[0]?.start||null;}
  row.expected_taps=row.point_mode==='off'?0:1+(row.trips||1)*2;
  return row;
}
async function _shSave(row){
  try{
    await sbUpsert('route_shifts',row);
    const i=(PR.shifts||[]).findIndex(s=>s.route_id===row.route_id);
    if(i>-1)PR.shifts[i]=row;else (PR.shifts=PR.shifts||[]).push(row);
    renderPayroll();
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}
function _shSet(rid,field,val){
  if(field==='grace_min')val=Math.max(0,Math.min(120,Number(val)||0));
  if(field==='place_point_id'&&!val)val=null;
  _shSave(_shRow(rid,{[field]:val}));
}
function _shTripSet(rid,idx,which,val){
  const trips=_shTrips(_shiftOf(rid)).map(t=>({start:t.start||'',end:t.end||''}));
  if(!trips[idx])return;
  trips[idx][which]=val||'';
  _shSave(_shRow(rid,{trips_json:trips}));
}
function _shAddTrip(rid){
  const trips=_shTrips(_shiftOf(rid)).map(t=>({start:t.start||'',end:t.end||''}));
  if(trips.length>=6){toast('เพิ่มได้สูงสุด 6 เที่ยว');return;}
  trips.push({start:'',end:''});
  _shSave(_shRow(rid,{trips_json:trips}));
}
function _shDelTrip(rid,idx){
  const trips=_shTrips(_shiftOf(rid)).map(t=>({start:t.start||'',end:t.end||''}));
  if(trips.length<=1)return;
  trips.splice(idx,1);
  _shSave(_shRow(rid,{trips_json:trips}));
}
function _shToggleDay(rid,n){
  const wd=_shiftOf(rid).work_days||_WD_ALL;
  const next=wd.includes(n)?wd.split('').filter(c=>c!==n).join(''):(wd+n).split('').sort().join('');
  _shSet(rid,'work_days',next||'1');
}

// ─── จัดการเครื่องพนักงาน (QR ลงทะเบียน / อนุมัติรหัส / ถอน) ───
function _devsOf(empId){
  return (PR.devices||[]).filter(d=>d.employee_id===empId&&d.status==='active')
    .sort((a,b)=>new Date(b.bound_at||0)-new Date(a.bound_at||0));
}
function _devOf(empId){return _devsOf(empId)[0]||null;}
// ชื่อเครื่องแบบสั้นจาก user agent
function _devKind(d){
  const u=d.label||d.ua||'';
  if(/iPhone|iPad|iPod/.test(u))return'iPhone';
  if(/Android/.test(u))return'Android';
  return'เครื่อง';
}
function _devAgo(ts){
  if(!ts)return'ยังไม่เคยแตะ';
  const m=Math.floor((Date.now()-new Date(ts))/60000);
  if(m<60)return`${m} นาทีที่แล้ว`;
  const h=Math.floor(m/60);if(h<24)return`${h} ชม.ที่แล้ว`;
  return`${Math.floor(h/24)} วันที่แล้ว`;
}
function openAttDevices(){
  const url=`${location.origin}/?enroll=1`;
  const active=PR.employees.filter(e=>e.status==='active');
  const pending=(PR.devices||[]).filter(d=>d.status==='pending'&&(!d.expires_at||new Date(d.expires_at)>new Date()));
  const bound=[],unbound=[];
  active.forEach(e=>{(_devsOf(e.id).length?bound:unbound).push({e});});
  const empOpts=active.map(e=>{const rt=S.shops.find(s=>s.id===e.route_id);
    return`<option value="${e.id}">${e.name}${rt?' — '+rt.name:''}</option>`;}).join('');

  const pendHtml=pending.length?pending.map(d=>{
    const mins=d.expires_at?Math.max(0,Math.round((new Date(d.expires_at)-Date.now())/60000)):15;
    return`<div style="padding:12px;border-bottom:1px solid var(--border);background:var(--gdim);">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <span style="font-size:26px;font-weight:800;font-family:var(--mono);letter-spacing:2px;color:var(--green);">${d.code}</span>
        <span style="font-size:11px;color:var(--text3);flex:1;">เหลือ ${mins} นาที</span>

async function _devReload(){

  catch(e){toast('โหลดไม่สำเร็จ: '+e.message);}

async function _devApprove(devId,code){
  const sel=document.getElementById('ap_'+devId);
  const empId=sel?.value;
  if(!empId){toast('เลือกชื่อพนักงานก่อน');return;}
  const name=sel.options[sel.selectedIndex].textContent;
  if(!confirm(`อนุมัติรหัส ${code} ให้:\n\n${name}\n\nเครื่องเก่าของคนนี้ (ถ้ามี) จะใช้ไม่ได้ทันที`))return;
  try{
    const res=await fetch(WORKER_URL+'/att/approve',{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+_wToken()},
      body:JSON.stringify({device_id:devId,employee_id:empId})});
    const d=await res.json();
    if(!res.ok){toast(d.error||'อนุมัติไม่สำเร็จ');return;}
    toast(`อนุมัติให้ ${d.employee?.name||''} แล้ว ✓`);
    await _devReload();
  }catch(e){toast('เชื่อมต่อไม่ได้: '+e.message);}
}
async function _devRevoke(devId,name){
  if(!confirm(`ถอนเครื่องของ ${name}?\n\nเครื่องนั้นจะแตะเวลาไม่ได้ทันที และดูข้อมูลตัวเองไม่ได้\nประวัติเก่ายังอยู่ครบ`))return;
  try{
    const d=(PR.devices||[]).find(x=>x.id===devId);
    await sbUpsert('att_devices',{...d,status:'revoked',revoked_at:new Date().toISOString(),claim_token:null,view_hash:null});
    if(d){d.status='revoked';}
    openAttDevices();toast('ถอนเครื่องแล้ว ✓');
  }catch(e){toast('ถอนไม่สำเร็จ: '+e.message);}
}

// ── Periods tab ──
function renderPrPeriods(){
  const m=PR.month;
  const [yStr,moStr]=m.split('-');
  const y=Number(yStr),mo=Number(moStr);
  const nowM=prMonthNow(),nowY=Number(nowM.split('-')[0]),nowMo=Number(nowM.split('-')[1]);
  // ปีที่มีข้อมูล (periods) + ปีปัจจุบัน
  const periodYears=new Set(PR.periods.map(p=>Number(p.period_key.split('-')[0])));
  periodYears.add(nowY);
  const validYears=[...periodYears].filter(yr=>yr<=nowY).sort((a,b)=>a-b);
  const btnBase='padding:6px 4px;text-align:center;border-radius:6px;font-size:12px;line-height:1.3;transition:background .15s;';
  const disabledStyle='opacity:0.25;cursor:default;pointer-events:none;';
  const yearCells=validYears.map(yr=>{
    const sel=yr===y;
    return`<div onclick="prSetYear(${yr})" style="${btnBase}cursor:pointer;border:1px solid ${sel?'var(--amber)':'var(--border)'};background:${sel?'var(--adim)':'var(--bg2)'};color:${sel?'var(--amber)':'var(--text)'};font-weight:${sel?'600':'400'};">
      <div>${yr}</div><div style="font-size:10px;color:var(--text3);">${yr-543}</div>
    </div>`;
  }).join('');
  // เดือนที่มีข้อมูลในปีนั้น + เดือนปัจจุบัน (ถ้าเป็นปีปัจจุบัน)
  const validMos=new Set(PR.periods.filter(p=>p.period_key.startsWith(`${y}-`)).map(p=>Number(p.period_key.split('-')[1])));
  if(y===nowY) validMos.add(nowMo);
  const validMoArr=[...validMos].sort((a,b)=>a-b);
  const monthCells=validMoArr.map(mn=>{
    const mk=`${y}-${String(mn).padStart(2,'0')}`;
    const sel=mo===mn;
    const hasPeriod=PR.periods.some(p=>p.period_key.startsWith(mk+'-'));
    return`<div onclick="prSetMonth(${mn})" style="${btnBase}cursor:pointer;border:1px solid ${sel?'var(--amber)':'var(--border)'};background:${sel?'var(--adim)':'var(--bg2)'};color:${sel?'var(--amber)':'var(--text)'};font-weight:${sel?'600':'400'};position:relative;min-width:44px;">
      ${mn}${hasPeriod?`<span style="position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:${sel?'var(--amber)':'var(--green)'}"></span>`:''}
    </div>`;
  }).join('');
  const cols=Math.min(validYears.length,6);
  const slots=[{k:'A',lbl:'1–10'},{k:'B',lbl:'11–20'},{k:'C',lbl:prSlotLbl(m,'C')}];
  let html=`<div style="margin-bottom:16px;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;">
    <div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:4px;margin-bottom:8px;">${yearCells}</div>
    <div style="display:flex;gap:4px;">${monthCells}</div>
  </div>
  <div class="pr-period-grid">`;
  slots.forEach(({k,lbl})=>{
    const pk=`${m}-${k}`;
    const period=PR.periods.find(p=>p.period_key===pk);
    if(!period){
      html+=`<div class="pr-period-card" style="cursor:default;">
        <div class="pr-period-title">${lbl}</div>
        <div class="pr-period-sub" style="margin-bottom:12px;">${prMonthLbl(m)}</div>
        <button class="btn btn-a" style="width:100%;font-size:13px;" onclick="this.disabled=true;this.textContent='กำลังสร้าง…';generatePeriod('${m}','${k}').finally(()=>{this.disabled=false;this.textContent='+ สร้างงวด';})">+ สร้างงวด</button>
      </div>`;
    } else {
      const _monthlyTypes=['โอนจ่ายM','รายเดือน'];
      const ents=PR.entries.filter(e=>{
        if(e.period_id!==period.id)return false;
        if(k!=='C'){const emp=PR.employees.find(x=>x.id===e.employee_id);if(emp&&_monthlyTypes.includes(emp.payment_type))return false;}
        return true;
      });
      const _f1Id=S.shops.find(s=>s.name==='F1')?.id;
      const _burGrp=S.groups.find(g=>g.name.includes('บูรชัย'));
      const _burIds=new Set(_burGrp?S.groupMembers[_burGrp.id]||[]:[]);
      const _ownerName=(S.groups.find(g=>g.is_owner)?.name)||'เฮียรวย';
      let total=0,cMain=0,cF1=0,cBur=0;
      ents.forEach(e=>{
        const emp=PR.employees.find(x=>x.id===e.employee_id);
        const deds=PR.deductions.filter(d=>d.entry_id===e.id);
        const net=(emp?.daily_rate||0)*(e.days_worked||0)+(e.bonus||0)-deds.reduce((a,d)=>a+d.amount,0)-(e.advance||0);
        total+=net;
        if(!emp)return;
        const pt=emp.payment_type||'เงินสดW';
        const inBur=_burIds.has(emp.route_id);
        if(emp.route_id===_f1Id&&pt==='เงินสดW')cF1+=net;
        else if(inBur&&pt==='เงินสดW')cBur+=net;
        else if(pt==='เงินสดW')cMain+=net;
      });
      const isPaid=period.status==='paid';
      html+=`<div class="pr-period-card ${isPaid?'paid':'draft'}" style="position:relative;" onclick="openPeriod('${period.id}')">
        ${isAdmin()?`<button onclick="event.stopPropagation();deletePeriod('${period.id}','${lbl}')" title="ลบงวด" style="position:absolute;top:8px;right:8px;background:var(--bg3);border:1px solid var(--border);color:var(--text3);border-radius:6px;width:26px;height:26px;line-height:1;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;">🗑</button>`:''}
        <div class="pr-period-title">${lbl}</div>
        <div class="pr-period-sub">${prMonthLbl(m)}</div>
        <div style="margin:8px 0;font-family:var(--mono);font-size:16px;color:${isPaid?'var(--green)':'var(--amber)'};">${fmt(total)}</div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:6px;line-height:1.8;">
          <span>${_ownerName} <span style="font-family:var(--mono);color:var(--green);">${fmt(cMain)}</span></span>
          ${_f1Id?`<span style="margin-left:8px;">F1 <span style="font-family:var(--mono);color:var(--green);">${fmt(cF1)}</span></span>`:''}
          ${_burGrp?`<span style="margin-left:8px;">${_burGrp.name} <span style="font-family:var(--mono);color:var(--green);">${fmt(cBur)}</span></span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:11px;color:var(--text3);">${ents.length} คน · ${isPaid?'✅ จ่ายแล้ว':'⏳ รอจ่าย'}</span>
          <button onclick="event.stopPropagation();sharePeriod('${period.id}')" style="margin-left:auto;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;">📤</button>
        </div>
      </div>`;
    }
  });
  html+=`</div>`;
  return html;
}
function prAdjMonth(d){PR.month=prMonthAdj(PR.month,d);renderPayroll();}
function prSetYear(yr){const mo=PR.month.split('-')[1];PR.month=`${yr}-${mo}`;renderPayroll();}
function prSetMonth(mn){const yr=PR.month.split('-')[0];PR.month=`${yr}-${String(mn).padStart(2,'0')}`;renderPayroll();}
function prAdjYear(d){const[yr,mo]=PR.month.split('-');PR.month=`${Number(yr)+d}-${mo}`;renderPayroll();}
async function deletePeriod(periodId,lbl){
  if(!isAdmin())return;
  const period=PR.periods.find(p=>p.id===periodId);if(!period)return;
  const entIds=PR.entries.filter(e=>e.period_id===periodId).map(e=>e.id);
  if(!confirm(`ลบงวด "${lbl||''}" ทั้งหมด?\nสลิป ${entIds.length} คน + รายการหักจะถูกลบถาวร`))return;
  // อัปเดต UI ทันที (optimistic) แล้วค่อยลบใน DB
  PR.deductions=PR.deductions.filter(d=>!entIds.includes(d.entry_id));
  PR.entries=PR.entries.filter(e=>e.period_id!==periodId);
  PR.periods=PR.periods.filter(p=>p.id!==periodId);
  renderPayroll();
  try{
    for(const eid of entIds){try{await sbDelete('payroll_deductions','entry_id=eq.'+eid);}catch(_){}}
    if(entIds.length)try{await sbDelete('payroll_entries','period_id=eq.'+periodId);}catch(_){}
    await sbDelete('payroll_periods','id=eq.'+periodId);
    toast('ลบงวดแล้ว');
  }catch(e){toast('ลบไม่สำเร็จ: '+e.message+' (รีเฟรชหน้าเพื่อโหลดใหม่)');}
}

async function generatePeriod(beYM,slot){
  if(!PR._loaded){toast('กำลังโหลดข้อมูล กรุณารอสักครู่…');return;}
  const slotMap={A:{from:1,to:10,payD:11},B:{from:11,to:20,payD:21},C:{from:21,to:0,payD:1}};
  const s=slotMap[slot];
  const[y,m]=beYM.split('-').map(Number);const ceY=y-543;
  let toDay=s.to;
  if(slot==='C'){toDay=new Date(ceY,m,0).getDate();}
  const dateFrom=prBeToDate(beYM,s.from);
  const dateTo=prBeToDate(beYM,toDay);
  let payDate;
  if(slot==='C'){const nm=m===12?1:m+1;const ny=m===12?ceY+1:ceY;payDate=`${ny}-${String(nm).padStart(2,'0')}-01`;}
  else payDate=prBeToDate(beYM,s.payD);
  const pk=`${beYM}-${slot}`;
  const existing=PR.periods.find(p=>p.period_key===pk);
  if(existing){
    const hasEntries=PR.entries.some(e=>e.period_id===existing.id);
    if(hasEntries){toast(`งวด ${pk} มีอยู่แล้ว`);return;}
    // stale period with no entries — delete and recreate
    try{await sbDelete('payroll_periods','id=eq.'+existing.id);}catch(_){}
    PR.periods=PR.periods.filter(p=>p.period_key!==pk);
  }
  const pid=uid();
  const periodRow={id:pid,period_key:pk,date_from:dateFrom,date_to:dateTo,pay_date:payDate,status:'draft'};
  try{
    await sbUpsert('payroll_periods',[periodRow]);
    PR.periods.push(periodRow);
    // โอนจ่ายM และ รายเดือน ขึ้นเฉพาะงวด C (21-31) เท่านั้น
    const monthlyTypes=['โอนจ่ายM','รายเดือน'];
    const activeEmps=PR.employees.filter(e=>e.status==='active'&&(slot==='C'||!monthlyTypes.includes(e.payment_type)));
    const defDays=slot==='C'?toDay-20:10;
    if(activeEmps.length===0){toast(`สร้างงวด ${pk} แล้ว (ไม่มีพนักงาน)`);renderPayroll();return;}
    const entryRows=activeEmps.map(emp=>({id:uid(),period_id:pid,employee_id:emp.id,route_id:emp.route_id,days_worked:defDays,bonus:0,advance:0,net_pay:0,notes:null}));
    const dedRows=[];
    entryRows.forEach(entry=>{
      const emp=PR.employees.find(e=>e.id===entry.employee_id);
      PR.loans.filter(l=>l.employee_id===entry.employee_id&&l.status==='active').forEach(loan=>{
        dedRows.push({id:uid(),entry_id:entry.id,loan_id:loan.id,type:loan.type,label:loan.description||loan.type,amount:loan.per_period_amount});
      });
      if(emp.phone_fee>0)dedRows.push({id:uid(),entry_id:entry.id,loan_id:null,type:'phone',label:'ค่าโทร',amount:emp.phone_fee});
      if(emp.room_fee>0)dedRows.push({id:uid(),entry_id:entry.id,loan_id:null,type:'room',label:'ค่าห้อง',amount:emp.room_fee});
    });
    entryRows.forEach(entry=>{
      const emp=PR.employees.find(e=>e.id===entry.employee_id);
      const totalDed=dedRows.filter(d=>d.entry_id===entry.id).reduce((s,d)=>s+d.amount,0);
      entry.net_pay=(emp.daily_rate||0)*entry.days_worked-totalDed;
    });
    await sbUpsert('payroll_entries',entryRows);
    PR.entries.push(...entryRows);
    if(dedRows.length>0){await sbUpsert('payroll_deductions',dedRows);PR.deductions.push(...dedRows);}
    toast(`สร้างงวด ${pk} แล้ว (${activeEmps.length} คน) ✓`);renderPayroll();
  }catch(e){toast('สร้างงวดไม่สำเร็จ: '+e.message);console.error(e);}
}

async function sharePeriod(periodId){
  const period=PR.periods.find(p=>p.id===periodId);if(!period)return;
  const slot=period.period_key.split('-')[2];
  const[y,mo]=period.period_key.split('-');
  const slotLbl=prSlotLbl(`${y}-${mo}`,slot);
  const mLbl=prMonthLbl(`${y}-${mo}`);
  const ents=PR.entries.filter(e=>e.period_id===periodId);
  const hr=_prSettings.hideRates;
  const fmtN=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');

  // หากลุ่มบูรชัย (ชื่อกลุ่มที่มี "บูรชัย")
  const burachaiGrp=S.groups.find(g=>g.name.includes('บูรชัย'));
  const burachaiMemberIds=new Set(burachaiGrp?S.groupMembers[burachaiGrp.id]||[]:[]);
  const f1Route=S.shops.find(s=>s.name==='F1');
  const f1Id=f1Route?.id;

  function _calcNet(e,emp){
    const deds=PR.deductions.filter(d=>d.entry_id===e.id);
    const totalDed=deds.reduce((s,d)=>s+d.amount,0);
    const base=(emp.daily_rate||0)*(e.days_worked||0);
    return{net:base+(e.bonus||0)-totalDed-(e.advance||0),base,totalDed};
  }
  function _entryLine(e,emp){
    const{net,base,totalDed}=_calcNet(e,emp);
    let parts=[`  ${emp.name}`];
    parts.push(`${e.days_worked}วัน`);
    if(!hr)parts.push(`฿${fmtN(base)}`);
    if(totalDed>0)parts.push(`หัก ${fmtN(totalDed)}`);
    if(e.bonus>0)parts.push(`+โบนัส ${fmtN(e.bonus)}`);
    parts.push(`→ ฿${fmtN(net)}`);
    return{line:parts.join('  '),net};
  }

  // ── ชุดที่ 1: เงินสดW ทุกสาย (F1 แยกยอด) ──
  const byRoute1={};
  ents.forEach(e=>{
    const emp=PR.employees.find(x=>x.id===e.employee_id);if(!emp)return;
    if(emp.payment_type&&emp.payment_type!=='เงินสดW')return; // เฉพาะเงินสดW
    if(burachaiMemberIds.has(emp.route_id)&&emp.route_id!==f1Id)return; // บูรชัยแยกส่งต่างหาก (ยกเว้น F1 ยังอยู่ฝั่งเฮียรวย)
    const k=emp.route_id||'__none__';
    if(!byRoute1[k])byRoute1[k]=[];byRoute1[k].push({e,emp});
  });
  // เรียงสายตามลำดับเดียวกับที่อื่น (กลุ่ม→สมาชิกในกลุ่ม→standalone→ไม่มีสาย) แล้วข้ามสายที่ไม่มีคนในเฮียรวย
  const _grpIds1=new Set(Object.values(S.groupMembers).flat());
  const _ord1=[];
  [...S.groups].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).forEach(grp=>{
    (S.groupMembers[grp.id]||[]).map(id=>S.shops.find(s=>s.id===id)).filter(Boolean)
      .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).forEach(r=>_ord1.push(r.id));
  });
  [...S.shops].filter(s=>!_grpIds1.has(s.id)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).forEach(r=>_ord1.push(r.id));
  _ord1.push('__none__');
  const sortedRoutes=_ord1.filter(id=>byRoute1[id]);
  let lines1=[`💼 งวด ${slotLbl} ${mLbl}`,'─'.repeat(32),''];
  let tot1Main=0,tot1F1=0,cnt1=0;
  sortedRoutes.forEach(rid=>{
    const rt=S.shops.find(s=>s.id===rid);
    lines1.push(`📍 ${rt?rt.name:'ไม่มีสาย'}`);
    byRoute1[rid].forEach(({e,emp})=>{
      const{line,net}=_entryLine(e,emp);
      lines1.push(line);
      if(rid===f1Id)tot1F1+=net;else tot1Main+=net;
      cnt1++;
    });
    lines1.push('');
  });
  lines1.push('─'.repeat(32));
  lines1.push(`รวมทุกสาย (ยกเว้น F1)  ฿${fmtN(tot1Main)}`);
  if(f1Id&&byRoute1[f1Id])lines1.push(`รวม F1  ฿${fmtN(tot1F1)}`);
  lines1.push(`รวมทั้งหมด ${cnt1} คน  ฿${fmtN(tot1Main+tot1F1)}`);

  // ── ชุดที่ 2: กลุ่มบูรชัย (เงินสดW + โอนจ่ายM) — F1 ขึ้นก่อน บูรชัยตามหลัง ──
  const cashTransferTypes=new Set(['เงินสดW','โอนจ่ายM']);
  // แยก F1 กับ บูรชัย
  const byRoute2F1=[];const byRoute2Bur={};
  ents.forEach(e=>{
    const emp=PR.employees.find(x=>x.id===e.employee_id);if(!emp)return;
    const inBur=burachaiMemberIds.has(emp.route_id);
    const isF1=emp.route_id===f1Id;
    if(!inBur&&!isF1)return;
    const pt=emp.payment_type||'เงินสดW';
    if(!cashTransferTypes.has(pt))return;
    if(isF1){byRoute2F1.push({e,emp});}
    else{const k=emp.route_id||'__none__';if(!byRoute2Bur[k])byRoute2Bur[k]=[];byRoute2Bur[k].push({e,emp});}
  });
  let lines2=[``,`${'─'.repeat(32)}`,`💼 ${burachaiGrp?burachaiGrp.name:'บูรชัย'} — งวด ${slotLbl} ${mLbl}`,'─'.repeat(32),''];
  let tot2=0,tot2Cash=0,cnt2=0;
  // บูรชัย เท่านั้น (ไม่รวม F1)
  Object.keys(byRoute2Bur).forEach(rid=>{
    const rt=S.shops.find(s=>s.id===rid);
    lines2.push(`📍 ${rt?rt.name:'ไม่มีสาย'}`);
    byRoute2Bur[rid].forEach(({e,emp})=>{
      const{line,net}=_entryLine(e,emp);
      const pt=emp.payment_type||'เงินสดW';
      lines2.push(line+(pt!=='เงินสดW'?` [${pt}]`:''));

    });
    lines2.push('');
  });
  lines2.push('─'.repeat(32));
  lines2.push(`รวม ${cnt2} คน · เงินสด ฿${fmtN(tot2Cash)}`);

  const hasLines2=Object.keys(byRoute2Bur).length>0;

  // ── ชุดที่ 3: สรุปสั้น ส่งน้องลัดดา ──
  const ownerGrp=S.groups.find(g=>g.is_owner);

    `${burachaiGrp?burachaiGrp.name:'บูรชัย'}  ฿${fmtN(tot2Cash)}`,
  ];

  // ── เลือกว่าจะส่งชุดไหน ──
  window._sp1=lines1.join('\n');
  window._sp2=lines2.join('\n');
  window._sp3=lines3.join('\n');
  window._spTitle1=`งวด ${slotLbl} ${mLbl} (เฮียรวย)`;
  window._spTitle2=`งวด ${slotLbl} ${mLbl} (บูรชัย)`;
  window._spTitle3=`งวด ${slotLbl} ${mLbl} (สรุป)`;
  window._doShare=async function(key){
    const text=key===1?window._sp1:key===2?window._sp2:window._sp3;
    const title=key===1?window._spTitle1:key===2?window._spTitle2:window._spTitle3;
    CM();
    if(navigator.share){
      try{await navigator.share({title,text});return;}catch(e){if(e.name==='AbortError')return;}

    catch{

      document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);

  OM(`📤 ส่งงวด ${slotLbl} ${mLbl}`,

      <button onclick="_doShare(1)" class="btn btn-g" style="font-size:15px;padding:14px;">💼 ส่งให้เฮียรวย</button>

      <button onclick="_doShare(3)" class="btn btn-b" style="font-size:15px;padding:14px;">🪙 ส่งให้น้องลัดดา</button>
    </div>`,
    `<button class="btn btn-x" onclick="CM()">ยกเลิก</button>`
  );
}

async function shareEmployeeList(){
  const active=PR.employees.filter(e=>e.status==='active');
  const fmtN=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  const groupedIds=new Set(Object.values(S.groupMembers).flat());
  const sortedGroups=[...S.groups].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  let lines=[`👥 รายชื่อพนักงาน (${active.length} คน)`,'─'.repeat(30)];
  // grouped routes
  sortedGroups.forEach(grp=>{
    const members=(S.groupMembers[grp.id]||[]).map(id=>S.shops.find(s=>s.id===id)).filter(Boolean).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    const grpEmps=members.flatMap(r=>active.filter(e=>e.route_id===r.id));
    if(!grpEmps.length)return;
    lines.push('');lines.push(`📁 ${grp.name}`);
    members.forEach(rt=>{
      const emps=active.filter(e=>e.route_id===rt.id);
      if(!emps.length)return;
      lines.push(`  📍 ${rt.name}`);
      emps.forEach(emp=>{
        const p=_prSettings.hideRates?'':`  ฿${fmtN(emp.daily_rate||0)}/วัน`;
        lines.push(`    • ${emp.name}${p}`);
      });
    });
  });
  // standalone routes
  const standaloneRoutes=[...S.shops].filter(r=>!groupedIds.has(r.id)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  standaloneRoutes.forEach(rt=>{
    const emps=active.filter(e=>e.route_id===rt.id);
    if(!emps.length)return;
    lines.push('');lines.push(`📍 ${rt.name}`);
    emps.forEach(emp=>{
      const p=_prSettings.hideRates?'':`  ฿${fmtN(emp.daily_rate||0)}/วัน`;
      lines.push(`  • ${emp.name}${p}`);
    });
  });
  // dept + none
  const deptMap={};
  active.filter(e=>!e.route_id).forEach(e=>{const k=e.department||'ไม่มีสาย';if(!deptMap[k])deptMap[k]=[];deptMap[k].push(e);});
  Object.entries(deptMap).forEach(([dept,emps])=>{
    lines.push('');lines.push(`🏢 ${dept}`);
    emps.forEach(emp=>{
      const p=_prSettings.hideRates?'':`  ฿${fmtN(emp.daily_rate||0)}/วัน`;
      lines.push(`  • ${emp.name}${p}`);
    });
  });
  const text=lines.join('\n');
  if(navigator.share){try{await navigator.share({title:'รายชื่อพนักงาน',text});return;}catch(e){if(e.name==='AbortError')return;}}
  try{await navigator.clipboard.writeText(text);toast('คัดลอกรายชื่อพนักงานแล้ว ✓');}
  catch{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('คัดลอกแล้ว ✓');}
}
async function prUpdateEntry(entryId,field,value){
  const e=PR.entries.find(x=>x.id===entryId);if(!e)return;
  const emp=PR.employees.find(x=>x.id===e.employee_id);if(!emp)return;
  e[field]=parseFloat(value)||0;
  const deds=PR.deductions.filter(d=>d.entry_id===entryId);
  const net=(emp.daily_rate||0)*(e.days_worked||0)+(e.bonus||0)-deds.reduce((s,d)=>s+d.amount,0)-(e.advance||0);
  e.net_pay=net;
  // อัปเดต cell สุทธิใน DOM ทันที
  const netCell=document.getElementById('pr-net-'+entryId);
  if(netCell){netCell.textContent=fmt(net);netCell.style.color=net<0?'var(--red)':'var(--text)';}
  // อัปเดต header totals ทันที
  const periodId=e.period_id;
  const periodEnts=PR.entries.filter(x=>x.period_id===periodId);
  const _f1Id=S.shops.find(s=>s.name==='F1')?.id;
  const _burGrp=S.groups.find(g=>g.name.includes('บูรชัย'));
  const _burIds=new Set(_burGrp?S.groupMembers[_burGrp.id]||[]:[]);
  let _grand=0,_main=0,_f1=0,_bur=0;
  periodEnts.forEach(x=>{
    const xemp=PR.employees.find(p=>p.id===x.employee_id);if(!xemp)return;
    const xdeds=PR.deductions.filter(d=>d.entry_id===x.id);
    const xnet=(xemp.daily_rate||0)*(x.days_worked||0)+(x.bonus||0)-xdeds.reduce((s,d)=>s+d.amount,0)-(x.advance||0);
    const pt=xemp.payment_type||'เงินสดW';
    const inBur=_burIds.has(xemp.route_id);
    _grand+=xnet;
    if(xemp.route_id===_f1Id&&pt==='เงินสดW')_f1+=xnet;
    else if(inBur&&pt==='เงินสดW')_bur+=xnet;
    else if(pt==='เงินสดW')_main+=xnet;
  });
  const _g=document.getElementById('pr-hdr-grand');if(_g)_g.textContent=fmt(_grand);
  const _m=document.getElementById('pr-hdr-main');if(_m)_m.textContent=fmt(_main);
  const _f=document.getElementById('pr-hdr-f1');if(_f)_f.textContent=fmt(_f1);

  try{await sbUpsert('payroll_entries',[e]);}catch(err){toast('บันทึกไม่สำเร็จ');}
}

function prRecalcNet(entryId){
  const e=PR.entries.find(x=>x.id===entryId);if(!e)return;
  const emp=PR.employees.find(x=>x.id===e.employee_id);if(!emp)return;
  const days=parseFloat(document.getElementById('pe-days')?.value)||0;
  const bonus=parseFloat(document.getElementById('pe-bonus')?.value)||0;
  const adv=parseFloat(document.getElementById('pe-advance')?.value)||0;
  const deds=PR.deductions.filter(d=>d.entry_id===entryId);
  const net=(emp.daily_rate||0)*days+bonus-deds.reduce((s,d)=>s+d.amount,0)-adv;
  const el=document.getElementById('pe-net');if(el)el.textContent=fmt(net);
}

async function addDedFromLoan(entryId,periodId,loanId){
  const loan=PR.loans.find(l=>l.id===loanId);if(!loan)return;
  const d={id:uid(),entry_id:entryId,loan_id:loanId,type:loan.type,label:loan.description||loan.type,amount:loan.per_period_amount};
  try{
    await sbUpsert('payroll_deductions',[d]);PR.deductions.push(d);
    const e=PR.entries.find(x=>x.id===entryId);
    const emp=PR.employees.find(x=>x.id===e.employee_id);
    const deds=PR.deductions.filter(x=>x.entry_id===entryId);
    e.net_pay=(emp.daily_rate||0)*(e.days_worked||0)+(e.bonus||0)-deds.reduce((s,x)=>s+x.amount,0)-(e.advance||0);
    await sbUpsert('payroll_entries',[e]);
    CM();setTimeout(()=>openPrEntryDetail(entryId,periodId),50);
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);}
}

async function saveAddDed(entryId,periodId){
  const label=(document.getElementById('add-ded-label')?.value||'').trim();
  const amount=parseFloat(document.getElementById('add-ded-amount')?.value)||0;
  const perPeriod=parseFloat(document.getElementById('add-ded-per')?.value)||0;
  if(!label||!amount){toast('กรุณากรอกรายการและจำนวน');return;}
  const e=PR.entries.find(x=>x.id===entryId);
  const emp=PR.employees.find(x=>x.id===e.employee_id);
  try{
    let loanId=null;
    const dedAmount=(perPeriod>0&&perPeriod<amount)?perPeriod:amount;
    if(perPeriod>0&&perPeriod<amount){
      // สร้าง loan ใหม่เพื่อหักต่อเนื่องงวดถัดไป
      const loan={id:uid(),employee_id:emp.id,type:'other',description:label,
        total_amount:amount,per_period_amount:perPeriod,paid_amount:0,status:'active'};
      await sbUpsert('employee_loans',[loan]);
      PR.loans.push(loan);
      loanId=loan.id;
    }
    const d={id:uid(),entry_id:entryId,loan_id:loanId,type:'other',label,amount:dedAmount};
    await sbUpsert('payroll_deductions',[d]);PR.deductions.push(d);
    const deds=PR.deductions.filter(x=>x.entry_id===entryId);
    e.net_pay=(emp.daily_rate||0)*(e.days_worked||0)+(e.bonus||0)-deds.reduce((s,x)=>s+x.amount,0)-(e.advance||0);
    await sbUpsert('payroll_entries',[e]);
    CM();setTimeout(()=>openPrEntryDetail(entryId,periodId),50);
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);}
}

function confirmMarkPaid(periodId){
  if(!confirm('ยืนยันว่าจ่ายเงินครบแล้ว?\n\nระบบจะอัปเดตยอดผ่อนชำระของทุกคนในงวดนี้'))return;
  markPeriodPaid(periodId);
}
async function markPeriodPaid(periodId){
  const period=PR.periods.find(p=>p.id===periodId);if(!period)return;
  period.status='paid';
  try{
    await sbUpsert('payroll_periods',[period]);
    const ents=PR.entries.filter(e=>e.period_id===periodId);
    const deds=PR.deductions.filter(d=>ents.some(e=>e.id===d.entry_id)&&d.loan_id);
    const lUpd={};
    deds.forEach(d=>{lUpd[d.loan_id]=(lUpd[d.loan_id]||0)+d.amount;});
    const lRows=[];
    for(const[lid,paid] of Object.entries(lUpd)){
      const l=PR.loans.find(x=>x.id===lid);if(!l)continue;
      l.paid_amount=(l.paid_amount||0)+paid;
      if(l.paid_amount>=l.total_amount)l.status='completed';
      lRows.push(l);
    }
    if(lRows.length>0)await sbUpsert('employee_loans',lRows);
    CM();toast('บันทึกการจ่ายเงินแล้ว ✓');renderPayroll();
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}

async function prMoveRoute(routeId,dir){
  // find the group this route belongs to (or standalone)
  let siblings;
  const grpId=Object.keys(S.groupMembers).find(gid=>S.groupMembers[gid].includes(routeId));
  if(grpId){
    siblings=(S.groupMembers[grpId]||[]).map(id=>S.shops.find(s=>s.id===id)).filter(Boolean).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  } else {
    const groupedIds=new Set(Object.values(S.groupMembers).flat());
    siblings=S.shops.filter(s=>!groupedIds.has(s.id)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  }
  const idx=siblings.findIndex(s=>s.id===routeId);
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=siblings.length)return;
  const a=siblings[idx],b=siblings[swapIdx];
  const tmpOrder=a.sort_order??idx;
  a.sort_order=b.sort_order??swapIdx;
  b.sort_order=tmpOrder;
  // ensure distinct values if both were 0
  if(a.sort_order===b.sort_order){a.sort_order=swapIdx;b.sort_order=idx;}
  try{
    await sbUpsert('routes',[{id:a.id,name:a.name,color:a.color,tab_flags:a.tab_flags,sort_order:a.sort_order},{id:b.id,name:b.name,color:b.color,tab_flags:b.tab_flags,sort_order:b.sort_order}]);
    renderPayroll();
  }catch(e){toast('เรียงไม่สำเร็จ: '+e.message);}
}
// ─── employee drag-to-reassign ───
let _dragEmpId=null,_dragGhost=null,_dragZone=null,_dragMoved=false,_dragStartX=0,_dragStartY=0,_dragSrc=null;

function _empTouchStart(e,empId){
  if(e.touches.length!==1)return;
  _dragEmpId=empId; _dragMoved=false; _dragGhost=null;
  _dragSrc=e.currentTarget;
  const t=e.touches[0];
  _dragStartX=t.clientX; _dragStartY=t.clientY;
  // ไม่ preventDefault → click ยังทำงานได้ตอน tap
}

function _empTouchMove(e){
  if(!_dragEmpId)return;
  const t=e.touches[0];
  const dx=t.clientX-_dragStartX, dy=t.clientY-_dragStartY;
  if(!_dragMoved&&Math.sqrt(dx*dx+dy*dy)<10)return;
  if(!_dragMoved){
    _dragMoved=true;
    if(_dragSrc){
      const rect=_dragSrc.getBoundingClientRect();
      _dragGhost=_dragSrc.cloneNode(true);
      Object.assign(_dragGhost.style,{
        position:'fixed',zIndex:'9999',pointerEvents:'none',
        width:rect.width+'px',opacity:'0.9',
        left:(t.clientX-rect.width/2)+'px',top:(t.clientY-50)+'px',
        transform:'scale(1.1)',boxShadow:'0 6px 20px #0009',
        background:'var(--bg3)',border:'2px solid var(--amber)',borderRadius:'8px'
      });
      document.body.appendChild(_dragGhost);
    }
  }
  if(!_dragGhost)return;
  const w=parseInt(_dragGhost.style.width);
  _dragGhost.style.left=(t.clientX-w/2)+'px';
  _dragGhost.style.top=(t.clientY-50)+'px';
  _dragGhost.style.display='none';
  const el=document.elementFromPoint(t.clientX,t.clientY);
  _dragGhost.style.display='';
  const zone=el?.closest('[data-drop-route]');
  if(_dragZone&&_dragZone!==zone)_dragZone.style.background='';
  _dragZone=zone||null;
  if(_dragZone)_dragZone.style.background='var(--amber)22';
  e.preventDefault(); // กัน scroll เฉพาะตอนลากจริงๆ
}

function _empDragCleanup(){
  if(_dragGhost){_dragGhost.remove();_dragGhost=null;}
  if(_dragZone){_dragZone.style.background='';_dragZone=null;}
  _dragEmpId=null;_dragMoved=false;_dragSrc=null;
}
let _dragOffX=0,_dragOffY=0;
function _empCreateGhost(x,y){
  if(!_dragSrc)return;
  const rect=_dragSrc.getBoundingClientRect();
  // offset = ตำแหน่งนิ้ว/เมาส์ภายใน chip ตอน touchstart/mousedown
  _dragOffX=x-rect.left;
  _dragOffY=y-rect.top;
  _dragGhost=_dragSrc.cloneNode(true);
  Object.assign(_dragGhost.style,{
    position:'fixed',zIndex:'9999',pointerEvents:'none',
    width:rect.width+'px',height:rect.height+'px',opacity:'0.9',
    left:(x-_dragOffX)+'px',top:(y-_dragOffY)+'px',
    transform:'scale(1.05)',boxShadow:'0 6px 20px #0009',
    background:'var(--bg3)',border:'2px solid var(--amber)',borderRadius:'8px'
  });
  document.body.appendChild(_dragGhost);
}
function _empUpdateZone(x,y){
  if(!_dragGhost)return;
  _dragGhost.style.display='none';
  const el=document.elementFromPoint(x,y);
  _dragGhost.style.display='';
  const zone=el?.closest('[data-drop-route]');
  if(_dragZone&&_dragZone!==zone)_dragZone.style.background='';
  _dragZone=zone||null;
  if(_dragZone)_dragZone.style.background='var(--amber)22';
}
async function _empDrop(empId,zone){
  if(!zone)return;
  const routeId=zone.dataset.dropRoute||null;
  const emp=PR.employees.find(x=>x.id===empId);
  if(emp&&emp.route_id!==(routeId||null)){
    toast('กำลังย้ายสาย...');
    await quickAssignRoute(empId,routeId);
    renderPayroll();
    toast('ย้ายสายสำเร็จ ✓');
  }
}

// touch
document.addEventListener('touchmove',e=>{
  if(!_dragEmpId)return;
  const t=e.touches[0];
  const dx=t.clientX-_dragStartX,dy=t.clientY-_dragStartY;
  if(!_dragMoved&&Math.sqrt(dx*dx+dy*dy)<10)return;
  if(!_dragMoved){_dragMoved=true;_empCreateGhost(t.clientX,t.clientY);}
  if(!_dragGhost)return;
  _dragGhost.style.left=(t.clientX-_dragOffX)+'px';
  _dragGhost.style.top=(t.clientY-_dragOffY)+'px';
  _empUpdateZone(t.clientX,t.clientY);
  e.preventDefault();
},{passive:false});
document.addEventListener('touchend',async e=>{
  if(!_dragEmpId)return;
  const empId=_dragEmpId,moved=_dragMoved,zone=_dragZone;
  _empDragCleanup();
  if(moved) await _empDrop(empId,zone);
});
document.addEventListener('touchcancel',_empDragCleanup);

// mouse (desktop)
function _empMouseStart(e,empId){
  if(e.button!==0)return;
  e.preventDefault();
  _dragEmpId=empId;_dragMoved=false;_dragGhost=null;
  _dragSrc=e.currentTarget;
  _dragStartX=e.clientX;_dragStartY=e.clientY;
}
document.addEventListener('mousemove',e=>{
  if(!_dragEmpId)return;
  const dx=e.clientX-_dragStartX,dy=e.clientY-_dragStartY;
  if(!_dragMoved&&Math.sqrt(dx*dx+dy*dy)<6)return;
  if(!_dragMoved){_dragMoved=true;_empCreateGhost(e.clientX,e.clientY);}
  if(!_dragGhost)return;
  _dragGhost.style.left=(e.clientX-_dragOffX)+'px';
  _dragGhost.style.top=(e.clientY-_dragOffY)+'px';
  _empUpdateZone(e.clientX,e.clientY);
});
document.addEventListener('mouseup',async e=>{
  if(!_dragEmpId)return;
  const empId=_dragEmpId,moved=_dragMoved,zone=_dragZone;
  _empDragCleanup();
  if(moved) await _empDrop(empId,zone);
  // !moved → click fires openEmpDetail เอง
});

async function saveEmployee(editId){
  const name=(document.getElementById('ae-name')?.value||'').trim();
  if(!name){toast('กรุณากรอกชื่อ');return;}
  const empId=editId||uid();
  const emp={
    id:empId,name,
    route_id:document.getElementById('ae-route')?.value||null,
    nationality:document.getElementById('ae-nat')?.value||'ไทย',
    notes:document.getElementById('ae-notes')?.value||null,
    tel:document.getElementById('ae-tel')?.value||null,
    permit_expiry:document.getElementById('ae-permit-expiry')?.value||null,
    visa_expiry:document.getElementById('ae-visa-expiry')?.value||null,
    passport_expiry:document.getElementById('ae-passport-expiry')?.value||null,
    status:'active'
  };
  // salary fields — admin เท่านั้น
  if(!isHR()){
    emp.daily_rate=parseFloat(document.getElementById('ae-rate')?.value)||0;
    emp.phone_fee=parseFloat(document.getElementById('ae-phone')?.value)||0;
    emp.room_fee=parseFloat(document.getElementById('ae-room')?.value)||0;
    emp.department=document.getElementById('ae-dept')?.value||null;
    emp.position=document.getElementById('ae-pos')?.value||null;
    emp.payment_type=document.getElementById('ae-paytype')?.value||'เงินสดW';
  } else {
    // HR: คงค่าเดิมไว้ถ้าแก้ไข หรือใส่ default ถ้าเพิ่มใหม่
    const existing=PR.employees.find(e=>e.id===empId);
    emp.daily_rate=existing?.daily_rate??360;
    emp.phone_fee=existing?.phone_fee??0;
    emp.room_fee=existing?.room_fee??0;
    emp.department=existing?.department||null;
    emp.position=existing?.position||null;
    emp.payment_type=existing?.payment_type||'เงินสดW';
    // HR กรอก start_date ได้ตอนเพิ่มใหม่เท่านั้น
    if(!editId){
      const sd=document.getElementById('ae-start')?.value;
      if(sd) emp.start_date=sd;
    } else {
      emp.start_date=existing?.start_date||null;
    }
  }
  try{
    await sbUpsert('employees',[emp]);
    // บันทึก salary แยก table (admin เท่านั้น)
    if(!isHR()){
      await sbUpsert('employees_salary',[{employee_id:empId,daily_rate:emp.daily_rate,payment_type:emp.payment_type,phone_fee:emp.phone_fee,room_fee:emp.room_fee}]);
    }
    if(editId){const i=PR.employees.findIndex(e=>e.id===editId);if(i>=0)PR.employees[i]={...PR.employees[i],...emp};}
    else PR.employees.push(emp);
    CM();toast(`บันทึก ${name} แล้ว ✓`);renderPayroll();
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}

async function _uploadToCloudinary(file, publicId){
  const fd=new FormData();
  fd.append('file',file);
  fd.append('upload_preset','ladda_employees');
  fd.append('public_id',publicId);
  const res=await fetch('https://api.cloudinary.com/v1_1/dai58zx93/image/upload',{method:'POST',body:fd});
  const data=await res.json();
  if(!data.secure_url) throw new Error('upload failed');
  return data.secure_url;
}

async function _allEmpField(empId,field,val){
  const emp=PR.employees.find(e=>e.id===empId);if(!emp)return;
  emp[field]=val;
  const salaryFields=['daily_rate','phone_fee','room_fee','payment_type'];
  const empOnlyFields=['department','position'];
  try{
    if(salaryFields.includes(field)){
      await sbUpsert('employees_salary',[{employee_id:empId,daily_rate:emp.daily_rate??360,phone_fee:emp.phone_fee??0,room_fee:emp.room_fee??0,payment_type:emp.payment_type||'เงินสดW'}]);
    } else {
      const{daily_rate,phone_fee,room_fee,payment_type,...empData}=emp;
      await sbUpsert('employees',[empData]);
    }
    toast('บันทึกแล้ว ✓');
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}

function openRouteVehicles(routeId){

function openAllVehicles(){
  _vehCtx=null;
  const grouped=groupedRouteIds();
  const byId=id=>S.shops.find(s=>s.id===id);
  let body='';
  // กลุ่ม → header กลุ่ม + สายย่อยแต่ละสาย (รถผูกกับสายย่อย ไม่กองรวมที่กลุ่ม)
  [...S.groups].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).forEach(g=>{
    const members=(S.groupMembers[g.id]||[]).map(byId).filter(Boolean);
    if(!members.length)return;
    body+=`<div style="font-size:13px;font-weight:700;color:var(--text2);margin:6px 0 8px;display:flex;align-items:center;gap:6px;">📁 ${g.name}</div>`;
    members.forEach(r=>body+=_vehSection({type:'route',id:r.id,name:r.name,color:r.color||'#22c55e'}));
  });
  // สายเดี่ยว (ไม่อยู่ในกลุ่ม)
  [...S.shops].filter(s=>!grouped.has(s.id)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))
    .forEach(r=>body+=_vehSection({type:'route',id:r.id,name:r.name,color:r.color||'#22c55e'}));
  // ออฟฟิศ
  body+=_vehSection({type:'office',id:'',name:'ออฟฟิศ',color:'#64748b'});
  const migrateBtn=isAdmin()?`<div style="margin-bottom:14px;text-align:right;"><button onclick="_migrateVehicles()" style="font-size:11px;padding:4px 10px;background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:6px;cursor:pointer;">📥 นำเข้าข้อมูลรถเดิม (1 สาย=1คัน)</button></div>`:'';
  OM('🚐 ประวัติรถทั้งหมด',
    `<div>${migrateBtn}${body}</div>`,
    `<button class="btn btn-x" onclick="CMask()">ปิด</button>`
  );
}
async function _vehField(id,field,val){
  const v=S.vehicles.find(x=>x.id===id);if(!v)return;
  let nv=(val||'').trim();
  if(['plate','chassis'].includes(field))nv=nv.toUpperCase();
  v[field]=nv||null;
  try{await sbUpsert('vehicles',[v]);toast('บันทึกแล้ว ✓');}
  catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}
async function _vehOilToday(id){
  const d=today();
  const input=document.querySelector(`input[data-vid="${id}"][data-f="oil_date"]`);
  if(input)input.value=d;
  await _vehField(id,'oil_date',d);
}
async function _vehAdd(ownerType,ownerId){
  const oid=ownerType==='office'?null:ownerId;
  const v={id:uid(),owner_type:ownerType,owner_id:oid,name:null,plate:null,chassis:null,
    insurance:null,ins_tel:null,ins_expiry:null,tax_expiry:null,prb_expiry:null,oil_date:null,
    sort_order:_vehFor(ownerType,oid===null?'':oid).length};
  try{await sbUpsert('vehicles',[v]);S.vehicles.push(v);_vehRerender();}
  catch(e){toast('เพิ่มไม่สำเร็จ: '+e.message);}
}
async function _vehDel(id){
  if(!confirm('ลบรถคันนี้?'))return;
  try{await sbDelete('vehicles',`id=eq.${id}`);S.vehicles=S.vehicles.filter(v=>v.id!==id);_vehRerender();}
  catch(e){toast('ลบไม่สำเร็จ: '+e.message);}
}
async function _migrateVehicles(){
  if(!isAdmin())return;
  if(!confirm('นำเข้าข้อมูลรถเดิม (1 สาย = 1 คัน) เข้าตารางใหม่? (ข้ามสายที่นำเข้าแล้ว)'))return;
  try{
    const routes=await sbGet('routes','select=id,name,vehicle');
    let n=0;
    for(const r of routes){
      const veh=r.vehicle;
      if(!veh||typeof veh!=='object')continue;
      if(!(veh.plate||veh.chassis||veh.insurance||veh.ins_tel||veh.ins_expiry||veh.tax_expiry||veh.prb_expiry||veh.oil_date))continue;
      if(S.vehicles.some(v=>v.owner_type==='route'&&v.owner_id===r.id))continue;
      const v={id:uid(),owner_type:'route',owner_id:r.id,name:r.name,
        plate:veh.plate||null,chassis:veh.chassis||null,insurance:veh.insurance||null,ins_tel:veh.ins_tel||null,
        ins_expiry:veh.ins_expiry||null,tax_expiry:veh.tax_expiry||null,prb_expiry:veh.prb_expiry||null,
        oil_date:veh.oil_date||null,sort_order:0};
      await sbUpsert('vehicles',[v]);S.vehicles.push(v);n++;
    }
    toast(`นำเข้า ${n} คัน ✓`);openAllVehicles();
  }catch(e){toast('นำเข้าไม่สำเร็จ: '+e.message);}
}

        <button class="btn btn-x" onclick="CM();setTimeout(()=>openEmpDetail('${empId}'),50)">ยกเลิก</button>
        <button class="btn btn-g" onclick="saveLoan('${empId}')">บันทึก</button>
      </div>`
    );
  },50);
}

async function saveLoan(empId){
  const total=parseFloat(document.getElementById('al-total')?.value)||0;
  const per=parseFloat(document.getElementById('al-per')?.value)||0;
  if(!total||!per){toast('กรุณากรอกยอดรวมและงวดละ');return;}
  const loan={id:uid(),employee_id:empId,type:document.getElementById('al-type')?.value,description:document.getElementById('al-desc')?.value||null,total_amount:total,per_period_amount:per,paid_amount:parseFloat(document.getElementById('al-paid')?.value)||0,interest_rate:0,status:'active'};
  if(loan.paid_amount>=loan.total_amount)loan.status='completed';
  try{await sbUpsert('employee_loans',[loan]);PR.loans.push(loan);CM();toast('บันทึกแล้ว ✓');setTimeout(()=>openEmpDetail(empId),50);}
  catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}

function openEditLoan(loanId,empId){
  const l=PR.loans.find(x=>x.id===loanId);if(!l)return;
  CM();
  setTimeout(()=>{
    OM('แก้ไขรายการค้าง',
      `<div style="display:grid;gap:10px;">
        <div style="font-size:14px;font-weight:500;color:var(--text);">${l.description||l.type}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">ยอดรวม</div>
            <input id="el-total" type="number" value="${l.total_amount}" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--mono);"></div>
          <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">หักงวดละ</div>
            <input id="el-per" type="number" value="${l.per_period_amount}" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--mono);"></div>
        </div>
        <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">ชำระไปแล้ว</div>
          <input id="el-paid" type="number" value="${l.paid_amount}" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--mono);"></div>
      </div>`,
      `<div style="display:flex;gap:8px;">
        <button class="btn btn-x" onclick="CM();setTimeout(()=>openEmpDetail('${empId}'),50)">ยกเลิก</button>
        <button class="btn btn-g" onclick="saveEditLoan('${loanId}','${empId}')">บันทึก</button>
      </div>`
    );
  },50);
}

async function saveEditLoan(loanId,empId){
  const l=PR.loans.find(x=>x.id===loanId);if(!l)return;
  l.total_amount=parseFloat(document.getElementById('el-total')?.value)||0;
  l.per_period_amount=parseFloat(document.getElementById('el-per')?.value)||0;
  l.paid_amount=parseFloat(document.getElementById('el-paid')?.value)||0;
  if(l.paid_amount>=l.total_amount)l.status='completed';
  try{await sbUpsert('employee_loans',[l]);CM();toast('บันทึกแล้ว ✓');setTimeout(()=>openEmpDetail(empId),50);}
  catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}

authInit();
</script>
</body>
</html>
