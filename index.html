<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>น้องลัดดา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;
  --border:#2a3348;--border2:#3a4560;
  --text:#e8edf5;--text2:#8a95ab;--text3:#5a6478;
  --green:#22c55e;--gdim:#0f3d20;--gbr:#1a6635;
  --blue:#3b82f6;--bdim:#0d2456;--bbr:#1e3a8a;
  --amber:#f59e0b;--adim:#3d2700;--abr:#92400e;
  --red:#ef4444;--rdim:#3d0d0d;--rbr:#7f1d1d;
  --purple:#a855f7;--pdim:#2d1b4e;--pbr:#6b21a8;
  --font:'Sarabun',sans-serif;--mono:'IBM Plex Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
#app{display:flex;flex-direction:column;min-height:100vh;}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.logo{font-size:18px;font-weight:700;color:var(--green);}
.total-badge{background:var(--gdim);border:1px solid var(--gbr);color:var(--green);padding:6px 14px;border-radius:8px;font-family:var(--mono);}
.total-badge span{font-size:11px;color:var(--text2);display:block;line-height:1;}
.tabs-bar{display:flex;gap:4px;padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;}
.tab-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:var(--font);font-size:13px;white-space:nowrap;}
.tab-btn.active{background:var(--bdim);border-color:var(--bbr);color:var(--blue);}
main{display:flex;flex:1;overflow:hidden;}
.sidebar{width:200px;background:var(--bg2);border-right:1px solid var(--border);padding:12px 0;flex-shrink:0;overflow-y:auto;}
.si{display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;border-left:3px solid transparent;}
.si:hover{background:var(--bg3);}
.si.active{background:var(--bg3);border-left-color:var(--green);}
.si.active .sn{color:var(--green);}
.sn{font-size:13px;font-weight:500;flex:1;}
.sa{font-size:11px;font-family:var(--mono);color:var(--text2);}
.ssec{padding:8px 16px 4px;font-size:11px;color:var(--text3);letter-spacing:1px;}
.sadd{margin:8px 12px;padding:8px;border:1px dashed var(--border2);border-radius:6px;background:transparent;color:var(--text3);font-family:var(--font);font-size:12px;cursor:pointer;width:calc(100% - 24px);}
.sadd:hover{border-color:var(--gbr);color:var(--green);}
.content{flex:1;overflow-y:auto;padding:20px;}
/* summary */
.mhdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.mtitle{font-size:18px;font-weight:600;}
.mperiod{font-size:12px;color:var(--text3);margin-top:2px;}
.abtns{display:flex;gap:6px;flex-wrap:wrap;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;}
.sc .lb{font-size:11px;color:var(--text2);margin-bottom:4px;}
.sc .vl{font-size:16px;font-family:var(--mono);font-weight:500;}
/* buttons */
.btn{padding:8px 16px;border-radius:7px;border:1px solid;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:500;}
.btn:hover{filter:brightness(1.15);}
.btn:active{transform:scale(.97);}
.btn-g{background:var(--gdim);border-color:var(--gbr);color:var(--green);}
.btn-b{background:var(--bdim);border-color:var(--bbr);color:var(--blue);}
.btn-a{background:var(--adim);border-color:var(--abr);color:var(--amber);}
.btn-p{background:var(--pdim);border-color:var(--pbr);color:var(--purple);}
.btn-x{background:var(--bg3);border-color:var(--border2);color:var(--text2);}
.btn-sm{padding:5px 10px;font-size:12px;}
/* cumulative bills */
.cumul{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:16px;}
.cumul .clb{font-size:11px;color:var(--text3);margin-bottom:6px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
/* pills */
.pill{display:inline-block;padding:2px 7px;border-radius:4px;font-size:12px;font-family:var(--mono);}
.p1000{background:#1a2a1a;color:#6ee7b7;}
.p500{background:#1a1a2a;color:#93c5fd;}
.p100{background:#2a1a0a;color:#fcd34d;}
.p50{background:#2a0a1a;color:#f9a8d4;}
.p20{background:#0a1a2a;color:#67e8f9;}
.pcoin{background:#2a1a00;color:#fb923c;}
/* open session */
.sess{border:1px solid var(--gbr);border-radius:10px;margin-bottom:14px;overflow:hidden;}
.sess-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--gdim);gap:8px;flex-wrap:wrap;}
.sess-title{font-size:13px;color:var(--green);font-weight:600;}
.sess-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.sess-btns{display:flex;gap:6px;}
.sub-row{padding:10px 14px;border-top:1px solid var(--border);}
.sub-rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.sub-rl{font-size:12px;color:var(--text2);font-weight:500;}
.sub-ra{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--green);}
/* entry cards */
.ecard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.ehd{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--bg3);cursor:pointer;user-select:none;}
.badge{font-size:11px;padding:3px 8px;border-radius:5px;font-weight:500;flex-shrink:0;border:1px solid;}
.bcount{background:var(--gdim);border-color:var(--gbr);color:var(--green);}
.binc{background:var(--bdim);border-color:var(--bbr);color:var(--blue);}
.bexp{background:var(--adim);border-color:var(--abr);color:var(--amber);}
.bexin{background:var(--pdim);border-color:var(--pbr);color:var(--purple);}
.bexout{background:var(--pdim);border-color:var(--pbr);color:var(--purple);}
.edt{font-size:12px;color:var(--text3);flex-shrink:0;}
.ett{flex:1;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.eam{font-family:var(--mono);font-size:15px;font-weight:500;flex-shrink:0;}
.pos{color:var(--green);}
.neg{color:var(--red);}
.neu{color:var(--text2);}
.ebody{padding:14px;display:none;}
.ebody.open{display:block;}
.delbtn{background:var(--rdim);border:1px solid var(--rbr);color:var(--red);border-radius:5px;padding:2px 8px;font-size:11px;cursor:pointer;flex-shrink:0;}
/* bill table */
.btbl{width:100%;border-collapse:collapse;font-size:13px;}
.btbl th{text-align:left;color:var(--text2);padding:5px 8px;border-bottom:1px solid var(--border);font-weight:500;}
.btbl td{padding:5px 8px;border-bottom:1px solid var(--border);}
.btbl .nr{text-align:right;font-family:var(--mono);}
.btbl tfoot td{font-weight:600;color:var(--green);border-top:2px solid var(--border2);}
.sumbox{background:var(--bg);border:1px solid var(--gbr);border-radius:8px;padding:12px 14px;margin-top:10px;}
.sumbox-t{font-size:12px;color:var(--green);font-weight:600;margin-bottom:8px;}
.notetxt{font-size:12px;color:var(--text2);margin-top:8px;padding:7px 10px;background:var(--bg);border-radius:6px;border-left:2px solid var(--border2);}
.slbl{font-size:11px;color:var(--text3);letter-spacing:1px;margin:14px 0 8px;}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:10;}
.mhd h2{font-size:16px;font-weight:600;}
.mclose{background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:20px;padding:2px 8px;}
.mclose:hover{color:var(--text);}
.mbody{padding:20px;}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--border);}
.fg{margin-bottom:14px;}
.flbl{display:block;font-size:13px;color:var(--text2);margin-bottom:5px;}
.finp{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:14px;}
.finp:focus{outline:none;border-color:var(--bbr);}
.fsel{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:14px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.bcell{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.bcell label{display:block;margin-bottom:4px;}
.bcell input{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:16px;font-weight:500;}
.bcell input:focus{outline:none;}
.bsub{font-size:11px;color:var(--text3);margin-top:3px;font-family:var(--mono);}
.tbar{background:var(--bg);border:1px solid var(--gbr);border-radius:8px;padding:10px 14px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;}
.tbar .tl{font-size:13px;color:var(--text2);}
.tbar .tv{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--green);}
/* exchange two-column layout */
.exch-cols{display:grid;grid-template-columns:1fr 40px 1fr;gap:0;align-items:start;}
.exch-col{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.exch-col-hd{padding:10px 12px;font-size:13px;font-weight:600;}
.exch-col-body{padding:12px;}
.exch-mid{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--purple);padding-top:40px;}
.exch-sel-bar{display:flex;gap:8px;margin-bottom:10px;}
.exch-sel-bar select{flex:1;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:13px;}
.tbar-sm{background:var(--bg);border:1px solid var(--gbr);border-radius:7px;padding:8px 12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;}
.tbar-sm .tl{font-size:12px;color:var(--text2);}
.tbar-sm .tv{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--green);}
.bgrid2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
/* exchange single-column grid — rows align across left/right columns */
.bgrid-ex{display:grid;grid-template-columns:1fr;gap:0;}
.bgrid-ex .bcell{border-radius:0;border-left:none;border-right:none;border-top:none;border-bottom:1px solid var(--border);background:transparent;padding:10px 12px;}
.bgrid-ex .bcell:first-child{border-top:1px solid var(--border);}
.bgrid-ex .bcell label{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.bgrid-ex .bcell input{font-size:20px;width:100%;}
.bgrid-ex .bsub{font-size:13px;color:var(--text3);margin-top:2px;}
.exch-col-body{padding:0;}
/* make both columns same height rows by using CSS grid on the outer cols */
.exch-cols{display:grid;grid-template-columns:1fr 36px 1fr;gap:0;align-items:start;}
.exch-rows{display:grid;grid-template-columns:1fr 36px 1fr;gap:0;}
.exch-row-mid{display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--border);}
.empty{text-align:center;padding:48px 20px;color:var(--text3);}
.empty .ei{font-size:36px;margin-bottom:8px;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:10px 16px;font-size:13px;z-index:9999;animation:si .2s ease;color:var(--text);max-width:280px;}
@keyframes si{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:360px;padding:32px 28px;}
.login-logo{font-size:28px;font-weight:700;color:var(--green);text-align:center;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text3);text-align:center;margin-bottom:28px;}
.login-pin{display:flex;gap:10px;justify-content:center;margin:16px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:.15s;}
.pin-dot.filled{background:var(--green);border-color:var(--green);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
.np-btn{padding:16px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:18px;font-weight:500;cursor:pointer;font-family:var(--mono);transition:.1s;}
.np-btn:hover{background:var(--border);border-color:var(--border2);}
.np-btn:active{transform:scale(.94);}
.np-btn.del{font-size:15px;color:var(--text2);}
.np-btn.zero{grid-column:2;}
.login-err{text-align:center;font-size:13px;color:var(--red);min-height:20px;margin-top:10px;}
.login-role-label{text-align:center;font-size:12px;color:var(--text3);margin-bottom:16px;}
/* role badge in header */
.role-badge{font-size:11px;padding:3px 8px;border-radius:5px;border:1px solid;cursor:pointer;}
.role-admin{background:var(--adim);border-color:var(--abr);color:var(--amber);}
.role-user{background:var(--bdim);border-color:var(--bbr);color:var(--blue);}
/* shop manage buttons */
.shop-actions{display:flex;gap:4px;margin-left:auto;}
/* group in sidebar */
.grp-box{margin:6px 8px;border:1px solid var(--border2);border-radius:8px;overflow:hidden;}
.grp-hd{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer;background:var(--bg3);border-left:3px solid transparent;}
.grp-hd:hover{filter:brightness(1.1);}
.grp-hd.active{border-left-color:var(--green);}
.grp-hd.active .grp-name{color:var(--green);}
.grp-name{font-size:12px;font-weight:600;flex:1;}
.grp-amt{font-size:11px;font-family:var(--mono);color:var(--text2);}
.grp-members{background:var(--bg2);}
.grp-member{display:flex;align-items:center;gap:6px;padding:7px 10px 7px 20px;cursor:pointer;border-left:3px solid transparent;font-size:12px;}
.grp-member:hover{background:var(--bg3);}
.grp-member.active{background:var(--bg3);border-left-color:var(--green);color:var(--green);}
.grp-member .sn{flex:1;font-size:12px;}
.grp-member .sa{font-size:11px;font-family:var(--mono);color:var(--text2);}
/* ungrouped section */
.ssec-ungrouped{padding:8px 16px 4px;font-size:11px;color:var(--text3);letter-spacing:1px;margin-top:4px;}
/* group summary content */
.grp-summary-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.grp-route-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.grp-route-card-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg3);cursor:pointer;}
.grp-route-card-body{padding:14px;display:none;}
.grp-route-card-body.open{display:block;}
/* tab_flags toggle */
.tf-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.tf-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:12px;cursor:pointer;user-select:none;transition:.15s;}
.tf-chip.on{background:var(--bdim);border-color:var(--bbr);color:var(--blue);}
/* Round label */
.round-sep{display:flex;align-items:center;gap:8px;margin:16px 0 10px;color:var(--text3);font-size:12px;}
.round-sep::before,.round-sep::after{content:'';flex:1;height:1px;background:var(--border);}
@media(max-width:800px){
  .sidebar{width:100%;display:flex;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:0;}
  main{flex-direction:column;}
  .si{flex-direction:column;min-width:66px;padding:8px 4px;border-left:none;border-bottom:3px solid transparent;}
  .si.active{border-bottom-color:var(--green);border-left-color:transparent;}
  .sn{font-size:10px;margin-top:2px;text-align:center;} .sa{font-size:9px;} .ssec,.sadd{display:none;}
  .grid4{grid-template-columns:1fr 1fr;}
  .bgrid{grid-template-columns:repeat(2,1fr);}
  .frow{grid-template-columns:1fr;}
  .exch-cols{grid-template-columns:1fr;gap:8px;}
  .exch-mid{padding-top:0;font-size:18px;}
}
</style>
</head>
<body>
<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">💰 น้องลัดดา</div>
    <div class="login-sub">ระบบนับเงิน Multi-Route</div>
    <div class="login-role-label" id="login-role-label">กรอก PIN เพื่อเข้าสู่ระบบ</div>
    <div class="login-pin" id="login-pin">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div class="numpad">
      <button class="np-btn" onclick="pinPress('1')">1</button>
      <button class="np-btn" onclick="pinPress('2')">2</button>
      <button class="np-btn" onclick="pinPress('3')">3</button>
      <button class="np-btn" onclick="pinPress('4')">4</button>
      <button class="np-btn" onclick="pinPress('5')">5</button>
      <button class="np-btn" onclick="pinPress('6')">6</button>
      <button class="np-btn" onclick="pinPress('7')">7</button>
      <button class="np-btn" onclick="pinPress('8')">8</button>
      <button class="np-btn" onclick="pinPress('9')">9</button>
      <button class="np-btn zero" onclick="pinPress('0')">0</button>
      <button class="np-btn del" onclick="pinDel()">⌫</button>
    </div>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="logo">💰 น้องลัดดา</div>
      <div id="cur-shop" style="font-size:13px;color:var(--text2);"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="total-badge"><span>ยอดรวมทั้งหมด</span><div id="gtotal">฿0</div></div>
      <button id="role-btn" class="role-badge" onclick="logout()" title="คลิกเพื่อออกจากระบบ"></button>
    </div>
  </header>
  <div class="tabs-bar" id="tabs-bar"></div>
  <main>
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"><div class="empty"><div class="ei">🏪</div><p>เลือกสายด้านซ้าย</p></div></div>
  </main>
</div>

<div class="overlay" id="overlay" style="display:none;">
  <div class="modal">
    <div class="mhd"><h2 id="mtitle">-</h2><button class="mclose" onclick="CM()">✕</button></div>
    <div class="mbody" id="mbody"></div>
    <div class="mfoot" id="mfoot"></div>
  </div>
</div>

<script>
// ─── AUTH ───
const PIN_USER='1111', PIN_ADMIN='0000';
let AUTH={role:null}; // role: 'user' | 'admin'

function authInit(){
  const saved=localStorage.getItem('ladda_role');
  if(saved==='user'||saved==='admin'){
    AUTH.role=saved;
    showApp();
  }
  // else login screen stays visible
}

let _pin='';
function pinPress(d){
  if(_pin.length>=4)return;
  _pin+=d;
  updatePinDots();
  if(_pin.length===4)setTimeout(pinCheck,120);
}
function pinDel(){_pin=_pin.slice(0,-1);updatePinDots();document.getElementById('login-err').textContent='';}
function updatePinDots(){
  for(let i=0;i<4;i++){
    const el=document.getElementById('pd'+i);
    if(el)el.classList.toggle('filled',i<_pin.length);
  }
}
function pinCheck(){
  if(_pin===PIN_ADMIN){
    AUTH.role='admin';localStorage.setItem('ladda_role','admin');showApp();
  } else if(_pin===PIN_USER){
    AUTH.role='user';localStorage.setItem('ladda_role','user');showApp();
  } else {
    document.getElementById('login-err').textContent='PIN ไม่ถูกต้อง ลองใหม่อีกครั้ง';
    _pin='';updatePinDots();
  }
}
function showApp(){
  document.getElementById('login-screen').style.display='none';
  const btn=document.getElementById('role-btn');
  if(AUTH.role==='admin'){
    btn.textContent='👑 ผู้ดูแล';btn.className='role-badge role-admin';
  } else {
    btn.textContent='👤 ผู้ใช้งาน';btn.className='role-badge role-user';
  }
  btn.title='คลิกเพื่อออกจากระบบ';
  loadAll();
}
function logout(){
  if(!confirm('ออกจากระบบ?'))return;
  localStorage.removeItem('ladda_role');
  AUTH.role=null;_pin='';updatePinDots();
  document.getElementById('login-err').textContent='';
  document.getElementById('login-screen').style.display='flex';
}
function isAdmin(){return AUTH.role==='admin';}

// ─── constants ───
const BT=[1000,500,100,50,20,'coin'];
const BL={1000:'1,000',500:'500',100:'100',50:'50',20:'20',coin:'เหรียญ'};
const BC={1000:'p1000',500:'p500',100:'p100',50:'p50',20:'p20',coin:'pcoin'};
const eb=()=>({1000:0,500:0,100:0,50:0,20:0,coin:0});
const bv=b=>BT.reduce((s,t)=>s+(t==='coin'?1:t)*(b[t]||0),0);
const mkKey=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
const monthLbl=k=>{const[y,m]=k.split('-').map(Number);return['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][m-1]+' '+(y+543);};
const periodLbl=k=>{const[y,m]=k.split('-').map(Number);const nm=m===12?1:m+1,ny=m===12?y+1:y;return`11 ${monthLbl(k)} – 10 ${monthLbl(mkKey(ny,nm))}`;};
function cpk(){const n=new Date(),d=n.getDate(),m=n.getMonth()+1,y=n.getFullYear();return d>=11?mkKey(y,m):(m===1?mkKey(y-1,12):mkKey(y,m-1));}
const fmt=n=>'฿'+(Math.round(n)).toLocaleString('th-TH');
const fN=n=>(Math.round(n)).toLocaleString('th-TH');
const uid=()=>'e'+Date.now()+Math.floor(Math.random()*999);
const today=()=>new Date().toISOString().split('T')[0];

async function sbGet(table,params=''){
  const r=await fetch(`${SB_URL}/rest/v1/${table}?${params}`,{headers:sbH});
  if(!r.ok)throw new Error(`sbGet ${table}: ${r.status}`);
  return r.json();

async function sbUpsert(table,data,opts=''){
  const r=await fetch(`${SB_URL}/rest/v1/${table}?${opts}`,{method:'POST',headers:{...sbH,'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(data)});
  if(!r.ok){const t=await r.text();throw new Error(`sbUpsert ${table}: ${r.status} ${t}`);}
}
async function sbDelete(table,params){
  const r=await fetch(`${SB_URL}/rest/v1/${table}?${params}`,{method:'DELETE',headers:sbH});
  if(!r.ok)throw new Error(`sbDelete ${table}: ${r.status}`);
}

function entryToRow(e,route_id,month_key){
  return{id:e.id,route_id,month_key,type:e.type,title:e.title||null,note:e.note||null,
    date_from:e.df||null,date_to:e.dt||null,amount:e.amount??null,total:e.total??null,
    bills:e.bills??null,subs:e.subs??null,other_route_id:e.oid??null};
}
function rowToEntry(r){
  return{id:r.id,type:r.type,title:r.title,note:r.note,df:r.date_from,dt:r.date_to,
    amount:r.amount,total:r.total,bills:r.bills,subs:r.subs,oid:r.other_route_id};
}

let S={
  shops:[],
  groups:[],       // [{id,name,sort_order,tab_flags}]
  groupMembers:{}, // {groupId:[routeId,...]}
  entries:{},   // entries[sid][monthKey] = [{...}]
  sessions:{},  // sessions[sid][monthKey] = {subs:[...]} | null
  shop:null,
  view:{type:'shop',id:null}, // type: 'shop'|'group'

// ─── load all from Supabase ───
async function loadAll(){
  document.getElementById('content').innerHTML='<div class="empty"><div class="ei">⏳</div><p>กำลังโหลดข้อมูล...</p></div>';
  try{
    const [routes,entries,sessions,groups,gMembers]=await Promise.all([
      sbGet('routes','order=sort_order.asc,created_at.asc'),
      sbGet('entries','order=created_at.asc'),
      sbGet('sessions','order=created_at.asc'),
      sbGet('groups','order=sort_order.asc,id.asc'),
      sbGet('group_members','order=sort_order.asc'),
    ]);
    S.shops=routes.map(r=>({id:r.id,name:r.name,color:r.color,tab_flags:r.tab_flags||{count:true,income:true,expense:true,exchange:true},sort_order:r.sort_order||0}));
    S.groups=groups.map(g=>({id:g.id,name:g.name,sort_order:g.sort_order||0,tab_flags:g.tab_flags||{count:true,income:true,expense:true,exchange:true}}));
    S.groupMembers={};
    gMembers.forEach(m=>{if(!S.groupMembers[m.group_id])S.groupMembers[m.group_id]=[];S.groupMembers[m.group_id].push(m.route_id);});
    S.entries={};
    entries.forEach(r=>{
      if(!S.entries[r.route_id])S.entries[r.route_id]={};
      if(!S.entries[r.route_id][r.month_key])S.entries[r.route_id][r.month_key]=[];
      S.entries[r.route_id][r.month_key].push(rowToEntry(r));
    });
    S.sessions={};
    sessions.forEach(r=>{
      if(!S.sessions[r.route_id])S.sessions[r.route_id]={};
      S.sessions[r.route_id][r.month_key]={subs:r.subs||[]};
    });
    // set initial view
    if(!S.view.id){
      if(S.groups.length>0){S.view={type:'group',id:S.groups[0].id};}
      else if(S.shops.length>0){S.view={type:'shop',id:S.shops[0].id};S.shop=S.shops[0].id;}
    }
    if(S.view.type==='shop')S.shop=S.view.id;
    render();
  }catch(err){
    document.getElementById('content').innerHTML=`<div class="empty"><div class="ei">❌</div><p>โหลดข้อมูลไม่สำเร็จ<br><small style="color:var(--text3)">${err.message}</small></p></div>`;
    console.error(err);
  }
}


function ge(sid,mk){if(!S.entries[sid])S.entries[sid]={};if(!S.entries[sid][mk])S.entries[sid][mk]=[];return S.entries[sid][mk];}
function gs(sid,mk){return(S.sessions[sid]||{})[mk]||null;}
function ss(sid,mk,v){if(!S.sessions[sid])S.sessions[sid]={};S.sessions[sid][mk]=v;}
function cs(sid,mk){if(S.sessions[sid])delete S.sessions[sid][mk];}

function shopTot(sid){
  let t=0;
  Object.values(S.entries[sid]||{}).forEach(list=>list.forEach(e=>{
    if(e.type==='count')t+=e.total||0;
    else if(e.type==='income'||e.type==='exin')t+=e.amount||0;
    else if(e.type==='expense'||e.type==='exout')t-=e.amount||0;
  }));
  // open sessions
  Object.values(S.sessions[sid]||{}).forEach(sess=>{if(sess)sess.subs.forEach(sub=>t+=bv(sub.bills||eb()));});
  return t;
}
function grandTot(){return S.shops.reduce((s,sh)=>s+shopTot(sh.id),0);}

// helper: รายชื่อ routeId ที่อยู่ในกลุ่มใดกลุ่มหนึ่ง
function groupedRouteIds(){const s=new Set();Object.values(S.groupMembers).forEach(ids=>ids.forEach(id=>s.add(id)));return s;}
// helper: ยอดรวมกลุ่ม
function groupTot(gid){return(S.groupMembers[gid]||[]).reduce((s,id)=>s+shopTot(id),0);}
// helper: tab_flags ของ view ปัจจุบัน
function curTabFlags(){
  if(S.view.type==='group'){const g=S.groups.find(x=>x.id===S.view.id);return g?.tab_flags||{count:true,income:true,expense:true,exchange:true};}
  const sh=S.shops.find(x=>x.id===S.view.id);return sh?.tab_flags||{count:true,income:true,expense:true,exchange:true};
}

function renderTabs(){
  const bar=document.getElementById('tabs-bar');
  const cp=cpk();
  const cyear=Number(cp.split('-')[0]);

  // รวบรวม month keys ที่มีข้อมูล + เดือนปัจจุบัน
  const mkSet=new Set([cp]);
  Object.values(S.entries).forEach(byMonth=>{
    Object.keys(byMonth).forEach(mk=>{
      if((byMonth[mk]||[]).length>0)mkSet.add(mk);
    });
  });
  Object.values(S.sessions).forEach(byMonth=>{
    Object.keys(byMonth).forEach(mk=>{if(byMonth[mk])mkSet.add(mk);});
  });

  // จัดกลุ่มตามปี
  const byYear={};
  mkSet.forEach(mk=>{
    const y=mk.split('-')[0];
    if(!byYear[y])byYear[y]=[];
    byYear[y].push(mk);
  });
  const years=Object.keys(byYear).sort();

  // ถ้า S.year ไม่ถูก set หรือปีที่เลือกไม่มีข้อมูล ใช้ปีของเดือนปัจจุบัน
  if(!S.year||!byYear[S.year])S.year=String(cyear);

  const monthsInYear=(byYear[S.year]||[]).slice().sort();
  // ถ้าเดือนที่เลือกอยู่ไม่ตรงปี ให้ reset เป็นเดือนล่าสุดในปีนั้น
  if(S.month.split('-')[0]!==S.year){
    S.month=monthsInYear[monthsInYear.length-1]||cp;
  }

  let html='';
  // ชั้น 1: tab ปี
  html+=`<div style="display:flex;gap:4px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border);">`;
  years.forEach(y=>{
    html+=`<button class="tab-btn${y===S.year?' active':''}" onclick="setYear('${y}')">${Number(y)+543}</button>`;
  });
  html+=`</div>`;
  // ชั้น 2: tab เดือนในปีนั้น
  html+=`<div style="display:flex;gap:4px;flex-wrap:wrap;">`;
  monthsInYear.forEach(mk=>{
    const[,m]=mk.split('-');
    const mname=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][Number(m)-1];
    html+=`<button class="tab-btn${mk===S.month?' active':''}" onclick="setMonth('${mk}')">${mname}</button>`;
  });
  html+=`</div>`;

  bar.innerHTML=html;
}

function renderContent(){
  if(S.view.type==='group') return renderGroupContent();
  renderShopContent();
}

// ── หน้าสาย (เดิม) ──
function renderShopContent(){
  const sid=S.view.id;
  const shop=S.shops.find(s=>s.id===sid);
  if(!shop){document.getElementById('content').innerHTML='<div class="empty"><p>เลือกร้านค้า</p></div>';return;}
  S.shop=sid;
  const tf=curTabFlags();
  const entries=ge(sid,S.month);
  const sess=gs(sid,S.month);
  let tCount=0,tIncome=0,tExpense=0;
  entries.forEach(e=>{
    if(e.type==='count')tCount+=e.total||0;
    else if(e.type==='income'||e.type==='exin')tIncome+=e.amount||0;
    else if(e.type==='expense'||e.type==='exout')tExpense+=e.amount||0;
  });
  if(sess)sess.subs.forEach(s=>tCount+=bv(s.bills||eb()));
  const net=tCount+tIncome-tExpense;
  const cb=eb();
  entries.forEach(e=>{
    if(e.type==='count')(e.subs||[]).forEach(s=>BT.forEach(t=>cb[t]+=(s.bills[t]||0)));
    else if(e.type==='income'||e.type==='exin'){if(e.bills)BT.forEach(t=>cb[t]+=(e.bills[t]||0));}
    else if(e.type==='expense'||e.type==='exout'){if(e.bills)BT.forEach(t=>cb[t]-=(e.bills[t]||0));}
  });
  if(sess)sess.subs.forEach(s=>BT.forEach(t=>cb[t]+=(s.bills[t]||0)));
  const hasBills=BT.some(t=>cb[t]!==0);
  let h=`<div class="mhdr">
    <div><div class="mtitle">${shop.name} — ${monthLbl(S.month)}</div><div class="mperiod">${periodLbl(S.month)}</div></div>
    <div class="abtns">
      ${tf.count?`<button class="btn btn-g" onclick="openCount()">+ นับเงิน</button>`:''}
      ${tf.income?`<button class="btn btn-b" onclick="openIncome()">+ รายรับ</button>`:''}
      ${tf.expense?`<button class="btn btn-a" onclick="openExpense()">+ รายจ่าย</button>`:''}
      ${tf.exchange?`<button class="btn btn-p" onclick="openExchange()">⇄ แลกระหว่างสาย</button>`:''}
    </div>
  </div>
  <div class="grid4">
    <div class="sc"><div class="lb">ยอดนับได้</div><div class="vl pos">${fmt(tCount)}</div></div>
    <div class="sc"><div class="lb">รายรับ</div><div class="vl" style="color:var(--blue)">${fmt(tIncome)}</div></div>
    <div class="sc"><div class="lb">รายจ่าย</div><div class="vl" style="color:var(--amber)">${fmt(tExpense)}</div></div>
    <div class="sc"><div class="lb">ยอดสุทธิ</div><div class="vl ${net>=0?'pos':'neg'}">${fmt(net)}</div></div>
  </div>`;
  if(hasBills){
    h+=`<div class="cumul"><div class="clb">แบงค์คงเหลือในกล่อง (สะสมทั้งเดือน)</div><div class="chips">`+
      BT.filter(t=>cb[t]!==0).map(t=>{const neg=cb[t]<0;return`<span class="pill ${BC[t]}" style="${neg?'outline:1px solid var(--red);opacity:.8;':''}">฿${BL[t]} × ${neg?'<span style="color:var(--red)">':''}${fN(cb[t])}${neg?'</span>':''}</span>`;}).join('')+
    `</div></div>`;
  }
  if(sess){
    const sessTotal=sess.subs.reduce((s,e)=>s+bv(e.bills||eb()),0);
    const n=sess.subs.length;
    h+=`<div class="sess"><div class="sess-hd"><div>
      <div class="sess-title">📋 รอบนับเงิน — กำลังดำเนินการ</div>
      <div class="sess-sub">${n} ครั้ง · สะสม ${fmt(sessTotal)}</div>
    </div><div class="sess-btns">
      <button class="btn btn-g btn-sm" onclick="addSubCount()">+ เพิ่มครั้ง</button>
      <button class="btn btn-b btn-sm" onclick="summarize()">✓ สรุปรอบนี้</button>
      <button class="btn btn-x btn-sm" onclick="cancelSess()">ยกเลิก</button>
    </div></div>`;
    sess.subs.forEach((s,i)=>{
      const a=bv(s.bills||eb());
      const chips=BT.filter(t=>s.bills[t]>0).map(t=>`<span class="pill ${BC[t]}">฿${BL[t]}×${fN(s.bills[t])}</span>`).join(' ');
      h+=`<div class="sub-row"><div class="sub-rh"><span class="sub-rl">ครั้งที่ ${i+1} &nbsp;·&nbsp; ${s.df}${s.dt&&s.dt!==s.df?' – '+s.dt:''}</span><span class="sub-ra">${fmt(a)}</span></div><div class="chips">${chips||'<span style="font-size:12px;color:var(--text3)">ไม่มีแบงค์</span>'}</div></div>`;
    });
    h+=`</div>`;
  }
  if(entries.length===0&&!sess)h+=`<div class="empty"><div class="ei">📋</div><p>ยังไม่มีรายการ</p></div>`;
  else if(entries.length>0){h+=`<div class="slbl">รายการที่บันทึกแล้ว</div>`;h+=entries.map(renderEntry).join('');}
  document.getElementById('content').innerHTML=h;
}

// ── หน้าสรุปกลุ่ม ──
function renderGroupContent(){
  const gid=S.view.id;
  const grp=S.groups.find(g=>g.id===gid);
  if(!grp){document.getElementById('content').innerHTML='<div class="empty"><p>ไม่พบกลุ่ม</p></div>';return;}
  const tf=curTabFlags();
  const memberIds=S.groupMembers[gid]||[];
  const members=memberIds.map(id=>S.shops.find(s=>s.id===id)).filter(Boolean);

  // รวมยอดทั้งกลุ่ม (เดือนปัจจุบัน)
  let gtCount=0,gtIncome=0,gtExpense=0;
  const gcb=eb();
  members.forEach(sh=>{
    const ents=ge(sh.id,S.month);
    const sess=gs(sh.id,S.month);
    ents.forEach(e=>{
      if(e.type==='count'){gtCount+=e.total||0;(e.subs||[]).forEach(s=>BT.forEach(t=>gcb[t]+=(s.bills[t]||0)));}
      else if(e.type==='income'||e.type==='exin'){gtIncome+=e.amount||0;if(e.bills)BT.forEach(t=>gcb[t]+=(e.bills[t]||0));}
      else if(e.type==='expense'||e.type==='exout'){gtExpense+=e.amount||0;if(e.bills)BT.forEach(t=>gcb[t]-=(e.bills[t]||0));}
    });
    if(sess){sess.subs.forEach(s=>{gtCount+=bv(s.bills||eb());BT.forEach(t=>gcb[t]+=(s.bills[t]||0));});}
  });
  const gnet=gtCount+gtIncome-gtExpense;
  const hasGBills=BT.some(t=>gcb[t]!==0);

  let h=`<div class="mhdr">
    <div><div class="mtitle">📁 ${grp.name} — ${monthLbl(S.month)}</div><div class="mperiod">${periodLbl(S.month)} · ${members.length} สาย</div></div>
    <div class="abtns">
      ${tf.count?`<button class="btn btn-g" onclick="openCountGroup()">+ นับเงิน</button>`:''}
      ${tf.income?`<button class="btn btn-b" onclick="openIncomeGroup()">+ รายรับ</button>`:''}
      ${tf.expense?`<button class="btn btn-a" onclick="openExpenseGroup()">+ รายจ่าย</button>`:''}
      ${tf.exchange?`<button class="btn btn-p" onclick="openExchange()">⇄ แลกระหว่างสาย</button>`:''}
    </div>
  </div>
  <div class="grid4">
    <div class="sc"><div class="lb">ยอดนับได้ (รวม)</div><div class="vl pos">${fmt(gtCount)}</div></div>
    <div class="sc"><div class="lb">รายรับ (รวม)</div><div class="vl" style="color:var(--blue)">${fmt(gtIncome)}</div></div>
    <div class="sc"><div class="lb">รายจ่าย (รวม)</div><div class="vl" style="color:var(--amber)">${fmt(gtExpense)}</div></div>
    <div class="sc"><div class="lb">ยอดสุทธิ (รวม)</div><div class="vl ${gnet>=0?'pos':'neg'}">${fmt(gnet)}</div></div>
  </div>`;

  if(hasGBills){
    h+=`<div class="cumul"><div class="clb">แบงค์คงเหลือรวมทุกสายในกลุ่ม</div><div class="chips">`+
      BT.filter(t=>gcb[t]!==0).map(t=>{const neg=gcb[t]<0;return`<span class="pill ${BC[t]}" style="${neg?'outline:1px solid var(--red);opacity:.8;':''}">฿${BL[t]} × ${neg?'<span style="color:var(--red)">':''}${fN(gcb[t])}${neg?'</span>':''}</span>`;}).join('')+
    `</div></div>`;
  }

  // รายละเอียดแต่ละสาย
  h+=`<div class="slbl">รายละเอียดแต่ละสาย</div>`;
  members.forEach(sh=>{
    const ents=ge(sh.id,S.month);
    const sess=gs(sh.id,S.month);
    let tc=0,ti=0,te=0;
    ents.forEach(e=>{
      if(e.type==='count')tc+=e.total||0;
      else if(e.type==='income'||e.type==='exin')ti+=e.amount||0;
      else if(e.type==='expense'||e.type==='exout')te+=e.amount||0;
    });
    if(sess)sess.subs.forEach(s=>tc+=bv(s.bills||eb()));
    const snet=tc+ti-te;
    const scb=eb();
    ents.forEach(e=>{
      if(e.type==='count')(e.subs||[]).forEach(s=>BT.forEach(t=>scb[t]+=(s.bills[t]||0)));
      else if(e.type==='income'||e.type==='exin'){if(e.bills)BT.forEach(t=>scb[t]+=(e.bills[t]||0));}
      else if(e.type==='expense'||e.type==='exout'){if(e.bills)BT.forEach(t=>scb[t]-=(e.bills[t]||0));}
    });
    if(sess)sess.subs.forEach(s=>BT.forEach(t=>scb[t]+=(s.bills[t]||0)));
    const hasSBills=BT.some(t=>scb[t]!==0);
    h+=`<div class="grp-route-card">
      <div class="grp-route-card-hd" onclick="toggleGrpCard('${sh.id}')">
        <span style="width:10px;height:10px;border-radius:50%;background:${sh.color};display:inline-block;flex-shrink:0;"></span>
        <span style="flex:1;font-size:14px;font-weight:600;">${sh.name}</span>
        <span style="font-family:var(--mono);font-size:15px;font-weight:600;color:${snet>=0?'var(--green)':'var(--red)'};">${fmt(snet)}</span>
        <button onclick="event.stopPropagation();setView('shop','${sh.id}')" style="margin-left:8px;background:var(--bdim);border:1px solid var(--bbr);color:var(--blue);border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;">เปิด →</button>
      </div>
      <div class="grp-route-card-body" id="grc-${sh.id}">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;">
          <div class="sc"><div class="lb">นับได้</div><div class="vl pos" style="font-size:14px;">${fmt(tc)}</div></div>
          <div class="sc"><div class="lb">รายรับ</div><div class="vl" style="color:var(--blue);font-size:14px;">${fmt(ti)}</div></div>
          <div class="sc"><div class="lb">รายจ่าย</div><div class="vl" style="color:var(--amber);font-size:14px;">${fmt(te)}</div></div>
          <div class="sc"><div class="lb">สุทธิ</div><div class="vl ${snet>=0?'pos':'neg'}" style="font-size:14px;">${fmt(snet)}</div></div>
        </div>
        ${hasSBills?`<div class="cumul"><div class="clb">แบงค์คงเหลือ</div><div class="chips">`+BT.filter(t=>scb[t]!==0).map(t=>{const neg=scb[t]<0;return`<span class="pill ${BC[t]}" style="${neg?'outline:1px solid var(--red);opacity:.8;':''}">฿${BL[t]} × ${neg?'<span style="color:var(--red)">':''}${fN(scb[t])}${neg?'</span>':''}</span>`;}).join('')+`</div></div>`:''}
        ${sess?`<div style="font-size:12px;color:var(--green);padding:6px 0;">📋 มีรอบนับเงินที่ยังเปิดอยู่ — สะสม ${fmt(sess.subs.reduce((s,e)=>s+bv(e.bills||eb()),0))}</div>`:''}
        ${ents.length>0?`<div class="slbl" style="margin-top:8px;">รายการ</div>`+ents.map(renderEntry).join(''):'<div style="font-size:12px;color:var(--text3);padding:8px 0;">ยังไม่มีรายการ</div>'}
      </div>
    </div>`;
  });
  if(members.length===0)h+=`<div class="empty"><div class="ei">📭</div><p>ยังไม่มีสายในกลุ่มนี้</p></div>`;
  document.getElementById('content').innerHTML=h;
}
function toggleGrpCard(id){const b=document.getElementById('grc-'+id);if(b)b.classList.toggle('open');}

function renderEntry(e){
  const labels={count:'นับเงิน',income:'รายรับ',expense:'รายจ่าย',exin:'รับแลกเงิน',exout:'แลกเงินออก'};
  const bclass={count:'bcount',income:'binc',expense:'bexp',exin:'bexin',exout:'bexout'};
  const aclass={count:'pos',income:'pos',expense:'neg',exin:'pos',exout:'neg'};
  const sign={count:'+',income:'+',expense:'-',exin:'+',exout:'-'};
  const amt=e.total??e.amount??0;
  const ds=e.df===e.dt?e.df:`${e.df} – ${e.dt}`;
  let body='';
  if(e.type==='count'){
    (e.subs||[]).forEach((s,i)=>{
      const sa=bv(s.bills||eb());
      body+=`<div style="margin-bottom:10px;"><div style="font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px;">ครั้งที่ ${i+1} · ${s.df}${s.dt&&s.dt!==s.df?' – '+s.dt:''} — ${fmt(sa)}</div>${billTbl(s.bills||eb(),sa)}</div>`;
    });
    if((e.subs||[]).length>1){
      const tb=eb();(e.subs||[]).forEach(s=>BT.forEach(t=>tb[t]+=(s.bills[t]||0)));
      body+=`<div class="sumbox"><div class="sumbox-t">รวมสะสม ${e.subs.length} ครั้ง</div>${billTbl(tb,e.total)}</div>`;
    }
  } else if(e.type==='income'){
    body=`<p style="font-size:13px;color:var(--text2);">รายรับ: <strong class="pos" style="font-family:var(--mono);">${fmt(amt)}</strong></p>`;
    if(e.bills)body+=`<div style="margin-top:8px;">${billTbl(e.bills,amt)}</div>`;
  } else if(e.type==='expense'){
    body=`<p style="font-size:13px;color:var(--text2);">จำนวน: <strong style="color:var(--amber);font-family:var(--mono);">${fmt(amt)}</strong></p>`;
    if(e.bills&&BT.some(t=>e.bills[t]>0))body+=`<div style="margin-top:8px;">${billTbl(e.bills,amt)}</div>`;
  } else if(e.type==='exin'||e.type==='exout'){
    const os=S.shops.find(s=>s.id===e.oid);
    body=`<p style="font-size:13px;color:var(--text2);">${e.type==='exout'?'ให้ไปยัง':'รับจาก'}: <strong style="color:var(--purple);">${os?.name||'?'}</strong> — ${fmt(amt)}</p>`;
    if(e.bills&&BT.some(t=>e.bills[t]>0))body+=`<div style="margin-top:8px;">${billTbl(e.bills,amt)}</div>`;
  }
  if(e.note)body+=`<div class="notetxt">📝 ${e.note}</div>`;
  return `<div class="ecard">
    <div class="ehd" onclick="toggleE('${e.id}')">
      <span class="badge ${bclass[e.type]}">${labels[e.type]}</span>
      <span class="edt">${ds}</span>
      <span class="ett">${e.title||''}</span>
      <span class="eam ${aclass[e.type]}">${sign[e.type]}${fmt(Math.abs(amt))}</span>
      <button class="delbtn" onclick="delE(event,'${e.id}')" style="${isAdmin()?'':'display:none'}">ลบ</button>
    </div>
    <div class="ebody" id="eb-${e.id}">${body}</div>
  </div>`;
}

function billTbl(bills,total){
  const rows=BT.filter(t=>bills[t]>0).map(t=>{const v=(t==='coin'?1:t)*(bills[t]||0);return`<tr><td><span class="pill ${BC[t]}">฿${BL[t]}</span></td><td class="nr">${fN(bills[t])}</td><td class="nr">${fmt(v)}</td></tr>`;}).join('');
  if(!rows)return`<p style="font-size:12px;color:var(--text3);">ไม่มีแบงค์</p>`;
  return`<table class="btbl"><thead><tr><th>ธนบัตร</th><th class="nr">ใบ</th><th class="nr">รวม</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="2">รวม</td><td class="nr">${fmt(total)}</td></tr></tfoot></table>`;
}

function toggleE(id){const b=document.getElementById('eb-'+id);if(b)b.classList.toggle('open');}
async function delE(ev,id){ev.stopPropagation();if(!confirm('ลบรายการนี้?'))return;const sid=S.shop;try{await sbDelete('entries',`id=eq.${id}`);const l=ge(sid,S.month);const i=l.findIndex(e=>e.id===id);if(i>-1)l.splice(i,1);render();}catch(err){toast('ลบไม่สำเร็จ: '+err.message);console.error(err);}}

// ─── MODAL helpers ───
function OM(title,body,foot){document.getElementById('mtitle').textContent=title;document.getElementById('mbody').innerHTML=body;document.getElementById('mfoot').innerHTML=foot;document.getElementById('overlay').style.display='flex';}
function CM(){document.getElementById('overlay').style.display='none';}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')CM();});

// bill input grid helpers
// bill input พร้อม cap (สำหรับรายจ่าย)
let _cbMap={};
function billInpWithLimit(p,cb){
  _cbMap[p]=cb;
  const g='bgrid';
  return`<div class="${g}">`+BT.map(t=>{
    const max=cb[t]||0;
    return`<div class="bcell"><label><span class="pill ${BC[t]}">฿${BL[t]}</span><span style="font-size:10px;color:var(--text3);margin-left:4px;">มี ${fN(max)}</span></label><input type="number" min="0" max="${max}" value="0" id="${p}_${t}" oninput="updBLimit('${p}')" inputmode="numeric"><div class="bsub" id="${p}s_${t}">= ฿0</div></div>`;
  }).join('')+`</div>`;
}
function billInpExchange(p,cb){
  _cbMap[p]=cb;
  return BT.map(t=>{
    const max=cb[t]||0;
    return`<div class="bcell" style="border-radius:0;border-left:none;border-right:none;border-top:none;border-bottom:1px solid var(--border);background:transparent;padding:10px 12px;"><label style="display:flex;align-items:center;gap:6px;margin-bottom:6px;"><span class="pill ${BC[t]}">฿${BL[t]}</span><span style="font-size:11px;color:var(--text3);">มี ${fN(max)} ใบ</span></label><input type="number" min="0" max="${max}" value="0" id="${p}_${t}" oninput="updBLimit('${p}')" inputmode="numeric" style="font-size:20px;width:100%;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-weight:500;"><div class="bsub" style="font-size:13px;" id="${p}s_${t}">= ฿0</div></div>`;
  }).join('');
}
function updBLimit(p){
  const cb=_cbMap[p]||{};
  let tot=0,over=false;
  BT.forEach(t=>{
    const inp=document.getElementById(`${p}_${t}`);
    if(!inp)return;
    let v=parseInt(inp.value)||0;
    const max=cb[t]??0;
    if(v>max){v=max;inp.value=max;inp.style.color='var(--red)';over=true;}
    else inp.style.color='';
    const denom=t==='coin'?1:parseInt(t);
    const val=denom*v;
    tot+=val;
    const s=document.getElementById(`${p}s_${t}`);
    if(s)s.textContent=`= ฿${fN(val)}`;
  });
  const tb=document.getElementById(`${p}_tot`);if(tb)tb.textContent=fmt(tot);
  if(over)toast('ไม่สามารถใส่แบงค์เกินจำนวนที่มีในกล่องได้');
}
function billInp(p,cols){
  const g=cols===2?'bgrid2':'bgrid';
  return`<div class="${g}">`+BT.map(t=>`<div class="bcell"><label><span class="pill ${BC[t]}">฿${BL[t]}</span></label><input type="number" min="0" value="0" id="${p}_${t}" oninput="updB('${p}')" inputmode="numeric"><div class="bsub" id="${p}s_${t}">= ฿0</div></div>`).join('')+`</div>`;
}
function updB(p){
  let tot=0;
  BT.forEach(t=>{const v=parseInt(document.getElementById(`${p}_${t}`)?.value)||0;const val=(t==='coin'?1:t)*v;tot+=val;const s=document.getElementById(`${p}s_${t}`);if(s)s.textContent=`= ฿${fN(val)}`;});
  const tb=document.getElementById(`${p}_tot`);if(tb)tb.textContent=fmt(tot);
}
function gb(p){const b={};BT.forEach(t=>b[t]=parseInt(document.getElementById(`${p}_${t}`)?.value)||0);return b;}

// ─── COUNT SESSION ───
// Each "round" is a session. Within a round user can add sub-entries (ครั้งที่ 1, 2, 3...).
// After summarize, the round becomes a saved "count" entry. A new round starts fresh.
function openCount(){
  const sess=gs(S.shop,S.month);
  if(sess){addSubCount();return;}
  // Start a new round — show sub-entry form for ครั้งที่ 1
  showSubForm(`เริ่มรอบนับเงิน — ครั้งที่ 1`,null,saveSubHandler);
}
function addSubCount(){
  const sess=gs(S.shop,S.month);
  if(!sess){toast('ไม่มีรอบที่เปิดอยู่');return;}
  const n=sess.subs.length+1;
  const prev=sess.subs.reduce((s,e)=>s+bv(e.bills||eb()),0);
  showSubForm(`เพิ่มครั้งที่ ${n}`,prev,saveSubHandler);
}
async function saveSubHandler(){
  const df=document.getElementById('sf_df').value;
  const dt=document.getElementById('sf_dt').value||df;
  if(!df){toast('กรุณาเลือกวันที่');return;}
  const bills=gb('sf');
  const sess=gs(S.shop,S.month);
  let newSubs;
  if(!sess){
    newSubs=[{df,dt,bills}];
    ss(S.shop,S.month,{subs:newSubs});
  } else {
    sess.subs.push({df,dt,bills});
    newSubs=sess.subs;
  }
  try{
    await sbUpsert('sessions',{id:S.shop+'_'+S.month,route_id:S.shop,month_key:S.month,subs:newSubs});
    CM();render();
    toast(sess?`เพิ่มครั้งที่ ${newSubs.length} แล้ว ✓`:'เริ่มรอบนับเงินแล้ว — กดสรุปเมื่อครบ ✓');
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);console.error(err);}
}
function showSubForm(title,prevTotal,onSave){
  const prevBar=prevTotal!=null
    ?`<div style="padding:8px 12px;background:var(--bg3);border-radius:6px;margin-bottom:12px;font-size:13px;color:var(--text2);">ยอดสะสมก่อนหน้า: <strong class="pos" style="font-family:var(--mono);">${fmt(prevTotal)}</strong></div>`:''
  ;
  const body=`${prevBar}
    <div class="frow">
      <div class="fg"><label class="flbl">วันที่เริ่ม</label><input type="date" class="finp" id="sf_df" value="${today()}"></div>
      <div class="fg"><label class="flbl">วันที่สิ้นสุด</label><input type="date" class="finp" id="sf_dt" value="${today()}"></div>
    </div>
    <div class="tbar"><span class="tl">ยอดครั้งนี้</span><span class="tv" id="sf_tot">฿0</span></div>
    ${billInp('sf')}`;
  OM(title,body,`<button class="btn btn-x" onclick="CM()">ยกเลิก</button><button class="btn btn-g" onclick="saveSubHandler()">บันทึก</button>`);
}
async function summarize(){
  const sess=gs(S.shop,S.month);
  if(!sess||sess.subs.length===0){toast('ไม่มีข้อมูลในรอบนี้');return;}
  const tb=eb();sess.subs.forEach(s=>BT.forEach(t=>tb[t]+=(s.bills[t]||0)));
  const total=bv(tb);
  const n=sess.subs.length;
  const df=sess.subs[0].df;
  const dt=sess.subs[n-1].dt||df;
  const prevRounds=ge(S.shop,S.month).filter(e=>e.type==='count').length;
  const entry={id:uid(),type:'count',df,dt,total,subs:[...sess.subs],title:`รอบ ${prevRounds+1} (${n} ครั้ง)`};
  try{
    await sbUpsert('entries',entryToRow(entry,S.shop,S.month));
    await sbDelete('sessions',`route_id=eq.${S.shop}&month_key=eq.${S.month}`);
    ge(S.shop,S.month).push(entry);
    cs(S.shop,S.month);
    render();toast(`สรุปรอบ ${prevRounds+1} แล้ว — ${n} ครั้ง รวม ${fmt(total)} ✓`);
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);console.error(err);}
}
async function cancelSess(){if(!confirm('ยกเลิกรอบปัจจุบัน? ข้อมูลจะหาย'))return;try{await sbDelete('sessions',`route_id=eq.${S.shop}&month_key=eq.${S.month}`);cs(S.shop,S.month);render();toast('ยกเลิกรอบแล้ว');}catch(err){toast('ลบไม่สำเร็จ: '+err.message);console.error(err);}}

// ─── INCOME (bill-based, no manual amount) ───
function openIncome(){
  const body=`
    <div class="frow">
      <div class="fg"><label class="flbl">วันที่</label><input type="date" class="finp" id="ic_d" value="${today()}"></div>
      <div class="fg"><label class="flbl">รายละเอียด</label><input type="text" class="finp" id="ic_t" placeholder="เช่น รายรับพิเศษ"></div>
    </div>
    <div class="fg"><label class="flbl">หมายเหตุ</label><input type="text" class="finp" id="ic_n"></div>
    <div class="tbar"><span class="tl">ยอดรวมที่รับ</span><span class="tv" id="ic_tot">฿0</span></div>
    ${billInp('ic')}`;
  OM('เพิ่มรายรับ',body,`<button class="btn btn-x" onclick="CM()">ยกเลิก</button><button class="btn btn-b" onclick="saveIncome()">บันทึก</button>`);
}
async function saveIncome(){
  const d=document.getElementById('ic_d').value;
  const t=document.getElementById('ic_t').value||'รายรับ';
  const n=document.getElementById('ic_n').value;
  const bills=gb('ic');
  const amount=bv(bills);
  if(!d){toast('กรุณาเลือกวันที่');return;}
  if(amount===0){toast('กรุณาใส่แบงค์ที่รับ');return;}
  const entry={id:uid(),type:'income',df:d,dt:d,amount,title:t,note:n,bills};
  try{
    await sbUpsert('entries',entryToRow(entry,S.shop,S.month));
    ge(S.shop,S.month).push(entry);
    CM();render();toast(`บันทึกรายรับ ${fmt(amount)} แล้ว ✓`);
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);console.error(err);}
}

// ─── คำนวณแบงค์คงเหลือของสาย (sid) ในเดือน (mk) ───
function calcCB(sid,mk){
  const cb=eb();
  const entries=ge(sid,mk);
  entries.forEach(e=>{
    if(e.type==='count'){
      (e.subs||[]).forEach(s=>BT.forEach(t=>cb[t]+=(s.bills[t]||0)));
    } else if(e.type==='income'||e.type==='exin'){
      if(e.bills)BT.forEach(t=>cb[t]+=(e.bills[t]||0));
    } else if(e.type==='expense'||e.type==='exout'){
      if(e.bills)BT.forEach(t=>cb[t]-=(e.bills[t]||0));
    }
  });
  const sess=gs(sid,mk);
  if(sess)sess.subs.forEach(s=>BT.forEach(t=>cb[t]+=(s.bills[t]||0)));
  return cb;
}

// ─── render แถบแบงค์คงเหลือ ───
function cbBar(cb){
  const hasBills=BT.some(t=>cb[t]>0);
  if(!hasBills)return`<div style="padding:8px 12px;background:var(--bg3);border-radius:7px;font-size:13px;color:var(--text3);">ไม่มีแบงค์คงเหลือในกล่อง</div>`;
  const chips=BT.filter(t=>cb[t]>0).map(t=>`<span class="pill ${BC[t]}">฿${BL[t]} × ${fN(cb[t])}</span>`).join(' ');
  const total=BT.reduce((s,t)=>s+(t==='coin'?1:t)*(cb[t]>0?cb[t]:0),0);
  return`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:10px 12px;">
    <div style="font-size:11px;color:var(--text3);margin-bottom:6px;">แบงค์ในกล่องตอนนี้ — รวม <strong style="color:var(--green);font-family:var(--mono);">${fmt(total)}</strong></div>
    <div class="chips">${chips}</div>
  </div>`;
}

async function saveExchange(){
  const d=today();
  const n='';

  const Lshop=S.shops.find(s=>s.id===Lid);
  const Rshop=S.shops.find(s=>s.id===Rid);
  const mk2=S.month;
  const entriesToSave=[];
  const localEntries=[];
  if(La>0){const e={id:uid(),type:'exout',df:d,dt:d,amount:La,title:`แลกออก → ${Rshop?.name}`,note:n,bills:Lblls,oid:Rid};entriesToSave.push(entryToRow(e,Lid,mk2));localEntries.push({sid:Lid,e});}
  if(Ra>0){const e={id:uid(),type:'exin',df:d,dt:d,amount:Ra,title:`รับแลก ← ${Rshop?.name}`,note:n,bills:Rblls,oid:Rid};entriesToSave.push(entryToRow(e,Lid,mk2));localEntries.push({sid:Lid,e});}
  if(Ra>0){const e={id:uid(),type:'exout',df:d,dt:d,amount:Ra,title:`แลกออก → ${Lshop?.name}`,note:n,bills:Rblls,oid:Lid};entriesToSave.push(entryToRow(e,Rid,mk2));localEntries.push({sid:Rid,e});}
  if(La>0){const e={id:uid(),type:'exin',df:d,dt:d,amount:La,title:`รับแลก ← ${Lshop?.name}`,note:n,bills:Lblls,oid:Lid};entriesToSave.push(entryToRow(e,Rid,mk2));localEntries.push({sid:Rid,e});}
  try{
    await sbUpsert('entries',entriesToSave);
    localEntries.forEach(({sid,e})=>ge(sid,mk2).push(e));

  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);console.error(err);}
}

async function deleteShop(id){
  const shop=S.shops.find(s=>s.id===id);
  if(!shop)return;
  if(!confirm(`ลบสาย "${shop.name}" ? ข้อมูลทั้งหมดของสายนี้จะหายถาวร`))return;
  try{
    await sbDelete('routes',`id=eq.${id}`);
    S.shops=S.shops.filter(s=>s.id!==id);
    delete S.entries[id];delete S.sessions[id];
    // ลบออกจาก groupMembers ด้วย
    Object.keys(S.groupMembers).forEach(gid=>{S.groupMembers[gid]=S.groupMembers[gid].filter(rid=>rid!==id);});

    CM();render();toast(`ลบสาย "${shop.name}" แล้ว`);

function tfChips(flags,prefix){
  const tabs=[{k:'count',l:'นับเงิน'},{k:'income',l:'รายรับ'},{k:'expense',l:'รายจ่าย'},{k:'exchange',l:'แลกระหว่างสาย'}];
  return`<div class="tf-row">`+tabs.map(t=>`<span class="tf-chip${flags[t.k]?' on':''}" id="${prefix}_${t.k}" onclick="toggleTf('${prefix}','${t.k}')">${t.l}</span>`).join('')+`</div>`;
}
function toggleTf(prefix,key){const el=document.getElementById(`${prefix}_${key}`);if(el)el.classList.toggle('on');}
function getTf(prefix){const keys=['count','income','expense','exchange'];const f={};keys.forEach(k=>{f[k]=document.getElementById(`${prefix}_${k}`)?.classList.contains('on')??true;});return f;}

      await sbUpsert('group_members',checked.map((rid,i)=>({group_id:id,route_id:rid,sort_order:i})));
    }
    S.groups.push({id,name:n,sort_order:so,tab_flags:tf});
    S.groupMembers[id]=checked;
    S.view={type:'group',id};
    CM();render();toast(`เพิ่มกลุ่ม "${n}" แล้ว ✓`);
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);console.error(err);}
}

function editGroup(id){
  const grp=S.groups.find(g=>g.id===id);if(!grp)return;
  const curMembers=new Set(S.groupMembers[id]||[]);
  const otherGrouped=new Set();
  S.groups.filter(g=>g.id!==id).forEach(g=>(S.groupMembers[g.id]||[]).forEach(rid=>otherGrouped.add(rid)));
  const availShops=S.shops.filter(sh=>!otherGrouped.has(sh.id));
  const tf=grp.tab_flags||{count:true,income:true,expense:true,exchange:true};
  OM('แก้ไขกลุ่มสาย',`
    <div class="fg"><label class="flbl">ชื่อกลุ่ม</label><input type="text" class="finp" id="eg_n" value="${grp.name}"></div>
    <div class="fg"><label class="flbl">สายในกลุ่มนี้</label>
      <div id="eg_shops" style="display:flex;flex-direction:column;gap:6px;margin-top:6px;">
        ${availShops.map(sh=>`<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 8px;border:1px solid var(--border);border-radius:6px;">
          <input type="checkbox" value="${sh.id}" ${curMembers.has(sh.id)?'checked':''} style="width:14px;height:14px;">
          <span style="width:8px;height:8px;border-radius:50%;background:${sh.color};display:inline-block;"></span>
          <span style="font-size:13px;">${sh.name}</span>
        </label>`).join('')}
      </div>
    </div>
    <div class="fg"><label class="flbl">แท็บที่แสดง</label>${tfChips(tf,'eg')}
    </div>`,
  `<button class="btn btn-x" onclick="CM()">ยกเลิก</button><button class="btn btn-b" onclick="saveEditGroup('${id}')">บันทึก</button>`);
}

async function saveEditGroup(id){
  const n=document.getElementById('eg_n').value.trim();
  if(!n){toast('กรุณาใส่ชื่อกลุ่ม');return;}
  const checked=[...document.querySelectorAll('#eg_shops input[type=checkbox]:checked')].map(i=>i.value);
  const tf=getTf('eg');
  try{
    await sbUpsert('groups',{id,name:n,tab_flags:tf});
    await sbDelete('group_members',`group_id=eq.${id}`);
    if(checked.length>0)await sbUpsert('group_members',checked.map((rid,i)=>({group_id:id,route_id:rid,sort_order:i})));
    const grp=S.groups.find(g=>g.id===id);if(grp){grp.name=n;grp.tab_flags=tf;}
    S.groupMembers[id]=checked;
    CM();render();toast(`แก้ไขกลุ่ม "${n}" แล้ว ✓`);
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);console.error(err);}
}

async function deleteGroup(id){
  const grp=S.groups.find(g=>g.id===id);if(!grp)return;
  if(!confirm(`ลบกลุ่ม "${grp.name}" ? (สายในกลุ่มจะไม่ถูกลบ)`))return;
  try{
    await sbDelete('groups',`id=eq.${id}`);
    S.groups=S.groups.filter(g=>g.id!==id);
    delete S.groupMembers[id];
    if(S.view.id===id)S.view=S.groups.length>0?{type:'group',id:S.groups[0].id}:{type:'shop',id:S.shops[0]?.id||null};
    CM();render();toast(`ลบกลุ่ม "${grp.name}" แล้ว`);
  }catch(err){toast('ลบไม่สำเร็จ: '+err.message);console.error(err);}
}

// ─── GROUP ACTION BUTTONS — เลือกสายก่อนเปิด modal ───
function openCountGroup(){
  const members=(S.groupMembers[S.view.id]||[]).map(id=>S.shops.find(s=>s.id===id)).filter(Boolean);
  if(members.length===0){toast('ไม่มีสายในกลุ่ม');return;}
  if(members.length===1){setView('shop',members[0].id);openCount();return;}
  pickShopThen(members,'นับเงิน','openCount','count');
}
function openIncomeGroup(){
  const members=(S.groupMembers[S.view.id]||[]).map(id=>S.shops.find(s=>s.id===id)).filter(Boolean);
  if(members.length===0){toast('ไม่มีสายในกลุ่ม');return;}
  if(members.length===1){setView('shop',members[0].id);openIncome();return;}
  pickShopThen(members,'รายรับ','openIncome','income');
}
function openExpenseGroup(){
  const members=(S.groupMembers[S.view.id]||[]).map(id=>S.shops.find(s=>s.id===id)).filter(Boolean);
  if(members.length===0){toast('ไม่มีสายในกลุ่ม');return;}
  if(members.length===1){setView('shop',members[0].id);openExpense();return;}
  pickShopThen(members,'รายจ่าย','openExpense','expense');
}
function pickShopThen(members,label,fn,type){
  const colorMap={count:'btn-g',income:'btn-b',expense:'btn-a'};
  OM(`เลือกสายสำหรับ${label}`,
    `<p style="font-size:13px;color:var(--text2);margin-bottom:12px;">เลือกสายที่ต้องการบันทึก${label}:</p>`+
    members.map(sh=>`<button onclick="pickShopAndDo('${sh.id}','${fn}')" style="display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;margin-bottom:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-family:var(--font);font-size:14px;">
      <span style="width:10px;height:10px;border-radius:50%;background:${sh.color};display:inline-block;"></span>
      ${sh.name} <span style="margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--text2);">${fmt(shopTot(sh.id))}</span>
    </button>`).join(''),
    `<button class="btn btn-x" onclick="CM()">ยกเลิก</button>`);
}
function pickShopAndDo(sid,fn){
  const gid=S.view.id;
  S.view={type:'shop',id:sid};S.shop=sid;
  CM();
  setTimeout(()=>{window[fn]();},50);
  // จำ gid เพื่อ return กลับหลัง render
  window._returnToGroup=gid;
}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}

authInit();
</script>
