async function generatePeriod(beYM,slot){
  if(!PR._loaded){toast('กำลังโหลดข้อมูล กรุณารอสักครู่…');return;}
  const slotMap={A:{from:1,to:10,payD:11},B:{from:11,to:20,payD:21},C:{from:21,to:0,payD:1}};
  const s=slotMap[slot];
  const[y,m]=beYM.split('-').map(Number);const ceY=y-543;
  let toDay=s.to;
  if(slot==='C'){toDay=new Date(ceY,m,0).getDate();}
  const dateFrom=prBeToDate(beYM,s.from);
  const dateTo=prBeToDate(beYM,toDay);
  let payDate;
  if(slot==='C'){const nm=m===12?1:m+1;const ny=m===12?ceY+1:ceY;payDate=`${ny}-${String(nm).padStart(2,'0')}-01`;}
  else payDate=prBeToDate(beYM,s.payD);
  const pk=`${beYM}-${slot}`;
  const existing=PR.periods.find(p=>p.period_key===pk);
  if(existing){
    const hasEntries=PR.entries.some(e=>e.period_id===existing.id);
    if(hasEntries){toast(`งวด ${pk} มีอยู่แล้ว`);return;}
    // stale period with no entries — delete and recreate
    try{await sbDelete('payroll_periods','id=eq.'+existing.id);}catch(_){}
    PR.periods=PR.periods.filter(p=>p.period_key!==pk);
  }
  const pid=uid();
  const periodRow={id:pid,period_key:pk,date_from:dateFrom,date_to:dateTo,pay_date:payDate,status:'draft'};
  try{
    await sbUpsert('payroll_periods',[periodRow]);
    PR.periods.push(periodRow);
    // โอนจ่ายM และ รายเดือน ขึ้นเฉพาะงวด C (21-31) เท่านั้น
    const monthlyTypes=['โอนจ่ายM','รายเดือน'];
    const activeEmps=PR.employees.filter(e=>e.status==='active'&&(slot==='C'||!monthlyTypes.includes(e.payment_type)));
    const defDays=slot==='C'?toDay-20:10;
    if(activeEmps.length===0){toast(`สร้างงวด ${pk} แล้ว (ไม่มีพนักงาน)`);renderPayroll();return;}
    const entryRows=activeEmps.map(emp=>({id:uid(),period_id:pid,employee_id:emp.id,route_id:emp.route_id,days_worked:defDays,bonus:0,advance:0,net_pay:0,notes:null}));
    const dedRows=[];
    entryRows.forEach(entry=>{
      const emp=PR.employees.find(e=>e.id===entry.employee_id);
      PR.loans.filter(l=>l.employee_id===entry.employee_id&&l.status==='active').forEach(loan=>{
        dedRows.push({id:uid(),entry_id:entry.id,loan_id:loan.id,type:loan.type,label:loan.description||loan.type,amount:loan.per_period_amount});
      });
      if(emp.phone_fee>0)dedRows.push({id:uid(),entry_id:entry.id,loan_id:null,type:'phone',label:'ค่าโทร',amount:emp.phone_fee});
      if(emp.room_fee>0)dedRows.push({id:uid(),entry_id:entry.id,loan_id:null,type:'room',label:'ค่าห้อง',amount:emp.room_fee});
    });
    entryRows.forEach(entry=>{
      const emp=PR.employees.find(e=>e.id===entry.employee_id);
      const totalDed=dedRows.filter(d=>d.entry_id===entry.id).reduce((s,d)=>s+d.amount,0);
      entry.net_pay=(emp.daily_rate||0)*entry.days_worked-totalDed;
    });
    await sbUpsert('payroll_entries',entryRows);
    PR.entries.push(...entryRows);
    if(dedRows.length>0){await sbUpsert('payroll_deductions',dedRows);PR.deductions.push(...dedRows);}
    toast(`สร้างงวด ${pk} แล้ว (${activeEmps.length} คน) ✓`);renderPayroll();
  }catch(e){toast('สร้างงวดไม่สำเร็จ: '+e.message);console.error(e);}
}

let _openPeriodId=null;
function openPeriod(periodId){
  _openPeriodId=periodId;
  const period=PR.periods.find(p=>p.id===periodId);if(!period)return;
  const slot=period.period_key.split('-')[2];
  const slotLbl={A:'1–10',B:'11–20',C:'21–31'}[slot];
  const[y,mo]=period.period_key.split('-');
  const mLbl=prMonthLbl(`${y}-${mo}`);
  const isPaid=period.status==='paid';
  const _hiddenPos=new Set([...(_prSettings.hideManager?['ผู้จัดการ']:[]),...(_prSettings.hideTopManager?['ผู้จัดการใหญ่']:[])]);
  const _monthlyTypes=['โอนจ่ายM','รายเดือน'];
  const ents=PR.entries.filter(e=>{
    const emp=PR.employees.find(x=>x.id===e.employee_id);
    if(!emp)return true;
    if(_hiddenPos.has(emp.position))return false;
    if(slot!=='C'&&_monthlyTypes.includes(emp.payment_type))return false;
    return e.period_id===periodId;
  });
  // group by route, preserve route sort_order
  const byRoute={};
  ents.forEach(e=>{
    const emp=PR.employees.find(x=>x.id===e.employee_id);if(!emp)return;
    const k=emp.route_id||'__none__';

  // sort routes: ตามลำดับกลุ่ม → route ในกลุ่ม → standalone → __none__

      .map(id=>S.shops.find(s=>s.id===id)).filter(Boolean)
      .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    members.forEach(r=>_orderedRouteIds.push(r.id));

  [...S.shops].filter(s=>!_groupedIds.has(s.id)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))

    blocks+=`<div style="margin-bottom:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;align-items:stretch;">
      <div style="flex:0 0 72px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:8px 4px;background:${rtColor}18;border-right:3px solid ${rtColor};">
        <div style="width:8px;height:8px;border-radius:50%;background:${rtColor};"></div>
        <div style="font-size:11px;font-weight:600;text-align:center;color:var(--text);line-height:1.3;word-break:break-all;">${rtName}</div>
        <div style="font-size:10px;color:var(--text3);">${items.length} คน</div>
        <div style="font-size:11px;font-family:var(--mono);color:var(--green);margin-top:2px;">${fmt(rtTotal)}</div>
      </div>
      <div style="flex:1;overflow-x:auto;">

async function sharePeriod(periodId){
  const period=PR.periods.find(p=>p.id===periodId);if(!period)return;
  const slot=period.period_key.split('-')[2];
  const slotLbl={A:'1–10',B:'11–20',C:'21–31'}[slot];
  const[y,mo]=period.period_key.split('-');
  const mLbl=prMonthLbl(`${y}-${mo}`);
  const ents=PR.entries.filter(e=>e.period_id===periodId);
  const hr=_prSettings.hideRates;
  const fmtN=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');

  // หากลุ่มบูรชัย (ชื่อกลุ่มที่มี "บูรชัย")
  const burachaiGrp=S.groups.find(g=>g.name.includes('บูรชัย'));
  const burachaiMemberIds=new Set(burachaiGrp?S.groupMembers[burachaiGrp.id]||[]:[]);
  const f1Route=S.shops.find(s=>s.name==='F1');
  const f1Id=f1Route?.id;

  function _calcNet(e,emp){
    const deds=PR.deductions.filter(d=>d.entry_id===e.id);
    const totalDed=deds.reduce((s,d)=>s+d.amount,0);
    const base=(emp.daily_rate||0)*(e.days_worked||0);
    return{net:base+(e.bonus||0)-totalDed-(e.advance||0),base,totalDed};
  }
  function _entryLine(e,emp){
    const{net,base,totalDed}=_calcNet(e,emp);
    let parts=[`  ${emp.name}`];
    parts.push(`${e.days_worked}วัน`);
    if(!hr)parts.push(`฿${fmtN(base)}`);
    if(totalDed>0)parts.push(`หัก ${fmtN(totalDed)}`);
    if(e.bonus>0)parts.push(`+โบนัส ${fmtN(e.bonus)}`);
    parts.push(`→ ฿${fmtN(net)}`);
    return{line:parts.join('  '),net};
  }

  // ── ชุดที่ 1: เงินสดW ทุกสาย (F1 แยกยอด) ──
  const byRoute1={};
  ents.forEach(e=>{
    const emp=PR.employees.find(x=>x.id===e.employee_id);if(!emp)return;
    if(emp.payment_type&&emp.payment_type!=='เงินสดW')return; // เฉพาะเงินสดW
    const k=emp.route_id||'__none__';
    if(!byRoute1[k])byRoute1[k]=[];byRoute1[k].push({e,emp});
  });
  const sortedRoutes=Object.keys(byRoute1).sort((a,b)=>{
    if(a==='__none__')return 1;if(b==='__none__')return -1;
    return (S.shops.find(s=>s.id===a)?.sort_order||0)-(S.shops.find(s=>s.id===b)?.sort_order||0);
  });
  let lines1=[`💼 งวด ${slotLbl} ${mLbl}`,'─'.repeat(32),''];
  let tot1Main=0,tot1F1=0,cnt1=0;
  sortedRoutes.forEach(rid=>{
    const rt=S.shops.find(s=>s.id===rid);
    lines1.push(`📍 ${rt?rt.name:'ไม่มีสาย'}`);
    byRoute1[rid].forEach(({e,emp})=>{
      const{line,net}=_entryLine(e,emp);
      lines1.push(line);
      if(rid===f1Id)tot1F1+=net;else tot1Main+=net;
      cnt1++;
    });
    lines1.push('');
  });
  lines1.push('─'.repeat(32));
  lines1.push(`รวมทุกสาย (ยกเว้น F1)  ฿${fmtN(tot1Main)}`);
  if(f1Id&&byRoute1[f1Id])lines1.push(`รวม F1  ฿${fmtN(tot1F1)}`);
  lines1.push(`รวมทั้งหมด ${cnt1} คน  ฿${fmtN(tot1Main+tot1F1)}`);

  // ── ชุดที่ 2: กลุ่มบูรชัย (เงินสดW + โอนจ่ายM) — F1 ขึ้นก่อน บูรชัยตามหลัง ──
  const cashTransferTypes=new Set(['เงินสดW','โอนจ่ายM']);
  // แยก F1 กับ บูรชัย
  const byRoute2F1=[];const byRoute2Bur={};
  ents.forEach(e=>{
    const emp=PR.employees.find(x=>x.id===e.employee_id);if(!emp)return;
    const inBur=burachaiMemberIds.has(emp.route_id);
    const isF1=emp.route_id===f1Id;
    if(!inBur&&!isF1)return;
    const pt=emp.payment_type||'เงินสดW';
    if(!cashTransferTypes.has(pt))return;
    if(isF1){byRoute2F1.push({e,emp});}
    else{const k=emp.route_id||'__none__';if(!byRoute2Bur[k])byRoute2Bur[k]=[];byRoute2Bur[k].push({e,emp});}
  });
  let lines2=[``,`${'─'.repeat(32)}`,`💼 ${burachaiGrp?burachaiGrp.name:'บูรชัย'} — งวด ${slotLbl} ${mLbl}`,'─'.repeat(32),''];
  let tot2=0,cnt2=0;
  // บูรชัย เท่านั้น (ไม่รวม F1)
  Object.keys(byRoute2Bur).forEach(rid=>{
    const rt=S.shops.find(s=>s.id===rid);
    lines2.push(`📍 ${rt?rt.name:'ไม่มีสาย'}`);
    byRoute2Bur[rid].forEach(({e,emp})=>{
      const{line,net}=_entryLine(e,emp);
      const pt=emp.payment_type||'เงินสดW';
      lines2.push(line+(pt!=='เงินสดW'?` [${pt}]`:''));
      tot2+=net;cnt2++;
    });
    lines2.push('');
  });
  lines2.push('─'.repeat(32));
  lines2.push(`รวม ${cnt2} คน  ฿${fmtN(tot2)}`);

  const hasLines2=Object.keys(byRoute2Bur).length>0;

  // ── ชุดที่ 3: สรุปสั้น ส่งน้องลัดดา ──
  const ownerGrp=S.groups.find(g=>g.is_owner);
  const ownerName=ownerGrp?ownerGrp.name:'เฮียรวย';
  const lines3=[
    `💼 งวด ${slotLbl} ${mLbl}`,
    '─'.repeat(24),
    `${ownerName}  ฿${fmtN(tot1Main)}`,
    `F1  ฿${fmtN(tot1F1)}`,
    `${burachaiGrp?burachaiGrp.name:'บูรชัย'}  ฿${fmtN(tot2)}`,
  ];

  // ── เลือกว่าจะส่งชุดไหน ──
  window._sp1=lines1.join('\n');
  window._sp2=lines2.join('\n');
  window._sp3=lines3.join('\n');
  window._spTitle1=`งวด ${slotLbl} ${mLbl} (เฮียรวย)`;
  window._spTitle2=`งวด ${slotLbl} ${mLbl} (บูรชัย)`;
  window._spTitle3=`งวด ${slotLbl} ${mLbl} (สรุป)`;
  window._doShare=async function(key){
    const text=key===1?window._sp1:key===2?window._sp2:window._sp3;
    const title=key===1?window._spTitle1:key===2?window._spTitle2:window._spTitle3;
    CM();
    if(navigator.share){
      try{await navigator.share({title,text});return;}catch(e){if(e.name==='AbortError')return;}
    }
    try{await navigator.clipboard.writeText(text);toast('คัดลอกแล้ว ✓');}
    catch{
      const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
      toast('คัดลอกแล้ว ✓');
    }
  };
  OM(`📤 ส่งงวด ${slotLbl} ${mLbl}`,
    `<div style="display:flex;flex-direction:column;gap:12px;padding:8px 0;">
      <button onclick="_doShare(1)" class="btn btn-g" style="font-size:15px;padding:14px;">💼 ส่งให้เฮียรวย</button>
      ${hasLines2?`<button onclick="_doShare(2)" class="btn btn-b" style="font-size:15px;padding:14px;">🏢 ส่งให้บูรชัย</button>`:''}
      <button onclick="_doShare(3)" class="btn btn-b" style="font-size:15px;padding:14px;">🪙 ส่งให้น้องลัดดา</button>
    </div>`,
    `<button class="btn btn-x" onclick="CM()">ยกเลิก</button>`
  );
}

async function shareEmployeeList(){
  const active=PR.employees.filter(e=>e.status==='active');
  const fmtN=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  const groupedIds=new Set(Object.values(S.groupMembers).flat());
  const sortedGroups=[...S.groups].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  let lines=[`👥 รายชื่อพนักงาน (${active.length} คน)`,'─'.repeat(30)];
  // grouped routes
  sortedGroups.forEach(grp=>{
    const members=(S.groupMembers[grp.id]||[]).map(id=>S.shops.find(s=>s.id===id)).filter(Boolean).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    const grpEmps=members.flatMap(r=>active.filter(e=>e.route_id===r.id));
    if(!grpEmps.length)return;
    lines.push('');lines.push(`📁 ${grp.name}`);
    members.forEach(rt=>{
      const emps=active.filter(e=>e.route_id===rt.id);
      if(!emps.length)return;
      lines.push(`  📍 ${rt.name}`);
      emps.forEach(emp=>{
        const p=_prSettings.hideRates?'':`  ฿${fmtN(emp.daily_rate||0)}/วัน`;
        lines.push(`    • ${emp.name}${p}`);
      });
    });
  });
  // standalone routes
  const standaloneRoutes=[...S.shops].filter(r=>!groupedIds.has(r.id)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  standaloneRoutes.forEach(rt=>{
    const emps=active.filter(e=>e.route_id===rt.id);
    if(!emps.length)return;
    lines.push('');lines.push(`📍 ${rt.name}`);
    emps.forEach(emp=>{
      const p=_prSettings.hideRates?'':`  ฿${fmtN(emp.daily_rate||0)}/วัน`;
      lines.push(`  • ${emp.name}${p}`);
    });
  });
  // dept + none
  const deptMap={};
  active.filter(e=>!e.route_id).forEach(e=>{const k=e.department||'ไม่มีสาย';if(!deptMap[k])deptMap[k]=[];deptMap[k].push(e);});
  Object.entries(deptMap).forEach(([dept,emps])=>{
    lines.push('');lines.push(`🏢 ${dept}`);
    emps.forEach(emp=>{
      const p=_prSettings.hideRates?'':`  ฿${fmtN(emp.daily_rate||0)}/วัน`;
      lines.push(`  • ${emp.name}${p}`);
    });
  });
  const text=lines.join('\n');
  if(navigator.share){try{await navigator.share({title:'รายชื่อพนักงาน',text});return;}catch(e){if(e.name==='AbortError')return;}}

}
async function prUpdateEntry(entryId,field,value){
  const e=PR.entries.find(x=>x.id===entryId);if(!e)return;
  const emp=PR.employees.find(x=>x.id===e.employee_id);if(!emp)return;
  e[field]=parseFloat(value)||0;
  const deds=PR.deductions.filter(d=>d.entry_id===entryId);
  const net=(emp.daily_rate||0)*(e.days_worked||0)+(e.bonus||0)-deds.reduce((s,d)=>s+d.amount,0)-(e.advance||0);
  e.net_pay=net;
  // อัปเดต cell สุทธิใน DOM ทันที
  const netCell=document.getElementById('pr-net-'+entryId);
  if(netCell){netCell.textContent=fmt(net);netCell.style.color=net<0?'var(--red)':'var(--text)';}
  // อัปเดต header totals ทันที
  const periodId=e.period_id;
  const periodEnts=PR.entries.filter(x=>x.period_id===periodId);
  const _f1Id=S.shops.find(s=>s.name==='F1')?.id;
  const _burGrp=S.groups.find(g=>g.name.includes('บูรชัย'));
  const _burIds=new Set(_burGrp?S.groupMembers[_burGrp.id]||[]:[]);
  let _grand=0,_main=0,_f1=0,_bur=0;
  periodEnts.forEach(x=>{
    const xemp=PR.employees.find(p=>p.id===x.employee_id);if(!xemp)return;
    const xdeds=PR.deductions.filter(d=>d.entry_id===x.id);
    const xnet=(xemp.daily_rate||0)*(x.days_worked||0)+(x.bonus||0)-xdeds.reduce((s,d)=>s+d.amount,0)-(x.advance||0);
    const pt=xemp.payment_type||'เงินสดW';
    const inBur=_burIds.has(xemp.route_id);
    _grand+=xnet;
    if(xemp.route_id===_f1Id&&pt==='เงินสดW')_f1+=xnet;
    else if(inBur&&(pt==='เงินสดW'||pt==='โอนจ่ายM'))_bur+=xnet;
    else if(pt==='เงินสดW')_main+=xnet;
  });
  const _g=document.getElementById('pr-hdr-grand');if(_g)_g.textContent=fmt(_grand);
  const _m=document.getElementById('pr-hdr-main');if(_m)_m.textContent=fmt(_main);
  const _f=document.getElementById('pr-hdr-f1');if(_f)_f.textContent=fmt(_f1);
  const _b=document.getElementById('pr-hdr-bur');if(_b)_b.textContent=fmt(_bur);
  try{await sbUpsert('payroll_entries',[e]);}catch(err){toast('บันทึกไม่สำเร็จ');}
}

function prRecalcNet(entryId){
  const e=PR.entries.find(x=>x.id===entryId);if(!e)return;
  const emp=PR.employees.find(x=>x.id===e.employee_id);if(!emp)return;
  const days=parseFloat(document.getElementById('pe-days')?.value)||0;
  const bonus=parseFloat(document.getElementById('pe-bonus')?.value)||0;
  const adv=parseFloat(document.getElementById('pe-advance')?.value)||0;
  const deds=PR.deductions.filter(d=>d.entry_id===entryId);
  const net=(emp.daily_rate||0)*days+bonus-deds.reduce((s,d)=>s+d.amount,0)-adv;
  const el=document.getElementById('pe-net');if(el)el.textContent=fmt(net);
}

async function addDedFromLoan(entryId,periodId,loanId){
  const loan=PR.loans.find(l=>l.id===loanId);if(!loan)return;
  const d={id:uid(),entry_id:entryId,loan_id:loanId,type:loan.type,label:loan.description||loan.type,amount:loan.per_period_amount};
  try{
    await sbUpsert('payroll_deductions',[d]);PR.deductions.push(d);
    const e=PR.entries.find(x=>x.id===entryId);
    const emp=PR.employees.find(x=>x.id===e.employee_id);
    const deds=PR.deductions.filter(x=>x.entry_id===entryId);
    e.net_pay=(emp.daily_rate||0)*(e.days_worked||0)+(e.bonus||0)-deds.reduce((s,x)=>s+x.amount,0)-(e.advance||0);
    await sbUpsert('payroll_entries',[e]);
    CM();setTimeout(()=>openPrEntryDetail(entryId,periodId),50);
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);}
}

async function saveAddDed(entryId,periodId){
  const label=(document.getElementById('add-ded-label')?.value||'').trim();
  const amount=parseFloat(document.getElementById('add-ded-amount')?.value)||0;
  const perPeriod=parseFloat(document.getElementById('add-ded-per')?.value)||0;
  if(!label||!amount){toast('กรุณากรอกรายการและจำนวน');return;}
  const e=PR.entries.find(x=>x.id===entryId);
  const emp=PR.employees.find(x=>x.id===e.employee_id);
  try{
    let loanId=null;
    const dedAmount=(perPeriod>0&&perPeriod<amount)?perPeriod:amount;
    if(perPeriod>0&&perPeriod<amount){
      // สร้าง loan ใหม่เพื่อหักต่อเนื่องงวดถัดไป
      const loan={id:uid(),employee_id:emp.id,type:'other',description:label,
        total_amount:amount,per_period_amount:perPeriod,paid_amount:0,status:'active'};
      await sbUpsert('employee_loans',[loan]);
      PR.loans.push(loan);
      loanId=loan.id;
    }
    const d={id:uid(),entry_id:entryId,loan_id:loanId,type:'other',label,amount:dedAmount};
    await sbUpsert('payroll_deductions',[d]);PR.deductions.push(d);
    const deds=PR.deductions.filter(x=>x.entry_id===entryId);
    e.net_pay=(emp.daily_rate||0)*(e.days_worked||0)+(e.bonus||0)-deds.reduce((s,x)=>s+x.amount,0)-(e.advance||0);
    await sbUpsert('payroll_entries',[e]);
    CM();setTimeout(()=>openPrEntryDetail(entryId,periodId),50);
  }catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);}
}

function confirmMarkPaid(periodId){
  if(!confirm('ยืนยันว่าจ่ายเงินครบแล้ว?\n\nระบบจะอัปเดตยอดผ่อนชำระของทุกคนในงวดนี้'))return;
  markPeriodPaid(periodId);
}
async function markPeriodPaid(periodId){
  const period=PR.periods.find(p=>p.id===periodId);if(!period)return;
  period.status='paid';
  try{
    await sbUpsert('payroll_periods',[period]);
    const ents=PR.entries.filter(e=>e.period_id===periodId);
    const deds=PR.deductions.filter(d=>ents.some(e=>e.id===d.entry_id)&&d.loan_id);
    const lUpd={};
    deds.forEach(d=>{lUpd[d.loan_id]=(lUpd[d.loan_id]||0)+d.amount;});
    const lRows=[];
    for(const[lid,paid] of Object.entries(lUpd)){
      const l=PR.loans.find(x=>x.id===lid);if(!l)continue;
      l.paid_amount=(l.paid_amount||0)+paid;
      if(l.paid_amount>=l.total_amount)l.status='completed';
      lRows.push(l);
    }
    if(lRows.length>0)await sbUpsert('employee_loans',lRows);
    CM();toast('บันทึกการจ่ายเงินแล้ว ✓');renderPayroll();
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}

async function prMoveRoute(routeId,dir){
  // find the group this route belongs to (or standalone)
  let siblings;
  const grpId=Object.keys(S.groupMembers).find(gid=>S.groupMembers[gid].includes(routeId));
  if(grpId){
    siblings=(S.groupMembers[grpId]||[]).map(id=>S.shops.find(s=>s.id===id)).filter(Boolean).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  } else {
    const groupedIds=new Set(Object.values(S.groupMembers).flat());
    siblings=S.shops.filter(s=>!groupedIds.has(s.id)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  }
  const idx=siblings.findIndex(s=>s.id===routeId);
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=siblings.length)return;
  const a=siblings[idx],b=siblings[swapIdx];
  const tmpOrder=a.sort_order??idx;
  a.sort_order=b.sort_order??swapIdx;
  b.sort_order=tmpOrder;
  // ensure distinct values if both were 0
  if(a.sort_order===b.sort_order){a.sort_order=swapIdx;b.sort_order=idx;}
  try{
    await sbUpsert('routes',[{id:a.id,name:a.name,color:a.color,tab_flags:a.tab_flags,sort_order:a.sort_order},{id:b.id,name:b.name,color:b.color,tab_flags:b.tab_flags,sort_order:b.sort_order}]);
    renderPayroll();
  }catch(e){toast('เรียงไม่สำเร็จ: '+e.message);}
}
// ─── employee drag-to-reassign ───
let _dragEmpId=null,_dragGhost=null,_dragZone=null,_dragMoved=false,_dragStartX=0,_dragStartY=0,_dragSrc=null;

function _empTouchStart(e,empId){
  if(e.touches.length!==1)return;
  _dragEmpId=empId; _dragMoved=false; _dragGhost=null;
  _dragSrc=e.currentTarget;
  const t=e.touches[0];
  _dragStartX=t.clientX; _dragStartY=t.clientY;
  // ไม่ preventDefault → click ยังทำงานได้ตอน tap
}

function _empTouchMove(e){
  if(!_dragEmpId)return;
  const t=e.touches[0];
  const dx=t.clientX-_dragStartX, dy=t.clientY-_dragStartY;
  if(!_dragMoved&&Math.sqrt(dx*dx+dy*dy)<10)return;
  if(!_dragMoved){
    _dragMoved=true;
    if(_dragSrc){
      const rect=_dragSrc.getBoundingClientRect();
      _dragGhost=_dragSrc.cloneNode(true);
      Object.assign(_dragGhost.style,{
        position:'fixed',zIndex:'9999',pointerEvents:'none',
        width:rect.width+'px',opacity:'0.9',
        left:(t.clientX-rect.width/2)+'px',top:(t.clientY-50)+'px',
        transform:'scale(1.1)',boxShadow:'0 6px 20px #0009',
        background:'var(--bg3)',border:'2px solid var(--amber)',borderRadius:'8px'
      });
      document.body.appendChild(_dragGhost);
    }
  }
  if(!_dragGhost)return;
  const w=parseInt(_dragGhost.style.width);
  _dragGhost.style.left=(t.clientX-w/2)+'px';
  _dragGhost.style.top=(t.clientY-50)+'px';
  _dragGhost.style.display='none';
  const el=document.elementFromPoint(t.clientX,t.clientY);
  _dragGhost.style.display='';
  const zone=el?.closest('[data-drop-route]');
  if(_dragZone&&_dragZone!==zone)_dragZone.style.background='';
  _dragZone=zone||null;
  if(_dragZone)_dragZone.style.background='var(--amber)22';
  e.preventDefault(); // กัน scroll เฉพาะตอนลากจริงๆ
}

function _empDragCleanup(){
  if(_dragGhost){_dragGhost.remove();_dragGhost=null;}
  if(_dragZone){_dragZone.style.background='';_dragZone=null;}
  _dragEmpId=null;_dragMoved=false;_dragSrc=null;
}
let _dragOffX=0,_dragOffY=0;
function _empCreateGhost(x,y){
  if(!_dragSrc)return;
  const rect=_dragSrc.getBoundingClientRect();
  // offset = ตำแหน่งนิ้ว/เมาส์ภายใน chip ตอน touchstart/mousedown
  _dragOffX=x-rect.left;
  _dragOffY=y-rect.top;
  _dragGhost=_dragSrc.cloneNode(true);
  Object.assign(_dragGhost.style,{
    position:'fixed',zIndex:'9999',pointerEvents:'none',
    width:rect.width+'px',height:rect.height+'px',opacity:'0.9',
    left:(x-_dragOffX)+'px',top:(y-_dragOffY)+'px',
    transform:'scale(1.05)',boxShadow:'0 6px 20px #0009',
    background:'var(--bg3)',border:'2px solid var(--amber)',borderRadius:'8px'
  });
  document.body.appendChild(_dragGhost);
}
function _empUpdateZone(x,y){
  if(!_dragGhost)return;
  _dragGhost.style.display='none';
  const el=document.elementFromPoint(x,y);
  _dragGhost.style.display='';
  const zone=el?.closest('[data-drop-route]');
  if(_dragZone&&_dragZone!==zone)_dragZone.style.background='';
  _dragZone=zone||null;
  if(_dragZone)_dragZone.style.background='var(--amber)22';
}
async function _empDrop(empId,zone){
  if(!zone)return;
  const routeId=zone.dataset.dropRoute||null;
  const emp=PR.employees.find(x=>x.id===empId);
  if(emp&&emp.route_id!==(routeId||null)){
    toast('กำลังย้ายสาย...');
    await quickAssignRoute(empId,routeId);
    renderPayroll();
    toast('ย้ายสายสำเร็จ ✓');
  }
}

// touch
document.addEventListener('touchmove',e=>{
  if(!_dragEmpId)return;
  const t=e.touches[0];
  const dx=t.clientX-_dragStartX,dy=t.clientY-_dragStartY;
  if(!_dragMoved&&Math.sqrt(dx*dx+dy*dy)<10)return;
  if(!_dragMoved){_dragMoved=true;_empCreateGhost(t.clientX,t.clientY);}
  if(!_dragGhost)return;
  _dragGhost.style.left=(t.clientX-_dragOffX)+'px';
  _dragGhost.style.top=(t.clientY-_dragOffY)+'px';
  _empUpdateZone(t.clientX,t.clientY);
  e.preventDefault();
},{passive:false});
document.addEventListener('touchend',async e=>{
  if(!_dragEmpId)return;
  const empId=_dragEmpId,moved=_dragMoved,zone=_dragZone;
  _empDragCleanup();
  if(moved) await _empDrop(empId,zone);
});
document.addEventListener('touchcancel',_empDragCleanup);

// mouse (desktop)
function _empMouseStart(e,empId){
  if(e.button!==0)return;
  e.preventDefault();
  _dragEmpId=empId;_dragMoved=false;_dragGhost=null;
  _dragSrc=e.currentTarget;
  _dragStartX=e.clientX;_dragStartY=e.clientY;
}
document.addEventListener('mousemove',e=>{
  if(!_dragEmpId)return;
  const dx=e.clientX-_dragStartX,dy=e.clientY-_dragStartY;
  if(!_dragMoved&&Math.sqrt(dx*dx+dy*dy)<6)return;
  if(!_dragMoved){_dragMoved=true;_empCreateGhost(e.clientX,e.clientY);}
  if(!_dragGhost)return;
  _dragGhost.style.left=(e.clientX-_dragOffX)+'px';
  _dragGhost.style.top=(e.clientY-_dragOffY)+'px';
  _empUpdateZone(e.clientX,e.clientY);
});
document.addEventListener('mouseup',async e=>{
  if(!_dragEmpId)return;
  const empId=_dragEmpId,moved=_dragMoved,zone=_dragZone;
  _empDragCleanup();
  if(moved) await _empDrop(empId,zone);
  // !moved → click fires openEmpDetail เอง
});

async function quickAssignRoute(empId,routeId){
  const emp=PR.employees.find(e=>e.id===empId);if(!emp)return;
  emp.route_id=routeId||null;
  try{await sbUpsert('employees',[emp]);}catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}
async function saveEmployee(editId){
  const name=(document.getElementById('ae-name')?.value||'').trim();
  if(!name){toast('กรุณากรอกชื่อ');return;}
  const empId=editId||uid();

    route_id:document.getElementById('ae-route')?.value||null,
    nationality:document.getElementById('ae-nat')?.value||'ไทย',
    notes:document.getElementById('ae-notes')?.value||null,
    permit_expiry:document.getElementById('ae-permit-expiry')?.value||null,
    status:'active'
  };
  // salary fields — admin เท่านั้น
  if(!isHR()){
    emp.daily_rate=parseFloat(document.getElementById('ae-rate')?.value)||0;
    emp.phone_fee=parseFloat(document.getElementById('ae-phone')?.value)||0;
    emp.room_fee=parseFloat(document.getElementById('ae-room')?.value)||0;

    emp.position=document.getElementById('ae-pos')?.value||null;
    emp.payment_type=document.getElementById('ae-paytype')?.value||'เงินสดW';
  } else {
    // HR: คงค่าเดิมไว้ถ้าแก้ไข หรือใส่ default ถ้าเพิ่มใหม่
    const existing=PR.employees.find(e=>e.id===empId);
    emp.daily_rate=existing?.daily_rate??360;
    emp.phone_fee=existing?.phone_fee??0;
    emp.room_fee=existing?.room_fee??0;
    emp.department=existing?.department||null;
    emp.position=existing?.position||null;
    emp.payment_type=existing?.payment_type||'เงินสดW';
    // HR กรอก start_date ได้ตอนเพิ่มใหม่เท่านั้น
    if(!editId){
      const sd=document.getElementById('ae-start')?.value;
      if(sd) emp.start_date=sd;
    } else {
      emp.start_date=existing?.start_date||null;
    }
  }
  try{
    await sbUpsert('employees',[emp]);
    // บันทึก salary แยก table (admin เท่านั้น)
    if(!isHR()){
      await sbUpsert('employees_salary',[{employee_id:empId,daily_rate:emp.daily_rate,payment_type:emp.payment_type,phone_fee:emp.phone_fee,room_fee:emp.room_fee}]);
    }
    if(editId){const i=PR.employees.findIndex(e=>e.id===editId);if(i>=0)PR.employees[i]={...PR.employees[i],...emp};}
    else PR.employees.push(emp);
    CM();toast(`บันทึก ${name} แล้ว ✓`);renderPayroll();
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}

async function _uploadToCloudinary(file, publicId){
  const fd=new FormData();
  fd.append('file',file);
  fd.append('upload_preset','ladda_employees');
  fd.append('public_id',publicId);
  const res=await fetch('https://api.cloudinary.com/v1_1/dai58zx93/image/upload',{method:'POST',body:fd});
  const data=await res.json();
  if(!data.secure_url) throw new Error('upload failed');
  return data.secure_url;
}

async function _empPhotoUpsert(empId, patch){
  const emp=PR.employees.find(e=>e.id===empId); if(!emp) return;
  await sbUpsert('employees',[{...emp,...patch}]);
  Object.assign(emp,patch);
}

async function uploadEmpPhoto(empId, input){
  const file=input.files[0]; if(!file) return;
  toast('กำลังอัปโหลด...');
  try{
    const url=await _uploadToCloudinary(file,`emp_${empId}`);
    await _empPhotoUpsert(empId,{photo_url:url});
    toast('อัปโหลดรูปสำเร็จ ✓');
    CM(); setTimeout(()=>openEmpDetail(empId),50);
  } catch(e){ toast('อัปโหลดไม่สำเร็จ: '+e.message); }
}

async function uploadPermitPhoto(empId, input){
  const file=input.files[0]; if(!file) return;
  toast('กำลังอัปโหลด...');
  try{
    const emp=PR.employees.find(e=>e.id===empId); if(!emp) return;
    const photos=Array.isArray(emp.permit_photos)?[...emp.permit_photos]:[];
    if(photos.length>=4){ toast('อัปโหลดได้สูงสุด 4 รูป'); return; }
    const url=await _uploadToCloudinary(file,`emp_${empId}_permit_${Date.now()}`);
    photos.push(url);
    await _empPhotoUpsert(empId,{permit_photos:photos});
    toast('อัปโหลดใบอนุญาตสำเร็จ ✓');
    CM(); setTimeout(()=>openEmpDetail(empId),50);
  } catch(e){ toast('อัปโหลดไม่สำเร็จ: '+e.message); }
}

async function delPermitPhoto(empId, idx){
  if(!confirm('ลบรูปใบอนุญาตนี้?')) return;
  const emp=PR.employees.find(e=>e.id===empId); if(!emp) return;
  const photos=Array.isArray(emp.permit_photos)?[...emp.permit_photos]:[];
  photos.splice(idx,1);
  await _empPhotoUpsert(empId,{permit_photos:photos});
  CM(); setTimeout(()=>openEmpDetail(empId),50);
}

async function _allEmpField(empId,field,val){

  emp[field]=val;
  const salaryFields=['daily_rate','phone_fee','room_fee','department','position','payment_type'];
  try{
    if(salaryFields.includes(field)){
      await sbUpsert('employees_salary',[{employee_id:empId,daily_rate:emp.daily_rate??360,phone_fee:emp.phone_fee??0,room_fee:emp.room_fee??0,department:emp.department||null,position:emp.position||null,payment_type:emp.payment_type||'เงินสดW'}]);

      const{daily_rate,phone_fee,room_fee,department,position,payment_type,...empData}=emp;
      await sbUpsert('employees',[empData]);

}

            <option value="">-- ไม่ระบุ --</option>${_posOpts(emp.position||'')}</select></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">ค่าแรง/วัน</div>
            <input id="ae-rate" type="number" value="${emp.daily_rate||0}" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--mono);"></div>
          <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">สัญชาติ</div>
            <select id="ae-nat" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--font);">
              <option value="ไทย" ${emp.nationality==='ไทย'?'selected':''}>ไทย</option>
              <option value="เมียนมา" ${emp.nationality==='เมียนมา'?'selected':''}>เมียนมา</option>
              <option value="กัมพูชา" ${emp.nationality==='กัมพูชา'?'selected':''}>กัมพูชา</option>
              <option value="ลาว" ${emp.nationality==='ลาว'?'selected':''}>ลาว</option></select></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">ค่าโทร/งวด</div>
            <input id="ae-phone" type="number" value="${emp.phone_fee||0}" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--mono);"></div>
          <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">ค่าห้อง/งวด</div>
            <input id="ae-room" type="number" value="${emp.room_fee||0}" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--mono);"></div>
        </div>
        <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">ประเภทการจ่าย</div>
          <select id="ae-paytype" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--font);">
            ${_payTypeOpts(emp.payment_type||'เงินสดW')}</select></div>`;
    const natFieldHREdit=isHR()?`<div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">สัญชาติ</div>
      <select id="ae-nat" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--font);">
        <option value="ไทย" ${emp.nationality==='ไทย'?'selected':''}>ไทย</option>
        <option value="เมียนมา" ${emp.nationality==='เมียนมา'?'selected':''}>เมียนมา</option>
        <option value="กัมพูชา" ${emp.nationality==='กัมพูชา'?'selected':''}>กัมพูชา</option>
        <option value="ลาว" ${emp.nationality==='ลาว'?'selected':''}>ลาว</option></select></div>`:'';
    OM('แก้ไขพนักงาน',
      `<div style="display:grid;gap:10px;">
        <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">ชื่อ *</div>
          <input id="ae-name" value="${emp.name}" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--font);"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">สาย</div>
            <select id="ae-route" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--font);">
              <option value="">-- ไม่มีสาย --</option>${routeOpts}</select></div>
          ${salaryFieldsEdit}
        </div>
        ${natFieldHREdit}
        <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">วันหมดอายุบัตร</div>
          <input id="ae-permit-expiry" type="date" value="${emp.permit_expiry||''}" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--font);"></div>
        <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">หมายเหตุ</div>
          <input id="ae-notes" value="${emp.notes||''}" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--font);"></div>
      </div>`,
      `<div style="display:flex;gap:8px;">
        <button class="btn btn-x" onclick="CMask()">ยกเลิก</button>
        <button class="btn btn-g" onclick="saveEmployee('${empId}')">บันทึก</button>
      </div>`
    );
  },50);
}

async function setEmpStatus(empId,status){
  const msgs={resigned:'ยืนยันว่าออกจากงาน?',blacklisted:'ใส่ blacklist ห้ามรับกลับ?',active:'ยกเลิก blacklist?'};
  if(!confirm(msgs[status]||'ยืนยัน?'))return;
  const emp=PR.employees.find(e=>e.id===empId);if(!emp)return;
  emp.status=status;
  emp.resign_date=(status==='resigned'||status==='blacklisted')?today():null;
  try{await sbUpsert('employees',[emp]);CM();toast('อัปเดตสถานะแล้ว ✓');renderPayroll();}
  catch(e){toast('บันทึกไม่สำเร็จ');}
}

function openAddLoan(empId){
  CM();
  setTimeout(()=>{
    OM('เพิ่มรายการค้าง / ยืม',
      `<div style="display:grid;gap:10px;">
        <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">ประเภท *</div>
          <select id="al-type" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--font);">
            <option value="permit">บัตร (ใบอนุญาตทำงาน)</option>
            <option value="loan">ยืม</option>
            <option value="other">อื่นๆ</option></select></div>
        <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">รายละเอียด</div>
          <input id="al-desc" placeholder="เช่น AN14.20/2/25" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--font);"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">ยอดรวม *</div>
            <input id="al-total" type="number" placeholder="0" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--mono);"></div>
          <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">หักงวดละ *</div>
            <input id="al-per" type="number" placeholder="0" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--mono);"></div>
        </div>
        <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">จ่ายไปแล้ว (ถ้ามี)</div>
          <input id="al-paid" type="number" value="0" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--mono);"></div>
      </div>`,
      `<div style="display:flex;gap:8px;">
        <button class="btn btn-x" onclick="CM();setTimeout(()=>openEmpDetail('${empId}'),50)">ยกเลิก</button>
        <button class="btn btn-g" onclick="saveLoan('${empId}')">บันทึก</button>
      </div>`
    );
  },50);
}

async function saveLoan(empId){
  const total=parseFloat(document.getElementById('al-total')?.value)||0;
  const per=parseFloat(document.getElementById('al-per')?.value)||0;
  if(!total||!per){toast('กรุณากรอกยอดรวมและงวดละ');return;}
  const loan={id:uid(),employee_id:empId,type:document.getElementById('al-type')?.value,description:document.getElementById('al-desc')?.value||null,total_amount:total,per_period_amount:per,paid_amount:parseFloat(document.getElementById('al-paid')?.value)||0,interest_rate:0,status:'active'};
  if(loan.paid_amount>=loan.total_amount)loan.status='completed';
  try{await sbUpsert('employee_loans',[loan]);PR.loans.push(loan);CM();toast('บันทึกแล้ว ✓');setTimeout(()=>openEmpDetail(empId),50);}
  catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}

function openEditLoan(loanId,empId){
  const l=PR.loans.find(x=>x.id===loanId);if(!l)return;
  CM();
  setTimeout(()=>{
    OM('แก้ไขรายการค้าง',
      `<div style="display:grid;gap:10px;">
        <div style="font-size:14px;font-weight:500;color:var(--text);">${l.description||l.type}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">ยอดรวม</div>
            <input id="el-total" type="number" value="${l.total_amount}" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--mono);"></div>
          <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">หักงวดละ</div>
            <input id="el-per" type="number" value="${l.per_period_amount}" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--mono);"></div>
        </div>
        <div><div style="font-size:13px;color:var(--text2);margin-bottom:4px;">ชำระไปแล้ว</div>
          <input id="el-paid" type="number" value="${l.paid_amount}" style="width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:14px;font-family:var(--mono);"></div>
      </div>`,
      `<div style="display:flex;gap:8px;">
        <button class="btn btn-x" onclick="CM();setTimeout(()=>openEmpDetail('${empId}'),50)">ยกเลิก</button>
        <button class="btn btn-g" onclick="saveEditLoan('${loanId}','${empId}')">บันทึก</button>
      </div>`
    );
  },50);
}

async function saveEditLoan(loanId,empId){
  const l=PR.loans.find(x=>x.id===loanId);if(!l)return;
  l.total_amount=parseFloat(document.getElementById('el-total')?.value)||0;
  l.per_period_amount=parseFloat(document.getElementById('el-per')?.value)||0;
  l.paid_amount=parseFloat(document.getElementById('el-paid')?.value)||0;
  if(l.paid_amount>=l.total_amount)l.status='completed';
  try{await sbUpsert('employee_loans',[l]);CM();toast('บันทึกแล้ว ✓');setTimeout(()=>openEmpDetail(empId),50);}
  catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);}
}

authInit();
</script>
</body>
</html>
